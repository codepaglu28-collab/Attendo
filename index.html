<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="logo.ico">
<title>Attendo — Smart Attendance, Simple Roll Call</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
/* ============================= TOKENS ============================= */
:root{
  --blue:#2B6CF6; --blue-deep:#1E4FD1; --blue-soft:#EAF1FF;
  --mint:#12C99B; --mint-deep:#0EA37D; --mint-soft:#E1FBF3;
  --navy:#0B1E3D; --slate:#64748B; --border:#E7ECF5;
  --amber:#F5A524; --amber-soft:#FFF4E0; --amber-text:#92660E;
  --red:#EF5A5A; --red-soft:#FDEBEB;
  --bg:#FAFCFF; --card-shadow:0 1px 2px rgba(11,30,61,.04), 0 8px 24px -12px rgba(11,30,61,.08);
  --surface:#fff; --surface-2:#F4F7FC; --surface-3:#F7FAFD; --table-head-bg:#F8FAFD;
}
html.dark{
  --blue:#5B8DFF; --blue-deep:#8FB4FF; --blue-soft:#17253F;
  --mint:#2FE1B4; --mint-deep:#6FEFCB; --mint-soft:#0F2E28;
  --navy:#E7ECFA; --slate:#93A4C4; --border:#26314E;
  --amber:#FFC155; --amber-soft:#3B2C10; --amber-text:#FFCB70;
  --red:#FF7C7C; --red-soft:#3A1A1A;
  --bg:#0B1220; --card-shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.6);
  --surface:#131B2E; --surface-2:#1A2439; --surface-3:#1E293F; --table-head-bg:#141D33;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--navy); background:var(--bg); -webkit-font-smoothing:antialiased;
  transition:background .15s,color .15s;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none;}
input,select{font-family:inherit;}
ul{list-style:none;}
img{max-width:100%; display:block;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#D7E0F0; border-radius:8px;}

.container{max-width:1200px; margin:0 auto; padding:0 24px;}

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border-radius:12px; font-weight:600; font-size:14px; padding:10px 18px;
  transition:.15s; white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5; pointer-events:none;}
.btn-lg{padding:14px 26px; font-size:16px; border-radius:14px;}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:10px;}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-deep)); color:#fff; box-shadow:0 6px 16px -6px rgba(43,108,246,.5);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-mint{background:linear-gradient(135deg,var(--mint),var(--mint-deep)); color:#fff; box-shadow:0 6px 16px -6px rgba(18,201,155,.5);}
.btn-mint:hover{filter:brightness(1.06);}
.new-badge{position:absolute; top:-8px; right:-8px; background:#EF5A5A; color:#fff; font-size:9.5px; font-weight:800; letter-spacing:.03em; padding:2px 6px; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.2); pointer-events:none;}
.btn-outline{background:var(--surface); color:var(--navy); border:1px solid var(--border);}
.btn-outline:hover{background:var(--surface-3);}
.btn-ghost{background:var(--blue-soft); color:var(--blue-deep);}
.btn-ghost:hover{filter:brightness(1.03);}
.btn-danger{background:var(--red-soft); color:var(--red);}
.btn-danger:hover{filter:brightness(.98);}
.btn-subtle{background:#F4F7FC; color:var(--navy);}
.icon{width:15px; height:15px; stroke-width:2.25; flex-shrink:0;}

/* ============================= CARD ============================= */
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--card-shadow);}
.card-hover{transition:.2s;}
.card-hover:hover{transform:translateY(-2px); box-shadow:0 20px 34px -18px rgba(11,30,61,.18);}

/* ============================= INPUT ============================= */
.field{display:block; margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; margin-bottom:6px; color:var(--navy);}
.input{
  width:100%; padding:10px 14px; border-radius:12px; border:1px solid var(--border);
  font-size:14px; outline:none; transition:.15s; background:var(--surface); color:var(--navy);
}
.input:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft);}
select.input{width:auto;}

/* ============================= BADGE ============================= */
.badge{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:5px 11px; font-size:12px; font-weight:700;}

/* ============================= TOAST ============================= */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  z-index:400; display:none; align-items:center; gap:12px;
  background:var(--navy); color:#fff; border-radius:16px; padding:14px 20px;
  box-shadow:0 20px 45px -15px rgba(11,30,61,.5); font-size:14px; font-weight:500;
  animation:toastIn .25s ease-out;
}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);}}
.toast-tick{width:26px; height:26px; border-radius:999px; background:var(--mint); display:grid; place-items:center; flex-shrink:0;}

/* ============================= LANDING ============================= */
.nav-landing{position:sticky; top:0; z-index:100; backdrop-filter:blur(10px); background:rgba(255,255,255,.85); border-bottom:1px solid var(--border);}
.nav-landing .container{height:64px; display:flex; align-items:center; justify-content:space-between;}
.nav-links{display:flex; gap:32px; font-size:14px; font-weight:500; color:var(--slate);}
.nav-links a:hover{color:var(--navy);}
.logo{display:flex; align-items:center; gap:8px;}
.logo-mark{width:32px; height:32px; border-radius:12px; background:linear-gradient(135deg,var(--blue),var(--mint)); display:grid; place-items:center; flex-shrink:0;}
.logo-text{font-size:17px; font-weight:800; letter-spacing:-.02em;}

.hero{padding:70px 0 90px; display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center;}
.eyebrow{display:inline-flex; align-items:center; gap:6px; background:var(--blue-soft); color:var(--blue-deep); font-size:12px; font-weight:700; padding:7px 13px; border-radius:999px; margin-bottom:22px;}
.hero h1{font-size:56px; line-height:1.05; font-weight:800; letter-spacing:-.02em; color:var(--navy);}
.hero h1 span{color:var(--blue);}
.hero p{font-size:18px; line-height:1.6; color:var(--slate); max-width:460px; margin-top:22px;}
.hero-cta{display:flex; gap:12px; margin-top:32px;}
.hero-trust{display:flex; gap:24px; margin-top:36px; font-size:14px; color:var(--slate);}
.hero-trust > div{display:flex; align-items:center; gap:6px;}

.section-eyebrow{font-size:13px; font-weight:700; color:var(--blue); margin-bottom:8px; letter-spacing:.02em;}
.section-title{font-size:32px; font-weight:800; color:var(--navy); letter-spacing:-.01em;}
.section{padding:64px 0;}
.section-tinted{background:linear-gradient(180deg,#F8FBFF,#FFFFFF);}

.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
.dash-charts-grid{display:grid; grid-template-columns:1fr 2fr; gap:20px;}

.org-tile{padding:20px; display:flex; align-items:center; gap:12px;}
.org-tile .ic{width:40px; height:40px; border-radius:12px; background:var(--blue-soft); display:grid; place-items:center; flex-shrink:0;}
.org-tile span{font-size:14px; font-weight:600;}

.feature-card{padding:26px;}
.feature-ic{width:44px; height:44px; border-radius:16px; background:linear-gradient(135deg,var(--blue-soft),var(--mint-soft)); display:grid; place-items:center; margin-bottom:16px;}
.feature-card h3{font-size:16px; font-weight:700; margin-bottom:6px;}
.feature-card p{font-size:14px; color:var(--slate); line-height:1.55;}

.step{padding-right:12px;}
.step .num{font-size:46px; font-weight:800; color:var(--blue-soft); margin-bottom:10px;}
.step h4{font-size:17px; font-weight:700; margin-bottom:6px;}
.step p{font-size:14px; color:var(--slate); line-height:1.55;}


.security-card{padding:44px; border-radius:20px; background:linear-gradient(135deg,var(--navy),#122A55); display:grid; grid-template-columns:1fr 1fr; gap:32px; align-items:center; border:none;}
.security-card h2{color:#fff; font-size:24px; font-weight:800; margin:14px 0 10px;}
.security-card p{color:#B9C6E0; font-size:14px; line-height:1.6;}
.security-pills{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.security-pills div{background:rgba(255,255,255,.08); color:#fff; border-radius:12px; padding:12px 14px; font-size:13.5px; font-weight:600;}

.testi-card{padding:24px;}
.testi-card p{font-size:14px; line-height:1.6; margin-bottom:16px;}
.testi-name{font-size:14px; font-weight:700;}
.testi-role{font-size:12px; color:var(--slate);}


.faq-item{padding:18px 20px; cursor:pointer;}
.faq-q{display:flex; align-items:center; justify-content:between; justify-content:space-between; font-size:14px; font-weight:700;}
.faq-a{font-size:13.5px; color:var(--slate); margin-top:10px; line-height:1.6; display:none;}
.faq-item.open .faq-a{display:block;}
.faq-item.open .chev{transform:rotate(90deg);}
.chev{transition:.15s;}

.footer{border-top:1px solid var(--border); padding:36px 0; display:flex; justify-content:space-between; align-items:center; margin-top:20px;}
.footer-copy{font-size:12px; color:var(--slate);}
.credit-card{
  display:flex; align-items:center; gap:14px;
  padding:14px 18px 14px 14px; border-radius:18px;
  background:linear-gradient(135deg,var(--blue-soft),var(--mint-soft));
  border:1px solid var(--border);
  box-shadow:0 14px 30px -20px rgba(11,30,61,.4);
  margin-top:8px;
}
.credit-avatar{
  width:42px; height:42px; border-radius:999px; flex-shrink:0;
  display:grid; place-items:center; color:#fff; font-weight:800; font-size:14px;
  background:linear-gradient(135deg,var(--blue),var(--mint));
  box-shadow:0 6px 14px -4px rgba(43,108,246,.5);
}
.credit-info{text-align:left;}
.credit-label{font-size:10px; color:var(--slate); text-transform:uppercase; letter-spacing:.06em; font-weight:700;}
.credit-name{font-size:14.5px; font-weight:800; color:var(--navy); margin-top:1px;}
.credit-mail{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
  color:var(--blue-deep); text-decoration:none; padding:8px 14px; border-radius:999px;
  background:var(--surface); border:1px solid var(--border); transition:.15s; margin-left:4px;
}
.credit-mail:hover{background:var(--blue-soft); border-color:var(--blue);}
.credit-mail svg{width:14px; height:14px; flex-shrink:0;}

/* ============================= 3D FLOAT CARD ============================= */
.float-wrap{position:relative; height:400px; perspective:1400px;}
@keyframes floatY{0%,100%{transform:translateY(0) rotateY(-10deg) rotateX(4deg);} 50%{transform:translateY(-14px) rotateY(-10deg) rotateX(4deg);}}
@keyframes floatY2{0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);}}
@keyframes orbit{from{transform:rotate(0deg) translateX(150px) rotate(0deg);} to{transform:rotate(360deg) translateX(150px) rotate(-360deg);}}
@keyframes orbit2{from{transform:rotate(90deg) translateX(170px) rotate(-90deg);} to{transform:rotate(450deg) translateX(170px) rotate(-450deg);}}
.orbit-wrap{position:absolute; inset:0; display:grid; place-items:center;}
.orbit-a{position:absolute; width:34px; height:34px; border-radius:12px; background:var(--mint-soft); display:grid; place-items:center; animation:orbit 14s linear infinite;}
.orbit-b{position:absolute; width:34px; height:34px; border-radius:12px; background:var(--blue-soft); display:grid; place-items:center; animation:orbit2 18s linear infinite;}
.float-main{
  position:absolute; inset:32px 16px auto 16px; border-radius:24px; padding:24px;
  background:linear-gradient(160deg, rgba(255,255,255,.92), rgba(234,241,255,.85));
  backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.6);
  box-shadow:0 30px 60px -20px rgba(30,79,209,.35), inset 0 1px 0 rgba(255,255,255,.8);
  transform-style:preserve-3d; animation:floatY 6s ease-in-out infinite;
}
.float-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
.float-pct{font-size:30px; font-weight:800;}
.float-label{font-size:11px; font-weight:700; color:var(--slate); letter-spacing:.03em;}
.float-ring{width:64px; height:64px; position:relative;}
.float-ring svg{transform:rotate(-90deg);}
.float-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.float-stat{border-radius:16px; padding:12px; text-align:left;}
.float-stat .n{font-size:17px; font-weight:800;}
.float-stat .l{font-size:10.5px; font-weight:600;}
.float-chip{
  position:absolute; left:0; bottom:20px; background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:9px 12px; display:flex; align-items:center; gap:9px;
  box-shadow:0 20px 30px -15px rgba(11,30,61,.25); animation:floatY2 7s ease-in-out infinite .5s;
}
.chip-av{width:28px; height:28px; border-radius:999px; display:grid; place-items:center; color:#fff; font-size:11px; font-weight:800; background:linear-gradient(135deg,var(--blue),var(--mint));}

/* ============================= AUTH ============================= */
.auth-wrap{min-height:100vh; display:grid; grid-template-columns:1fr 1fr;}
.auth-side{background:linear-gradient(160deg,var(--navy),#10265A); padding:48px; display:flex; flex-direction:column; justify-content:space-between;}
.auth-quote{color:#9FB1D4; font-size:13.5px; line-height:1.6;}
.auth-form-wrap{display:flex; align-items:center; justify-content:center; padding:32px;}
.auth-form{width:100%; max-width:380px;}
.auth-title{font-size:26px; font-weight:800; margin-bottom:6px;}
.auth-sub{font-size:14px; color:var(--slate); margin-bottom:26px;}
.auth-row{display:flex; align-items:center; justify-content:space-between; font-size:13.5px; margin-bottom:16px;}
.auth-switch{text-align:center; font-size:14px; color:var(--slate); margin-top:22px;}
.auth-switch button{color:var(--blue); font-weight:700; background:none;}
.auth-mobile-back{display:none;}
.auth-divider{display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--slate); font-size:12.5px;}
.auth-divider::before, .auth-divider::after{content:''; flex:1; height:1px; background:var(--border);}
.auth-google-btn{display:flex; align-items:center; justify-content:center; gap:10px;}

/* ============================= APP SHELL ============================= */
.shell{min-height:100vh; display:flex; background:var(--bg);}
.sidebar{width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); padding:16px; display:flex; flex-direction:column;}
.sidebar-logo{padding:8px; margin-bottom:22px;}
.nav-item{
  width:100%; display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px;
  font-size:14px; font-weight:600; color:var(--slate); background:none; text-align:left;
}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--blue-soft); color:var(--blue-deep);}
.nav-list{display:flex; flex-direction:column; gap:2px; flex:1;}
.quickroll-btn{display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:12px; font-size:14px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--mint),var(--mint-deep)); margin-bottom:12px;}
.user-chip{display:flex; align-items:center; gap:9px; padding:8px; border-radius:12px; background:var(--surface-2);}
.user-av{width:32px; height:32px; border-radius:999px; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:800; background:linear-gradient(135deg,var(--blue),var(--mint)); flex-shrink:0;}
.user-meta{flex:1; min-width:0;}
.user-name{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.user-role{font-size:11px; color:var(--slate);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{height:64px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 28px; border-bottom:1px solid var(--border); background:var(--surface);}
.search-box{display:flex; align-items:center; gap:8px; background:var(--surface-2); border-radius:12px; padding:9px 13px; width:280px;}
.search-box input{background:none; border:none; outline:none; font-size:14px; flex:1; color:var(--navy);}
.global-search-results{
  position:absolute; top:calc(100% + 8px); left:0; width:340px; max-height:380px; overflow-y:auto;
  background:#fff; border:1px solid var(--border); border-radius:14px;
  box-shadow:0 24px 44px -14px rgba(11,30,61,.2); z-index:300; display:none;
}
.global-search-results.open{display:block;}
.gsr-sec-label{font-size:11px; font-weight:700; color:var(--slate); padding:10px 14px 4px; text-transform:uppercase; letter-spacing:.03em;}
.gsr-item{display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer;}
.gsr-item:hover{background:var(--surface-3);}
.gsr-name{font-size:13px; font-weight:700; color:var(--navy);}
.gsr-sub{font-size:11px; color:var(--slate);}
.gsr-empty{padding:18px 14px; text-align:center; font-size:13px; color:var(--slate);}
.gsr-ic{width:28px; height:28px; border-radius:9px; display:grid; place-items:center; flex-shrink:0; background:var(--blue-soft);}
.bell-wrap{position:relative;}
.bell-dot{position:absolute; top:-4px; right:-4px; width:16px; height:16px; border-radius:999px; background:var(--red); color:#fff; font-size:9px; font-weight:800; display:grid; place-items:center;}
.notif-panel{position:absolute; top:calc(100% + 10px); right:0; width:320px; max-height:420px; overflow-y:auto; background:#fff; border:1px solid var(--border); border-radius:14px; box-shadow:0 24px 44px -14px rgba(11,30,61,.22); z-index:300; display:none;}
.notif-panel.open{display:block;}
.notif-panel-head{padding:14px 16px 10px; font-size:13px; font-weight:800; color:var(--navy); border-bottom:1px solid var(--border);}
.notif-item{padding:12px 16px; border-bottom:1px solid var(--border);}
.notif-item:last-child{border-bottom:none;}
.notif-title{font-size:13px; font-weight:700; color:var(--navy); margin-bottom:2px;}
.notif-msg{font-size:12.5px; color:var(--slate); line-height:1.4;}
.notif-meta{font-size:10.5px; color:var(--slate); margin-top:6px; text-transform:uppercase; letter-spacing:.02em;}
.notif-empty{padding:24px 16px; text-align:center; font-size:12.5px; color:var(--slate);}
.tt-img{width:100%; border-radius:14px; border:1px solid var(--border); display:block; margin-bottom:8px;}
.tt-label{font-size:13px; font-weight:700; color:var(--navy); margin-bottom:10px;}
.view{flex:1; overflow-y:auto; padding:32px; max-width:1180px; margin:0 auto; width:100%;}

/* ============================= DASHBOARD ============================= */
.dash-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;}
.dash-head h1{font-size:24px; font-weight:800;}
.dash-head p{font-size:14px; color:var(--slate); margin-top:2px;}

.stat-card{padding:18px;}
.stat-ic{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; margin-bottom:12px;}
.stat-val{font-size:24px; font-weight:800;}
.stat-lbl{font-size:12px; font-weight:600; color:var(--slate);}

.today-ring{width:140px; height:140px; margin:0 auto 16px;}
.legend-row{display:flex; align-items:center; justify-content:space-between; font-size:13.5px; margin-bottom:8px;}
.legend-row .dotwrap{display:flex; align-items:center; gap:8px;}
.dot{width:8px; height:8px; border-radius:999px;}

.class-row{padding:18px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
.class-time{font-size:11.5px; font-weight:700; color:var(--blue); margin-bottom:3px;}
.class-title{font-size:14px; font-weight:700;}
.class-meta{font-size:12px; color:var(--slate); margin-top:3px;}

.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px; text-align:center;}
.empty-ic{width:48px; height:48px; border-radius:16px; background:var(--surface-2); display:grid; place-items:center; margin-bottom:12px;}
.empty-txt{font-size:13.5px; font-weight:600; color:var(--slate); margin-bottom:10px;}

/* ============================= ROLL CALL ============================= */
.rc-meta-bar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; padding:20px; margin-bottom:20px;}
.rc-meta-inner{display:flex; flex-wrap:wrap; gap:26px;}
.rc-meta .l{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--slate); letter-spacing:.03em;}
.rc-meta .v{font-size:14px; font-weight:800;}
.rc-toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:16px;}
.rc-counts{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
.rc-count{border-radius:14px; padding:12px; text-align:center;}
.rc-count .n{font-size:18px; font-weight:800;}
.rc-count .l{font-size:11px; font-weight:600;}

.student-row{display:flex; align-items:center; gap:16px; padding:14px 18px; border-top:1px solid var(--border);}
.student-row:first-child{border-top:none;}
.s-av{width:36px; height:36px; border-radius:999px; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:800; background:linear-gradient(135deg,var(--blue),var(--mint)); flex-shrink:0;}
.s-roll{width:auto; min-width:56px; max-width:92px; font-size:12px; font-weight:700; color:var(--slate); flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-right:2px;}
.s-info{flex:1; min-width:0;}
.s-name{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.s-sub{font-size:11.5px; color:var(--slate);}
.status-btns{display:flex; gap:6px; flex-shrink:0;}
.status-btn{width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--surface-2); color:var(--slate); transition:.12s;}
.status-btn:active{transform:scale(.9);}
.status-btn.active{color:#fff;}

.rc-savebar{position:sticky; bottom:16px; margin-top:20px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border-radius:16px; background:var(--surface); border:1px solid var(--border); box-shadow:0 20px 40px -20px rgba(11,30,61,.25);}
.rc-savebar .status-txt{font-size:13.5px; color:var(--slate);}

/* ============================= QUICK ROLL CALL ============================= */
.qr-overlay{position:fixed; inset:0; z-index:500; display:flex; flex-direction:column; background:linear-gradient(160deg,var(--navy),#0F2452); overflow-y:auto;}
.qr-top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:24px; flex-shrink:0;}
.qr-exit{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; color:#fff; background:rgba(255,255,255,.1); padding:9px 16px 9px 12px; border-radius:999px; flex-shrink:0;}
.qr-exit:hover{background:rgba(255,255,255,.18);}
.qr-classname{font-size:13.5px; font-weight:700; color:rgba(255,255,255,.7); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
.qr-body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; min-height:0;}
.qr-progtxt{color:rgba(255,255,255,.5); font-size:13.5px; font-weight:700; margin-bottom:8px;}
.qr-progbar{width:260px; max-width:100%; height:6px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; margin-bottom:40px;}
.qr-progbar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--blue),var(--mint)); transition:width .25s;}
.qr-avatar{width:224px; height:224px; border-radius:999px; display:grid; place-items:center; font-size:48px; font-weight:800; color:#fff; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.15); margin-bottom:24px; position:relative; flex-shrink:0;}
.qr-status-pill{position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); white-space:nowrap; border-radius:999px; padding:6px 16px; font-size:13.5px; font-weight:800; color:#fff;}
.qr-name{font-size:26px; font-weight:800; color:#fff; margin-bottom:4px; text-align:center; padding:0 12px;}
.qr-sub{color:rgba(255,255,255,.5); font-size:13.5px; margin-bottom:40px; text-align:center;}
.qr-btns{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; max-width:100%;}
.qr-btn{width:96px; height:96px; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; font-weight:800; color:#fff; flex-shrink:0;}
.qr-btn:active{transform:scale(.95);}
.qr-hint{display:flex; align-items:center; gap:22px; margin-top:40px; color:rgba(255,255,255,.5); font-size:12px; flex-wrap:wrap; justify-content:center;}
.qr-hint button{display:flex; align-items:center; gap:4px; background:none; color:inherit; padding:6px; }
.qr-hint button:hover{color:#fff;}
.qr-hint .qr-kbd-only{display:inline;}
.qr-bottom{padding:24px; display:flex; justify-content:center; flex-shrink:0;}

@media (max-width: 480px){
  /*
   * At 3 x 96px + 2 x 16px gaps, the status buttons alone need 320px —
   * wider than the available space on almost any phone once the 24px
   * side padding is subtracted, which was pushing/clipping the third
   * button off-screen. Scaling everything down here keeps the whole
   * card (avatar, name, buttons, hints) on-screen without overflow.
   */
  .qr-top{padding:16px;}
  .qr-body{padding:16px 16px 8px;}
  .qr-avatar{width:150px; height:150px; font-size:34px; margin-bottom:18px;}
  .qr-name{font-size:21px;}
  .qr-sub{margin-bottom:26px;}
  .qr-progbar{margin-bottom:26px;}
  .qr-btns{gap:10px;}
  .qr-btn{width:84px; height:84px; border-radius:16px;}
  .qr-hint{margin-top:26px; gap:14px; font-size:11.5px;}
  .qr-hint .qr-kbd-only{display:none;}
  .qr-bottom{padding:16px;}
}

/* ============================= TABLES ============================= */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{text-align:left; font-weight:700; color:var(--slate); padding:12px 16px; background:var(--table-head-bg); font-size:12.5px;}
tbody td{padding:12px 16px; border-top:1px solid var(--border); vertical-align:middle;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:#FAFBFE;}
.table-wrap{overflow-x:auto;}

/* ============================= STUDENTS ============================= */
.page-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px;}
.page-head h1{font-size:24px; font-weight:800;}
.page-head p{font-size:14px; color:var(--slate); margin-top:2px;}
.filters-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
.filters-row .search-box{flex:1; min-width:200px;}

.tname{display:flex; align-items:center; gap:11px;}
.tname .n{font-weight:700; font-size:13.5px;}
.tname .s{font-size:11.5px; color:var(--slate);}
.row-actions{display:flex; justify-content:flex-end; gap:4px;}
.icon-btn{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:none;}
.icon-btn:hover{background:var(--surface-2);}

/* ============================= MODAL ============================= */
.modal-overlay{position:fixed; inset:0; z-index:600; background:rgba(11,30,61,.4); display:flex; align-items:center; justify-content:center; padding:16px;}
.modal{width:100%; max-width:420px; max-height:90vh; overflow-y:auto; padding:24px;}
.modal-lg{max-width:720px;}
@media(max-width:640px){ .modal-lg{max-width:100%;} }
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h3{font-size:17px; font-weight:800;}
.modal-close{background:none;}
.modal-grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.modal-actions{display:flex; gap:10px; padding-top:6px;}
.modal-actions .btn{flex:1;}

/* ============================= PROFILE ============================= */
.back-link{display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--blue); background:none; margin-bottom:18px;}
.profile-head{padding:24px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px;}
.profile-id{display:flex; align-items:center; gap:16px;}
.profile-av{width:64px; height:64px; border-radius:20px; display:grid; place-items:center; color:#fff; font-size:20px; font-weight:800; background:linear-gradient(135deg,var(--blue),var(--mint));}
.profile-name{font-size:19px; font-weight:800;}
.profile-meta{font-size:13.5px; color:var(--slate); margin-top:2px;}
.statbox{padding:16px; text-align:center;}
.statbox .n{font-size:19px; font-weight:800;}
.statbox .l{font-size:11.5px; font-weight:600; color:var(--slate); margin-top:4px;}
.hist-row{display:flex; align-items:center; justify-content:space-between; font-size:13.5px; padding:10px 0; border-top:1px solid var(--border);}
.hist-row:first-child{border-top:none;}
.mk-analysis-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px;}

/* ============================= CLASSES ============================= */
.class-card{padding:20px;}
.class-card-top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px;}
.class-card h3{font-size:15px; font-weight:800;}
.class-card .dept{font-size:12px; color:var(--slate); margin-top:2px;}
.class-ic{width:36px; height:36px; border-radius:12px; background:var(--blue-soft); display:grid; place-items:center; flex-shrink:0;}
.class-info{display:flex; align-items:center; gap:16px; font-size:13.5px; margin-bottom:16px;}
.class-info span{display:flex; align-items:center; gap:6px;}
.chart-title{font-size:14px; font-weight:800; margin-bottom:16px;}

/* ============================= SETTINGS ============================= */
.settings-title{font-size:14px; font-weight:800; margin-bottom:16px;}
.theme-row{display:flex; gap:8px;}
.theme-opt{flex:1; padding:11px; border-radius:12px; font-size:13.5px; font-weight:700; text-transform:capitalize; background:var(--surface-2); color:var(--slate); border:1px solid var(--border);}
.theme-opt.active{background:var(--blue-soft); color:var(--blue-deep); border-color:var(--blue);}

/* ============================= MOBILE ============================= */
.hamburger, .mobile-drawer, .drawer-overlay, .landing-hamburger{display:none;}
@media (max-width: 880px){
  .container{padding:0 16px;}
  .nav-landing .container{height:60px;}
  /* The marketing links (Features / How it works / FAQ) had no mobile
     home — they never collapsed into a menu and just overflowed the
     64px nav bar next to the logo and both auth buttons. Hide them on
     small screens so the nav stays a clean logo + 2 buttons row. */
  .nav-links{display:none;}
  .hero{grid-template-columns:1fr; text-align:center; padding:44px 0 56px;}
  .hero p{margin-left:auto; margin-right:auto;}
  .hero-cta{justify-content:center; flex-wrap:wrap;}
  .hero-trust{justify-content:center; flex-wrap:wrap; gap:14px 20px;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3, .grid-2, .dash-charts-grid, .mk-analysis-grid{grid-template-columns:1fr;}
  .security-card{grid-template-columns:1fr;}
  .auth-side{display:none;}
  /*
   * With the side panel gone, auth-wrap kept its min-height:100vh grid
   * and auth-form-wrap kept centering the form vertically. On a tall
   * phone the form is much shorter than the screen, so that centering
   * left a wall of blank space above AND below it, forced a scroll,
   * and hid the "Back" button (which had only ever lived inside the
   * now-hidden desktop side panel). Fixed: single column, top-aligned,
   * height driven by content, plus a visible mobile back button.
   */
  .auth-wrap{grid-template-columns:1fr; min-height:auto;}
  .auth-form-wrap{min-height:auto; align-items:flex-start; padding:24px 20px 40px;}
  .auth-mobile-back{display:block; margin-bottom:18px;}
  .auth-row{flex-wrap:wrap; row-gap:10px;}
  .sidebar{display:none;}
  .hamburger{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background:none; color:var(--navy); flex-shrink:0;}
  .hamburger svg{width:20px; height:20px;}
  .search-box{display:none;}
  .topbar{padding:0 16px;}
  .view{padding:18px;}
  .mobile-drawer{
    display:flex; position:fixed; top:0; left:0; bottom:0; width:250px; background:var(--surface); z-index:700;
    flex-direction:column; padding:16px; transform:translateX(-100%); transition:.2s;
  }
  .mobile-drawer.open{transform:translateX(0);}
  .drawer-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:650;}
  .drawer-overlay.open{display:block;}
  .modal-grid2{grid-template-columns:1fr;}
}

/* Extra-small phones: the 880px breakpoint alone still left oversized
   hero type and cramped nav/CTA buttons on ~360-400px wide screens. */
@media (max-width: 480px){
  .container{padding:0 14px;}
  .hero h1{font-size:34px;}
  .hero p{font-size:15.5px;}
  .section-title{font-size:24px;}
  .section{padding:44px 0;}
  .grid-4{grid-template-columns:1fr 1fr; gap:12px;}
  .nav-landing .container > div:last-child{gap:6px;}
  .nav-landing .btn{padding:8px 10px; font-size:13px;}
  .nav-landing .btn-primary{padding:8px 14px;}
  .hero-cta .btn{width:100%;}
  .hero-cta{flex-direction:column;}
}

/*
 * ----------------------------------------------------------------------------
 * CLASSES vs CLASS GROUPS
 * ----------------------------------------------------------------------------
 * "classGroups" is the thing an org creates first (e.g. "10th A") — students
 * are enrolled into a class GROUP, once. "classes" (kept as the collection
 * name for minimal disruption to existing data) are actually TIMETABLE
 * PERIODS that live inside a class group (subject, teacher, room, time) —
 * every period has a classGroupId pointing at its parent group.
 *
 * Enrollments link a student straight to a classGroupId, never to an
 * individual period. That's what makes a new timetable period
 * automatically include the whole class's roster the moment it's created,
 * with no separate per-period enrollment step: rosterFor() below always
 * resolves a period back to its group before looking up who's enrolled.
 * ----------------------------------------------------------------------------
 */
function rosterFor(periodId){
  const period = (state.data.classes||[]).find(c=>c.id===periodId);
  // Falls back to treating the id as a group id directly, so this still
  // works if ever called with a classGroupId instead of a period id.
  const groupId = period ? period.classGroupId : periodId;
  const enrolledIds = new Set((state.data.enrollments||[]).filter(e=>e.classGroupId===groupId).map(e=>e.studentId));
  return (state.data.students||[]).filter(s=>enrolledIds.has(s.id));
}
function classesForStudent(studentId){
  // Despite the name (kept for minimal disruption to existing callers),
  // this returns the student's CLASS GROUPS — which is what almost every
  // caller actually wants to display ("which class is this student in").
  // For the literal list of timetable periods a student attends, see
  // periodsForStudent() below.
  const groupIds = new Set((state.data.enrollments||[]).filter(e=>e.studentId===studentId).map(e=>e.classGroupId));
  return (state.data.classGroups||[]).filter(g=>groupIds.has(g.id));
}
function periodsForStudent(studentId){
  const groupIds = new Set((state.data.enrollments||[]).filter(e=>e.studentId===studentId).map(e=>e.classGroupId));
  return (state.data.classes||[]).filter(c=>groupIds.has(c.classGroupId));
}
function deptNameOf(departmentId){
  const d = (state.data.departments||[]).find(d=>d.id===departmentId);
  return d ? d.name : '';
}

/*
 * Excel auto-opens CSV files and, for any cell that looks like a date,
 * silently converts it into a real date value with Excel's default
 * (narrow) column width — which is what was producing "########" for
 * the Date column, since the actual text was too long to fit. Wrapping
 * the value as ="..." forces Excel to treat it as literal text no
 * matter which format it's opened with, so the date always displays
 * exactly as written and the column just auto-widens instead of
 * hashing out. (A leading apostrophe only works when typed directly
 * into Excel, not when Excel is auto-parsing an opened CSV file.)
 */
function csvDateCell(iso){
  return `="${prettyDate(iso).replace(/"/g,'""')}"`;
}

function getOrganizationId(){
  return state.user?.organizationId || `ORG_${window.attendoFirebase.auth.currentUser?.uid}`;

/*
 * ----------------------------------------------------------------------------
 * Wipes every piece of in-memory, session-scoped state — not just
 * state.user/state.data, but every cache introduced for on-demand
 * Firestore queries (Marks, History, student profiles). Those caches
 * key themselves by things like a date range, not by account, so if
 * they aren't cleared on logout, a second account signing in on the
 * same tab can end up displaying the FIRST account's cached records
 * (matched against the second account's different student/class list —
 * which is what "Unknown Student" rows are a symptom of). This is a
 * client-side memory issue, not a Firestore security hole: the data
 * itself was never actually shared on the server.
 * ----------------------------------------------------------------------------
 */

  state.data = null;
  state.parentSession = null;
  state.parentData = null;
  state.parentLoading = false;
  state.parentView = 'dashboard';

  state._notificationsCache = null;
  state._firestoreCache = null;
  state._pendingMarkDeletes = [];
  state._marksCache = null;
  state._studentMarksCache = null;
  state._histCache = null;
  state._studentHistoryCache = null;
  state._studentProfile = null;
  state.activeClass = null;
  state.quickIdx = 0;
  state.quickStatus = {};
  state.quickMarksSetup = null;
  state.quickMarksIdx = 0;
  state.quickMarksEntries = {};
  state.rcStatus = {};
  state.rcDirty = false;
  state._rcKey = null;
  state._qrKey = null;
  state._stuSearch = '';
  state._stuClassFilter = 'All';
  state._stuDeptFilter = 'All';
  state._markClassFilter = 'All';
  state._markSubjectFilter = 'All';
  state._markStudentFilter = 'All';
  state._markMin = '';
  state._markMax = '';
  state._markFrom = null;
  state._markTo = null;
  state._histClass = 'All';
  state._histStatus = 'All';
  state._histFrom = null;

/* --------------------------------------------------------------------------
   CHANGE PASSWORD (Settings → Security)
   ------------------------------------------------------------------------
   Firebase requires a "recent" sign-in before it will let you change a
   password, so we re-authenticate with the old password first (this also
   doubles as proving the old password is actually correct) before calling
   updatePassword with the new one.
--------------------------------------------------------------------------- */
async function changeOwnPassword(oldPassword, newPassword){
  const fb = window.attendoFirebase;
  const user = fb.auth.currentUser;
  if(!user || !user.email) throw new Error('You must be signed in with an email account to change your password.');
  if(!oldPassword || !newPassword) throw new Error('Please fill in both your current and new password.');
  if(newPassword.length < 6) throw new Error('New password must be at least 6 characters.');

  const credential = fb.EmailAuthProvider.credential(user.email, oldPassword);
  await fb.reauthenticateWithCredential(user, credential); // throws if oldPassword is wrong
  await fb.updatePassword(user, newPassword);
}

   LOAD DATA FROM FIRESTORE
--------------------------------------------------------------------------- */

async function loadData(){

  try{

    const fb = window.attendoFirebase;

    const user = fb.auth.currentUser;

    if(!user){
      console.warn("No Firebase user logged in.");
      return null;
    }

    const organizationId = getOrganizationId();

    const orgRef = fb.doc(
      fb.db,
      'organizations',
      organizationId
    );

    const orgSnap = await fb.getDoc(orgRef);

    if(!orgSnap.exists()){

      console.warn("Organization document does not exist.");

      return {
        org:{
          name:"My Organization",
          type:"School",
          lateThresholdMin: 10,
          minAttendancePct: 75
        },
        departments:[],
        students:[],
        classes:[],
        classGroups:[],
        enrollments:[],
        attendance:{},
        marks:[]
      };
    }

    const org = orgSnap.data();


    /* ================================================================
       DEPARTMENTS
       Bounded (a handful per organization) — always safe to load in full.
    ================================================================= */

    const departmentsSnap = await fb.getDocs(
      fb.collection(fb.db, 'organizations', organizationId, 'departments')
    );
    const departments = [];
    departmentsSnap.forEach(docSnap => departments.push({ id: docSnap.id, ...docSnap.data() }));


    /* ================================================================
       CLASS GROUPS
       The thing an organization creates first (e.g. "10th A") — bounded
       (tens, not thousands, per org), safe to load in full.
    ================================================================= */

    const classGroupsSnap = await fb.getDocs(
      fb.collection(fb.db, 'organizations', organizationId, 'classGroups')
    );
    const classGroups = [];
    classGroupsSnap.forEach(docSnap => classGroups.push({ id: docSnap.id, ...docSnap.data() }));


    /* ================================================================
       STUDENTS
       One permanent record per student — bounded by enrollment size
       (thousands, not growing daily), so a full load is fine.
    ================================================================= */

    const studentsSnap = await fb.getDocs(
      fb.collection(
        fb.db,
        'organizations',
        organizationId,
        'students'
      )
    );

    const students = [];

    studentsSnap.forEach(docSnap => {

      students.push({
        id: docSnap.id,
        ...docSnap.data()
      });

    });


    /* ================================================================
       CLASSES
    ================================================================= */

    const classesSnap = await fb.getDocs(
      fb.collection(
        fb.db,
        'organizations',
        organizationId,
        'classes'
      )
    );

    const classes = [];

    classesSnap.forEach(docSnap => {

      classes.push({
        id: docSnap.id,
        ...docSnap.data()
      });

    });


    /* ================================================================
       ENROLLMENTS
       Many-to-many student <-> class links. Bounded by
       (students x avg subjects per student), not by days elapsed, so
       — like students/classes — it's safe to load in full and doesn't
       need date-scoping the way attendance does.
    ================================================================= */

    const enrollmentsSnap = await fb.getDocs(
      fb.collection(fb.db, 'organizations', organizationId, 'enrollments')
    );
    const enrollments = [];
    enrollmentsSnap.forEach(docSnap => enrollments.push({ id: docSnap.id, ...docSnap.data() }));


    /* ================================================================
       ATTENDANCE SESSIONS
       ------------------------------------------------------------
       This used to be an unconditional getDocs() over the ENTIRE
       attendance history — fine for a small school, but at college
       scale (~18,000 attendance events/day) that collection grows by
       hundreds of session documents every single day, forever. Loading
       all of it on every login would make load times and Firestore
       read costs grow without bound as the semester goes on.
       Fix: only pull a recent rolling window (14 days) here, which is
       all the Dashboard needs (today + this-week trend). Anything
       older is fetched on demand:
         - the History page queries its own explicit date range
         - a student's full multi-year history is read from
           attendanceRecords (a per-student-queryable fan-out — see
           saveAttendanceSession()) when their profile is opened
       ------------------------------------------------------------
    ================================================================= */

    const windowStart = new Date();
    windowStart.setDate(windowStart.getDate() - 13);
    const windowStartStr = windowStart.toISOString().slice(0,10);

    // Marks accumulate much slower than attendance (weekly exams, not
    // daily), so a longer default window (~1 term) is safe here and
    // more useful for the Marks page's analysis than 14 days would be.
    const marksWindowStart = new Date();
    marksWindowStart.setDate(marksWindowStart.getDate() - 89);
    const marksWindowStartStr = marksWindowStart.toISOString().slice(0,10);

    const sessionsSnap = await fb.getDocs(
      fb.query(
        fb.collection(fb.db, 'organizations', organizationId, 'attendanceSessions'),
        fb.where('date', '>=', windowStartStr)
      )
    );

    const attendance = {};
    sessionsSnap.forEach(docSnap => { attendance[docSnap.id] = docSnap.data(); });


    /* ================================================================
       MARKS
       ------------------------------------------------------------
       Same reasoning as attendanceSessions: weekly exams across ~5
       subjects for 3,000 students is roughly 540,000 mark records a
       year, and — since a college keeps running indefinitely rather
       than resetting — that keeps accumulating (1.5-2.7M+ within a
       few years). Bulk-loading all of it on every login would
       eventually hit the same problem attendance had. So: only a
       recent rolling window loads here; the Marks page fetches other
       date ranges on demand, and a student's full marks history
       (their profile's "Deep Analysis") is fetched on demand too.
       ------------------------------------------------------------
    ================================================================= */

    const marksSnap = await fb.getDocs(
      fb.query(
        fb.collection(fb.db, 'organizations', organizationId, 'marks'),
        fb.where('date', '>=', marksWindowStartStr)
      )
    );

    const marks = [];

    marksSnap.forEach(docSnap => {

      marks.push({
        id: docSnap.id,
        ...docSnap.data()
      });

    });


    const data = {
      org:{
        name: org.name || "My Organization",
        type: org.type || "School",
        lateThresholdMin: org.lateThresholdMin ?? 10,
        minAttendancePct: org.minAttendancePct ?? 75
      },

      departments,

      students,

      classes,

      classGroups,

      enrollments,

      attendance,

      marks
    };


    /*
     * Keep a copy so persist() can detect what changed.
     * (Note: attendanceSessions/attendanceRecords are intentionally
     * NOT part of this diff-based persist() cache — they're written
     * directly by saveAttendanceSession() instead, since a rolling
     * 14-day window can't be used as a complete "previous state" to
     * diff a full save against.)
     */

    state._firestoreCache =
      JSON.parse(JSON.stringify(data));


    console.log("Attendo data loaded from Firestore:", data);

    return data;

  }
  catch(error){

    console.error(
      "Failed to load Attendo data from Firestore:",
      error
    );

    showToast(
      "Unable to load your Firebase data."
    );

    return null;
  }
}


/* --------------------------------------------------------------------------
   SAVE DATA TO FIRESTORE
--------------------------------------------------------------------------- */

/*
 * persist() used to re-download the ENTIRE students/classes/attendance
 * collections (3 full reads) and then write every single record back
 * one-at-a-time with a sequential `await` per document — even when only
 * one attendance record actually changed. On any real amount of data
 * that meant dozens/hundreds of round-trips for a single save, which is
 * what caused the lag when marking attendance or creating an account.
 *
 * Fixed version:
 *  - Diffs against the in-memory `state._firestoreCache` (already kept
 *    up to date by loadData/persist) instead of re-fetching from
 *    Firestore, so there are ZERO extra reads on save.
 *  - Only writes/deletes documents that actually changed.
 *  - Queues every write/delete into a single Firestore writeBatch, so
 *    the whole save is ONE network round-trip (chunked automatically if
 *    an org ever has 400+ changed records at once, well beyond normal use).
 */
function _recEqual(a, b){
  return JSON.stringify(a) === JSON.stringify(b);
}

async function _commitInChunks(fb, ops){
  // Firestore batches max out at 500 operations; chunk defensively.
  const CHUNK = 400;
  for(let i = 0; i < ops.length; i += CHUNK){
    const batch = fb.writeBatch(fb.db);
    ops.slice(i, i + CHUNK).forEach(op => op(batch));
    await batch.commit();
  }
}

async function persist(data){

  try{

    const fb = window.attendoFirebase;

    const user = fb.auth.currentUser;

    if(!user){

      console.warn(
        "Cannot save Firestore data: no authenticated user."
      );

      return;
    }

    const organizationId = getOrganizationId();
    const prev = state._firestoreCache || { students:[], classes:[], classGroups:[], departments:[], enrollments:[], attendance:{}, marks:[], org:{} };

    const ops = [];

    /* ================================================================
       ORGANIZATION (only write if it actually changed)
    ================================================================= */

    const newOrg = {
      name: data.org?.name || "My Organization",
      type: data.org?.type || "School",
      lateThresholdMin: data.org?.lateThresholdMin ?? 10,
      minAttendancePct: data.org?.minAttendancePct ?? 75,
      ownerId: user.uid
    };

    if(!_recEqual(newOrg, { ...prev.org, ownerId: user.uid })){
      const orgRef = fb.doc(fb.db, 'organizations', organizationId);
      ops.push(batch => batch.set(orgRef, newOrg, { merge:true }));
    }


    /* ================================================================
       DEPARTMENTS
    ================================================================= */

    const deptCollection = fb.collection(fb.db, 'organizations', organizationId, 'departments');
    const prevDepts = new Map((prev.departments || []).map(d => [d.id, d]));
    const nextDepts = new Map((data.departments || []).map(d => [d.id, d]));

    for(const id of prevDepts.keys()){
      if(!nextDepts.has(id)){
        const ref = fb.doc(deptCollection, id);
        ops.push(batch => batch.delete(ref));
      }
    }
    for(const [id, dept] of nextDepts){
      if(!_recEqual(dept, prevDepts.get(id))){
        const { id: _drop, ...deptData } = dept;
        const ref = fb.doc(deptCollection, id);
        ops.push(batch => batch.set(ref, deptData, { merge:true }));
      }
    }


    /* ================================================================
       STUDENTS
    ================================================================= */

    const studentsCollection = fb.collection(fb.db, 'organizations', organizationId, 'students');
    const prevStudents = new Map((prev.students || []).map(s => [s.id, s]));
    const nextStudents = new Map((data.students || []).map(s => [s.id, s]));

    for(const id of prevStudents.keys()){
      if(!nextStudents.has(id)){
        const ref = fb.doc(studentsCollection, id);
        ops.push(batch => batch.delete(ref));
      }
    }
    for(const [id, student] of nextStudents){
      const { id: _drop, ...rest } = student;
      // studentId is kept as a real field (in addition to being the
      // doc id) purely so Parent Login can find this student via a
      // collectionGroup('students') query — see parentLogin().
      const studentData = { ...rest, studentId: id };
      if(!_recEqual(studentData, prevStudents.get(id))){
        const ref = fb.doc(studentsCollection, id);
        ops.push(batch => batch.set(ref, studentData, { merge:true }));
      }
    }


    /* ================================================================
       CLASS GROUPS
       The org-level "Class" (e.g. "10th A") that timetable periods and
       student enrollments both hang off of.
    ================================================================= */

    const classGroupsCollection = fb.collection(fb.db, 'organizations', organizationId, 'classGroups');
    const prevClassGroups = new Map((prev.classGroups || []).map(g => [g.id, g]));
    const nextClassGroups = new Map((data.classGroups || []).map(g => [g.id, g]));

    for(const id of prevClassGroups.keys()){
      if(!nextClassGroups.has(id)){
        const ref = fb.doc(classGroupsCollection, id);
        ops.push(batch => batch.delete(ref));
      }
    }
    for(const [id, grp] of nextClassGroups){
      if(!_recEqual(grp, prevClassGroups.get(id))){
        const { id: _drop, ...grpData } = grp;
        const ref = fb.doc(classGroupsCollection, id);
        ops.push(batch => batch.set(ref, grpData, { merge:true }));
      }
    }


    /* ================================================================
       CLASSES (timetable periods — each belongs to a classGroupId)
    ================================================================= */

    const classesCollection = fb.collection(fb.db, 'organizations', organizationId, 'classes');
    const prevClasses = new Map((prev.classes || []).map(c => [c.id, c]));
    const nextClasses = new Map((data.classes || []).map(c => [c.id, c]));

    for(const id of prevClasses.keys()){
      if(!nextClasses.has(id)){
        const ref = fb.doc(classesCollection, id);
        ops.push(batch => batch.delete(ref));
      }
    }
    for(const [id, cls] of nextClasses){
      if(!_recEqual(cls, prevClasses.get(id))){
        const { id: _drop, ...classData } = cls;
        const ref = fb.doc(classesCollection, id);
        ops.push(batch => batch.set(ref, classData, { merge:true }));
      }
    }


    /* ================================================================
       ENROLLMENTS (student <-> class links — the many-to-many fix so a
       student is never duplicated per subject/class; see rosterFor()
       and classesForStudent())
    ================================================================= */

    const enrollCollection = fb.collection(fb.db, 'organizations', organizationId, 'enrollments');
    const prevEnroll = new Map((prev.enrollments || []).map(e => [e.id, e]));
    const nextEnroll = new Map((data.enrollments || []).map(e => [e.id, e]));

    for(const id of prevEnroll.keys()){
      if(!nextEnroll.has(id)){
        const ref = fb.doc(enrollCollection, id);
        ops.push(batch => batch.delete(ref));
      }
    }
    for(const [id, enr] of nextEnroll){
      if(!_recEqual(enr, prevEnroll.get(id))){
        const { id: _drop, ...enrData } = enr;
        const ref = fb.doc(enrollCollection, id);
        ops.push(batch => batch.set(ref, enrData, { merge:true }));
      }
    }


    /* ================================================================
       ATTENDANCE
       ------------------------------------------------------------
       No longer handled here. At college scale (~18,000 attendance
       events/day) folding attendance into this same whole-app diff
       would mean every roll-call save re-diffs a large in-memory
       blob and this function's `prev` cache (a bounded 14-day
       window) can't represent "all history" to diff against safely.
       Roll Call / Quick Roll Call now call saveAttendanceSession()
       directly instead, which writes only that one class-session
       (plus its per-student index docs) in its own dedicated batch.
       ------------------------------------------------------------
    ================================================================= */


    /* ================================================================
       MARKS
    ================================================================= */

    /*
     * Marks are now loaded as a rolling window (see loadData()), not
     * the complete history — so absence-from-the-loaded-window can no
     * longer be trusted to mean "the user deleted it" the way it could
     * when everything was always fully loaded. A mark from outside the
     * window is just as "absent" from data.marks as a genuinely deleted
     * one, and diffing against prev would silently fail to delete
     * anything the user removes that happens to be outside that window.
     * So deletions are now tracked explicitly (see deleteMark()) instead
     * of inferred from absence; this section only ever upserts.
     */

    const marksCollection = fb.collection(fb.db, 'organizations', organizationId, 'marks');
    const prevMarks = new Map((prev.marks || []).map(m => [m.id, m]));
    const nextMarks = new Map((data.marks || []).map(m => [m.id, m]));

    for(const [id, mark] of nextMarks){
      if(!_recEqual(mark, prevMarks.get(id))){
        const { id: _drop, ...markData } = mark;
        const ref = fb.doc(marksCollection, id);
        ops.push(batch => batch.set(ref, markData, { merge:true }));
      }
    }
    for(const id of state._pendingMarkDeletes || []){
      const ref = fb.doc(marksCollection, id);
      ops.push(batch => batch.delete(ref));
    }


    /*
     * Nothing changed at all — skip the network call entirely.
     */

    if(ops.length === 0){
      console.log("Attendo persist(): no changes to save, skipped network call.");
      return;
    }

    await _commitInChunks(fb, ops);

    state._pendingMarkDeletes = [];

    /*
     * Update local Firestore snapshot.
     */

    state._firestoreCache =
      JSON.parse(JSON.stringify(data));


    console.log(
      `Attendo data saved to Firestore (${ops.length} change${ops.length===1?'':'s'} in 1 batch).`
    );

  }
  catch(error){

    console.error(
      "Firestore save failed:",
      error
    );

    showToast(
      "Could not save data to Firebase."
    );

    throw error;
  }
}

/* --------------------------------------------------------------------------
   SAVE ATTENDANCE SESSION (dedicated, high-frequency path)
   ------------------------------------------------------------------------
   Roll Call and Quick Roll Call call this directly instead of going
   through persist(). Attendance is by far the highest-volume write in
   the app (up to ~18,000 marks/day across a college), so it gets its
   own lean save path rather than being folded into the general
   students/classes/marks diff-and-batch flow:

     1. ONE session document — organizations/{org}/attendanceSessions/{date}|{classId}
        holding the whole class roster's statuses for that day (this is
        what Roll Call/Dashboard read — cheap: one write per class per day,
        not one per student).

     2. A per-student fan-out — organizations/{org}/attendanceRecords/{date}|{classId}|{studentId}
        one tiny doc per student per session. This is where the real
        18,000/day volume lands, but each doc is only ever touched via
        an indexed query (by studentId, or by date), never a full scan —
        that's what makes a student's multi-year history, or "today's
        attendance across the college", queryable without ever loading
        the whole collection.

   Both are written in a single batch, so a save is still one atomic,
   one-round-trip operation from the UI's point of view.
--------------------------------------------------------------------------- */
async function saveAttendanceSession(cls, date, statusMap){
  const fb = window.attendoFirebase;
  const user = fb.auth.currentUser;
  if(!user) throw new Error("Cannot save attendance: no authenticated user.");

  const organizationId = getOrganizationId();
  const sessionId = `${date}|${cls.id}`;

  // Note: teacher/department are deliberately NOT stored here — every
  // reader (Roll Call, Dashboard, History, student profiles) already
  // looks them up from the class/department docs via classId, so writing
  // them again on every session/record doc would just be duplicate data
  // that goes stale the moment a class's teacher or department changes.
  const sessionData = {
    classId: cls.id,
    date,
    subject: cls.subject,
    records: { ...statusMap }
  };

  const sessionRef = fb.doc(fb.db, 'organizations', organizationId, 'attendanceSessions', sessionId);

  const ops = [batch => batch.set(sessionRef, sessionData, { merge:true })];

  const recordsCollection = fb.collection(fb.db, 'organizations', organizationId, 'attendanceRecords');
  for(const [studentId, status] of Object.entries(statusMap)){
    const recordId = `${date}|${cls.id}|${studentId}`;
    const ref = fb.doc(recordsCollection, recordId);
    ops.push(batch => batch.set(ref, {
      studentId, classId: cls.id, subject: cls.subject, date, status
    }, { merge:true }));
  }

  await _commitInChunks(fb, ops);

  // Keep the in-memory rolling window in sync so the Dashboard/Roll Call
  // reflect the save immediately without a re-fetch.
  if(state.data){
    state.data.attendance[sessionId] = sessionData;
    if(state._firestoreCache) state._firestoreCache.attendance[sessionId] = sessionData;
  }
}

/* --------------------------------------------------------------------------
   DELETE A SINGLE ATTENDANCE RECORD (one student, one session)
   ------------------------------------------------------------------------
   Used by the History table's per-row delete button. This only removes
   that one student's status for that one class/date — it never touches
   the student's profile, other sessions, or any other student's record.

   Two writes, same shape as the save path:
     1. Remove `records.{studentId}` from the session doc (deleteField(),
        so the rest of that day's session survives untouched).
     2. Delete the matching attendanceRecords/{date}|{classId}|{studentId}
        fan-out doc outright, since without a status it has no purpose.
--------------------------------------------------------------------------- */
async function deleteAttendanceRecord(date, classId, studentId){
  const fb = window.attendoFirebase;
  const user = fb.auth.currentUser;
  if(!user) throw new Error("Cannot delete attendance record: no authenticated user.");

  const organizationId = getOrganizationId();
  const sessionId = `${date}|${classId}`;
  const recordId = `${date}|${classId}|${studentId}`;

  const sessionRef = fb.doc(fb.db, 'organizations', organizationId, 'attendanceSessions', sessionId);
  const recordRef = fb.doc(fb.db, 'organizations', organizationId, 'attendanceRecords', recordId);

  await fb.updateDoc(sessionRef, { [`records.${studentId}`]: fb.deleteField() });
  await fb.deleteDoc(recordRef);

  // Keep every in-memory copy in sync so the UI updates without a re-fetch.
  [state.data, state._firestoreCache].forEach(d=>{
    if(d && d.attendance && d.attendance[sessionId] && d.attendance[sessionId].records){
      delete d.attendance[sessionId].records[studentId];
    }
  });
  if(state._histCache && state._histCache.sessions && state._histCache.sessions[sessionId] && state._histCache.sessions[sessionId].records){
    delete state._histCache.sessions[sessionId].records[studentId];
  }
}

/* --------------------------------------------------------------------------
   CLASS PROGRESS LOGS (Classes tab → "Log Questions Done")
   ------------------------------------------------------------------------
   A lightweight record of how many questions were covered in a class
   session, for one or more class groups at once. Lives in its own
   collection since it isn't attendance data and doesn't need the
   date|classId keying that collection relies on.
--------------------------------------------------------------------------- */
async function saveClassLog(payload){
  const fb = window.attendoFirebase;
  const user = fb.auth.currentUser;
  if(!user) throw new Error("Cannot save class log: no authenticated user.");
  const organizationId = getOrganizationId();
  const logsCollection = fb.collection(fb.db, 'organizations', organizationId, 'classLogs');
  const doc = {
    topic: payload.topic,
    description: payload.description || '',
    classGroupIds: payload.classGroupIds,
    teacher: payload.teacher || '',
    questionsCount: payload.questionsCount,
    date: todayStr(),
    createdAt: Date.now()
  };
  await fb.addDoc(logsCollection, doc);
  if(!state._classLogsCache) state._classLogsCache = [];
  state._classLogsCache.unshift({ id: `local_${doc.createdAt}`, ...doc });
  return doc;
}

async function fetchClassLogs(){
  if(state._classLogsCache) return state._classLogsCache;
  const fb = window.attendoFirebase;
  const organizationId = getOrganizationId();
  const snap = await fb.getDocs(fb.collection(fb.db, 'organizations', organizationId, 'classLogs'));
  const logs = [];
  snap.forEach(d=>logs.push({ id:d.id, ...d.data() }));
  logs.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  state._classLogsCache = logs;
  return logs;
}


/* --------------------------------------------------------------------------
   NOTIFICATIONS — teachers/admins broadcast a message from the admin
   dashboard; parents see it in a bell dropdown on their own dashboard.
   audience is either 'all' (every parent in the org) or a classGroupId
   (only parents whose child is in that class).
--------------------------------------------------------------------------- */
async function sendNotification(payload){
  const fb = window.attendoFirebase;
  const organizationId = getOrganizationId();
  const col = fb.collection(fb.db, 'organizations', organizationId, 'notifications');
  const doc = {
    title: payload.title,
    message: payload.message,
    audience: payload.audience || 'all',
    audienceLabel: payload.audienceLabel || 'All Parents',
    createdBy: (state.user && state.user.name) || 'Staff',
    createdAt: Date.now()
  };
  await fb.addDoc(col, doc);
  if(!state._notificationsCache) state._notificationsCache = [];
  state._notificationsCache.unshift({ id:`local_${doc.createdAt}`, ...doc });
  return doc;
}

async function fetchOrgNotifications(organizationId){
  const fb = window.attendoFirebase;
  const snap = await fb.getDocs(fb.collection(fb.db, 'organizations', organizationId, 'notifications'));
  const list = [];
  snap.forEach(d=>list.push({ id:d.id, ...d.data() }));
  list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return list;
}

async function fetchParentNotifications(organizationId, classGroupId){
  const list = await fetchOrgNotifications(organizationId);
  return list.filter(n => n.audience==='all' || n.audience===classGroupId);
}

function relativeTime(ts){
  if(!ts) return '';
  const diffMs = Date.now() - ts;
  const mins = Math.round(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins/60);
  if(hrs < 24) return `${hrs}h ago`;
  const days = Math.round(hrs/24);
  if(days < 7) return `${days}d ago`;
  return new Date(ts).toLocaleDateString('en-IN', {day:'numeric', month:'short'});
}

/* --------------------------------------------------------------------------
   FETCH A STUDENT'S FULL ATTENDANCE HISTORY (on demand)
   ------------------------------------------------------------------------
   Reads attendanceRecords filtered to one studentId — scalable
   regardless of how large the college-wide collection grows, since it's
   always an indexed, scoped query and never a full-collection read.
--------------------------------------------------------------------------- */
async function fetchStudentAttendanceHistory(studentId){
  const fb = window.attendoFirebase;
  const organizationId = getOrganizationId();
  const q = fb.query(
    fb.collection(fb.db, 'organizations', organizationId, 'attendanceRecords'),
    fb.where('studentId', '==', studentId)
  );
  const snap = await fb.getDocs(q);
  const records = [];
  snap.forEach(docSnap => records.push(docSnap.data()));
  records.sort((a,b)=> b.date.localeCompare(a.date));
  return records;
}

/* --------------------------------------------------------------------------
   PARENT LOGIN
   ----------------------------------------------------------------------
   Parents don't have a Firebase Auth account tied to an organization the
   way an Administrator/Teacher does — organizationId for an admin is
   derived straight from their own uid (`ORG_${uid}`, see
   getOrganizationId()), which has no meaning for a parent. Instead, a
   parent "logs in" with three things that together identify one student:
   Student ID + Class + Section. That's effectively a shared passcode
   (much like a roll-number + DOB portal at many real schools), so:
     1. We sign the parent in anonymously (so Firestore rules can still
        require request.auth != null) — see attachAuthEvents().
     2. We run a collectionGroup('students') query for that Student ID
        across every organization (this is why persist() now also stores
        studentId as a real field on the student document, not just as
        the doc id — collectionGroup queries can only filter on fields).
     3. For each match we confirm the given Class name + Section belongs
        to that organization AND that the student is actually enrolled in
        it, before granting access. This also gives us the organizationId
        (it's just the matched document's path).
   IMPORTANT — Firestore security rules must be configured to allow this:
   an authenticated (incl. anonymous) user needs read access to the
   'students', 'classGroups', 'classes', 'enrollments', 'attendanceRecords'
   and 'marks' collections scoped this way. See the rules note further
   down this file for a starting point, and tighten it before relying on
   this in production (e.g. move the matching into a Cloud Function so a
   parent session is never handed a broad collectionGroup read).
--------------------------------------------------------------------------- */
const _norm = s => String(s||'').trim().toLowerCase();

async function parentLogin(studentIdRaw, classNameRaw, sectionRaw){
  const fb = window.attendoFirebase;
  const studentId = String(studentIdRaw||'').trim();
  const wantClass = _norm(classNameRaw);
  const wantSection = _norm(sectionRaw);

  if(!studentId || !classNameRaw || !sectionRaw){
    throw new Error('Please fill in Student ID, Class and Section.');
  }

  // Make sure we have a session Firestore rules will accept.
  if(!fb.auth.currentUser){
    await fb.signInAnonymously(fb.auth);
  }

  const studentsQuery = fb.query(
    fb.collectionGroup(fb.db, 'students'),
    fb.where('studentId', '==', studentId)
  );
  const studentsSnap = await fb.getDocs(studentsQuery);

  for(const studentDoc of studentsSnap.docs){
    // Path looks like organizations/{organizationId}/students/{studentId}
    const organizationId = studentDoc.ref.parent.parent.id;
    const student = { id: studentDoc.id, ...studentDoc.data() };

    // "Class" here means a classGroup (e.g. "10th A") — the thing a
    // student is actually enrolled in. Individual timetable periods
    // (subject/teacher/time) live one level below and aren't what a
    // parent is expected to know.
    const groupsSnap = await fb.getDocs(
      fb.collection(fb.db, 'organizations', organizationId, 'classGroups')
    );
    const matchedGroup = groupsSnap.docs
      .map(d=>({ id:d.id, ...d.data() }))
      .find(g => _norm(g.name)===wantClass && _norm(g.section)===wantSection);

    if(!matchedGroup) continue;

    const enrollSnap = await fb.getDocs(fb.query(
      fb.collection(fb.db, 'organizations', organizationId, 'enrollments'),
      fb.where('studentId', '==', studentId),
      fb.where('classGroupId', '==', matchedGroup.id)
    ));
    if(enrollSnap.empty) continue;

    return { organizationId, student, cls: matchedGroup };
  }

  return null;
}

/* --------------------------------------------------------------------------
   FETCH A LOGGED-IN PARENT'S CHILD'S FULL DATA (attendance + marks)
--------------------------------------------------------------------------- */
async function fetchParentChildData(organizationId, studentId){
  const fb = window.attendoFirebase;

  const [attendanceSnap, marksSnap, classesSnap] = await Promise.all([
    fb.getDocs(fb.query(
      fb.collection(fb.db, 'organizations', organizationId, 'attendanceRecords'),
      fb.where('studentId', '==', studentId)
    )),
    fb.getDocs(fb.query(
      fb.collection(fb.db, 'organizations', organizationId, 'marks'),
      fb.where('studentId', '==', studentId)
    )),
    // Timetable periods — used below only to look up a mark's subject
    // when the mark itself doesn't have one recorded directly.
    fb.getDocs(fb.collection(fb.db, 'organizations', organizationId, 'classes')),
  ]);

  const attendance = [];
  attendanceSnap.forEach(d=>attendance.push(d.data()));
  attendance.sort((a,b)=> b.date.localeCompare(a.date));

  const classesById = {};
  classesSnap.forEach(d=>{ classesById[d.id] = { id:d.id, ...d.data() }; });

  const marks = [];
  marksSnap.forEach(d=>{
    const m = { id:d.id, ...d.data() };
    const cls = classesById[m.classId];
    const pct = m.absent ? null : (m.maxMarks ? Math.round((m.marks/m.maxMarks)*1000)/10 : 0);
    marks.push({ ...m, subject: m.subject || (cls?cls.subject:'—'), pct });
  });

  return { attendance, marks };
}

============================================================================ */
const THEME_KEY = 'attendo-theme';
function applyTheme(theme, stage){
  // The marketing landing/auth pages have a fixed light design; dark mode
  // only applies to the authenticated app (dashboard, roll call, etc.).
  const currentStage = stage || state.stage;
  const inApp = currentStage === 'app';
  const isDark = inApp && (theme==='dark' || (theme==='system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
  document.documentElement.classList.toggle('dark', isDark);
}
function setTheme(theme){
  state._theme = theme;
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
  applyTheme(theme);
}
function initTheme(){
  let saved = 'light';
  try{ saved = localStorage.getItem(THEME_KEY) || 'light'; }catch(e){}
  state._theme = saved;
  applyTheme(saved);
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
      if(state._theme==='system') applyTheme('system');
    });
  }
}
initTheme();

function attendancePct(data, studentId){
  let present=0, total=0;
  Object.values(data.attendance).forEach(rec=>{ if(rec.records[studentId]){ total++; if(rec.records[studentId]==='Present') present++; } });
  return total ? Math.round(present/total*100) : 100;
}

/* ============================================================================
   COMPARE PICTO — compare attendance % and marks average, either between
   2+ STUDENTS within one class, or between 2+ whole CLASSES — shown as a
   chart on-screen and exportable as an editable .pptx
============================================================================ */
function _inRange(dateStr, fromDate, toDate){
  if(!dateStr) return true;
  if(fromDate && dateStr < fromDate) return false;
  if(toDate && dateStr > toDate) return false;
  return true;
}
function comparePictoStats(groupId, studentIds, fromDate, toDate){
  const data = state.data;
  const periodIds = new Set((data.classes||[]).filter(c=>c.classGroupId===groupId).map(c=>c.id));
  return studentIds.map(sid=>{
    const student = (data.students||[]).find(s=>s.id===sid);
    let present=0, total=0;
    Object.entries(data.attendance||{}).forEach(([key,rec])=>{
      const [date, periodId] = key.split('|');
      if(!periodIds.has(periodId)) return;
      if(!_inRange(date, fromDate, toDate)) return;
      const status = rec.records[sid];
      if(status){ total++; if(status==='Present') present++; }
    });
    const attendancePct = total ? Math.round(present/total*100) : 0;
    const relevantMarks = (data.marks||[]).filter(m=>m.studentId===sid && periodIds.has(m.classId) && !m.absent && _inRange(m.date, fromDate, toDate));
    const marksAvg = relevantMarks.length
      ? Math.round(relevantMarks.reduce((sum,m)=> sum + (m.maxMarks ? (m.marks/m.maxMarks*100) : 0), 0) / relevantMarks.length)
      : 0;
    return { id: sid, name: student?student.name:sid, attendancePct, marksAvg };
  });
}
function comparePictoClassStats(groupIds, fromDate, toDate){
  const data = state.data;
  return groupIds.map(gid=>{
    const group = (data.classGroups||[]).find(g=>g.id===gid);
    const periodIds = new Set((data.classes||[]).filter(c=>c.classGroupId===gid).map(c=>c.id));
    let present=0, total=0;
    Object.entries(data.attendance||{}).forEach(([key,rec])=>{
      const [date, periodId] = key.split('|');
      if(!periodIds.has(periodId)) return;
      if(!_inRange(date, fromDate, toDate)) return;
      Object.values(rec.records).forEach(status=>{ total++; if(status==='Present') present++; });
    });
    const attendancePct = total ? Math.round(present/total*100) : 0;
    const relevantMarks = (data.marks||[]).filter(m=>periodIds.has(m.classId) && !m.absent && _inRange(m.date, fromDate, toDate));
    const marksAvg = relevantMarks.length
      ? Math.round(relevantMarks.reduce((sum,m)=> sum + (m.maxMarks ? (m.marks/m.maxMarks*100) : 0), 0) / relevantMarks.length)
      : 0;
    return { id: gid, name: group?`${group.name}${group.section}`:gid, attendancePct, marksAvg };
  });
}

      state.charts.cp2 = new Chart(ctx2, { type:'pie', data:{ labels, datasets:[{ data: stats.map(s=>s.marksAvg), backgroundColor: labels.map((_,i)=>palette[i%palette.length]) }] }, options:{ plugins:{legend:{position:'bottom'}} } });
    } else {

      state.charts.cp1 = new Chart(ctx1, { type, data:{ labels, datasets:[{ label:'Attendance %', data: stats.map(s=>s.attendancePct), backgroundColor: T.blue, borderColor: T.blue, tension:.35 }] }, options:{ plugins:{legend:{display:false}}, scales:{ y:{min:0,max:100} } } });
      state.charts.cp2 = new Chart(ctx2, { type, data:{ labels, datasets:[{ label:'Marks Average %', data: stats.map(s=>s.marksAvg), backgroundColor: T.mintDeep, borderColor: T.mintDeep, tension:.35 }] }, options:{ plugins:{legend:{display:false}}, scales:{ y:{min:0,max:100} } } });
    }
  }

  renderBody();
}

async function exportComparePictoPPT(stats, subtitle, chartType){
  if(typeof PptxGenJS === 'undefined'){ showToast("Couldn't load the PowerPoint export library — check your connection and try again."); return; }

  const pptx = new PptxGenJS();
  pptx.defineLayout({ name:'ATTENDO', width:10, height:5.63 });
  pptx.layout = 'ATTENDO';

  const titleSlide = pptx.addSlide();
  titleSlide.addText('Compare Picto', { x:0.5, y:1.5, w:9, h:1, fontSize:36, bold:true, color:'0B1E3D' });
  titleSlide.addText(subtitle, { x:0.5, y:2.4, w:9, h:0.6, fontSize:18, color:'5B6B85' });
  titleSlide.addText(stats.map(s=>s.name).join(', '), { x:0.5, y:3.0, w:9, h:0.5, fontSize:13, color:'5B6B85' });

  const pptxType = chartType==='pie' ? pptx.ChartType.pie : chartType==='line' ? pptx.ChartType.line : pptx.ChartType.bar;
