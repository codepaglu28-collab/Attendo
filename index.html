/* ============================================================================
   BOOT
============================================================================ */

function boot(){

  const fb = window.attendoFirebase;

  if(!fb){
    console.error("Firebase is not initialized.");
    return;
  }

  /*
   * NOTE: this used to also call getRedirectResult() here, gated
   * behind state.authBusy, to specifically catch a return from the
   * Google sign-in redirect. That was a mistake — getRedirectResult()
   * can hang indefinitely in some mobile/embedded-webview browsers
   * (a known Firebase issue on browsers that restrict third-party
   * storage access), and since it blocked authBusy the ENTIRE app
   * failed to render if it never resolved: a permanently blank
   * screen. It's been removed — onAuthStateChanged below already
   * fires correctly once a redirect sign-in completes, and now
   * self-provisions a profile for a first-time sign-in of any kind
   * (see the "USER LOGGED IN" branch), so it doesn't need help from a
   * separate, riskier side-channel.
   */

  fb.onAuthStateChanged(
    fb.auth,
    async (user) => {

      /*
       * ---------------------------------------------------------
       * Signup/login is currently handling the session.
       * Don't let the auth listener interfere with it.
       * ---------------------------------------------------------
       */
      if(state.authBusy){
        return;
      }


      /*
       * ---------------------------------------------------------
       * USER LOGGED OUT
       * ---------------------------------------------------------
       */
      if(!user){

        resetSessionState();
        state.stage = 'landing';
        state.view = 'dashboard';

        render();

        return;
      }


      /*
       * ---------------------------------------------------------
       * ANONYMOUS SESSION (Parent Login)
       * ---------------------------------------------------------
       * Anonymous auth is only ever used for Parent Login (see
       * parentLogin()). A parent's session is intentionally
       * single-visit: on a reload, a back-navigation, or any other
       * moment this listener sees a persisted anonymous uid, sign it
       * straight back out rather than resuming the dashboard — and
       * definitely never auto-provision a brand new empty staff
       * organization for that random uid (that was the "useless
       * teacher's dashboard" bug). The resulting null-user event
       * (this same listener, firing again) takes care of resetting
       * state and rendering the landing page.
       * ---------------------------------------------------------
       */
      if(user.isAnonymous){
        await fb.signOut(fb.auth);
        return;
      }


      /*
       * ---------------------------------------------------------
       * USER LOGGED IN
       * ---------------------------------------------------------
       */

      try{

        const organizationId = `ORG_${user.uid}`;

        const userRef = fb.doc(
          fb.db,
          'organizations',
          organizationId,
          'users',
          user.uid
        );

        const userSnap = await fb.getDoc(userRef);


        /*
         * No profile yet for this uid. Auto-provision one (same as a
         * normal signup) rather than leaving the person stuck — this
         * covers a first-time Google sign-in (redirect or popup) as
         * well as any other case where auth succeeded but the profile
         * write didn't happen yet, without depending on a separate
         * side-channel to have run first.
         */

        if(!userSnap.exists()){

          const newProfile = {
            name: user.displayName || user.email?.split('@')[0] || 'Administrator',
            email: user.email || '',
            role: 'Administrator',
            organizationId: organizationId,
            createdAt: new Date().toISOString()
          };

          await fb.setDoc(userRef, newProfile);

          await fb.setDoc(
            fb.doc(fb.db, 'organizations', organizationId),
            {
              name: 'My Organization',
              type: 'School',
              ownerId: user.uid,
              createdAt: new Date().toISOString()
            },
            { merge: true }
          );

          state.user = {
            uid: user.uid,
            name: newProfile.name,
            role: newProfile.role,
            email: newProfile.email,
            organizationId: organizationId
          };

        } else {

        const profile = userSnap.data();


        state.user = {
          uid: user.uid,
          name: profile.name || user.email || 'User',
          role: profile.role || 'Administrator',
          email: user.email || '',
          organizationId:
            profile.organizationId || organizationId
        };

        }


        /*
         * Load Firestore application data.
         */

        const data = await loadData();


        state.data = data || {

          org:{
            name: 'My Organization',
            type: 'School',
            lateThresholdMin: 10,
            minAttendancePct: 75
          },

          students:[],
          classes:[],
          classGroups:[],
          departments:[],
          enrollments:[],
          attendance:{},
          marks:[]

        };


        state.stage = 'app';
        state.view = 'dashboard';

        render();


        console.log(
          'Attendo session restored:',
          state.user
        );

      }
      catch(error){

        console.error(
          'Failed to restore Firebase session:',
          error
        );

        showToast(
          'Unable to load your Attendo account.'
        );

      }

    }
  );
}

/* ============================================================================
   RENDER DISPATCH
============================================================================ */
function render(){
  const app = document.getElementById('app');
  applyTheme(state._theme, state.stage);
  if(state.stage==='landing'){ app.innerHTML = renderLanding(); attachLandingEvents(); return; }
  if(state.stage==='auth'){ app.innerHTML = renderAuth(); attachAuthEvents(); return; }
  if(state.stage==='parent'){ app.innerHTML = renderParentShell(); attachParentShellEvents(); return; }
  if(state.view==='quickroll'){ app.innerHTML = renderQuickRoll(); attachQuickRollEvents(); return; }
  if(state.view==='quickmarks'){ app.innerHTML = renderQuickMarks(); attachQuickMarksEvents(); return; }
  app.innerHTML = renderShell();
  attachShellEvents();
  renderView();
}

function attachAuthEvents(){

  document.querySelectorAll('[data-action="google-auth"]')
    .forEach(b => {
      b.onclick = async () => {
        const fb = window.attendoFirebase;
        b.disabled = true;
        try {
          /*
           * signInWithPopup fails in a lot of mobile browsers and
           * embedded/in-app webviews (Google actively blocks OAuth
           * inside webviews, and mobile browsers frequently block or
           * mishandle popup windows entirely) — that's the
           * "Google sign-in failed" error. signInWithRedirect avoids
           * all of that by doing a normal full-page navigation to
           * Google and back, which works everywhere. This leaves the
           * page immediately; when the page reloads after returning,
           * onAuthStateChanged (registered in boot()) fires with the
           * signed-in user like any other session, and auto-creates a
           * profile if this is a first-time sign-in.
           */
          await fb.signInWithRedirect(fb.auth, fb.googleProvider);
        }
        catch(error){
          console.error('Google sign-in error:', error);
          b.disabled = false;
          showToast('Google sign-in failed. Please try again.');
        }
      };
    });

  document.querySelectorAll('[data-action="switch-signup"]')
    .forEach(b => {
      b.onclick = () => {
        pushNav();
        state.authMode = 'signup';
        render();
      };
    });

  document.querySelectorAll('[data-action="switch-login"]')
    .forEach(b => {
      b.onclick = () => {
        pushNav();
        state.authMode = 'login';
        render();
      };
    });

  document.querySelectorAll('[data-action="switch-parent"]')
    .forEach(b => {
      b.onclick = () => {
        pushNav();
        state.authMode = 'parent';
        render();
      };
    });

  const form = document.getElementById('auth-form');

  if(!form) return;

  /* =========================================================
     PARENT LOGIN — separate, much simpler flow: no email/
     password, just Student ID + Class + Section (see
     parentLogin() for how the match is found).
     ========================================================= */
  if(state.authMode === 'parent'){
    form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const studentId = String(fd.get('studentId')||'').trim();
      const className = String(fd.get('parentClass')||'').trim();
      const section = String(fd.get('parentSection')||'').trim();

      const submitBtn = form.querySelector('button[type="submit"]');
      if(submitBtn) submitBtn.disabled = true;

      // Signing in anonymously (inside parentLogin()) fires the global
      // onAuthStateChanged listener in boot(). Without this flag it barges
      // in mid-lookup, sees a brand-new anonymous uid with no admin
      // profile, and auto-provisions/opens an empty STAFF dashboard for
      // it — that's the "useless teacher's dashboard" flash bug. Holding
      // authBusy keeps that listener out of the way until we've set
      // state.stage ourselves.
      state.authBusy = true;

      try{
        const match = await parentLogin(studentId, className, section);

        if(!match){
          showToast("We couldn't find a student with that ID, Class and Section. Please check and try again.");
          // Nothing useful to do with an anonymous session that matched no
          // student — drop it so it doesn't linger.
          if(window.attendoFirebase.auth.currentUser){
            await window.attendoFirebase.signOut(window.attendoFirebase.auth);
          }
          return;
        }

        resetSessionState();
        state.parentSession = {
          organizationId: match.organizationId,
          studentId: match.student.id,
          classGroupId: match.cls.id,
        };
        state.parentData = { student: match.student, cls: match.cls, attendance: null, marks: null };

        pushNav();
        state.stage = 'parent';
        render();
        showToast(`Welcome — showing analysis for ${match.student.name}.`);

      } catch(error){
        console.error('Parent login failed:', error);
        showToast(error.message && error.message.startsWith('Please') ? error.message : 'Something went wrong. Please try again.');
      } finally {
        if(submitBtn) submitBtn.disabled = false;
        // Safe to let the listener resume watching now — state.stage is
        // already settled either way.
        state.authBusy = false;
      }
    };
    return;
  }

  form.onsubmit = async (e) => {

    e.preventDefault();
    const fb = window.attendoFirebase;

    const fd = new FormData(form);

    const email = String(fd.get('email') || '').trim();
    const password = String(fd.get('password') || '').trim();

    const name = String(fd.get('name') || '').trim();
    const orgName = String(fd.get('org') || '').trim();
    const orgType = String(fd.get('orgType') || 'School').trim();

    if(!email || !password){
      showToast('Please enter your email and password.');
      return;
    }

    try {

      /* =========================================================
         SIGN UP
         ========================================================= */

      if(state.authMode === 'signup'){

  state.authBusy = true;

  if(!name){
    state.authBusy = false;
    showToast('Please enter your full name.');
    return;
  }

  if(!orgName){
    state.authBusy = false;
    showToast('Please enter your organization name.');
    return;
  }

  resetSessionState(); // clear any stale cached data from a previous account in this tab

  const credential =
    await window.attendoFirebase.createUserWithEmailAndPassword(
      window.attendoFirebase.auth,
      email,
      password
    );

  const user = credential.user;

  const organizationId = `ORG_${user.uid}`;

  await window.attendoFirebase.setDoc(
    window.attendoFirebase.doc(
      window.attendoFirebase.db,
      'organizations',
      organizationId
    ),
    {
      name: orgName,
      type: orgType,
      ownerId: user.uid,
      createdAt: new Date().toISOString()
    }
  );

  await window.attendoFirebase.setDoc(
    window.attendoFirebase.doc(
      window.attendoFirebase.db,
      'organizations',
      organizationId,
      'users',
      user.uid
    ),
    {
      name: name,
      email: email,
      role: 'Administrator',
      organizationId: organizationId,
      createdAt: new Date().toISOString()
    }
  );


  /*
   * Everything Firebase needs now exists.
   */

  state.user = {
    uid: user.uid,
    name: name,
    role: 'Administrator',
    email: email,
    organizationId: organizationId
  };

  state.data = {
    org:{
      name: orgName,
      type: orgType,
      lateThresholdMin: 10,
      minAttendancePct: 75
    },
    students:[],
    classes:[],
    classGroups:[],
    departments:[],
    enrollments:[],
    attendance:{},
    marks:[]
  };

  state.stage = 'app';
  state.view = 'dashboard';

  /*
   * We are finished with the auth operation.
   */
  state.authBusy = false;

  render();

  showToast(
    'Organization created — welcome to Attendo!'
  );

  return;
}

      /* =========================================================
         LOGIN
         ========================================================= */

      else {

        const credential =
          await window.attendoFirebase.signInWithEmailAndPassword(
            window.attendoFirebase.auth,
            email,
            password
          );

        const user = credential.user;

        resetSessionState(); // clear any stale cached data from a previous account in this tab

        /*
         * For now we find the organization using the same
         * organization ID convention created during signup.
         */

        const organizationId = `ORG_${user.uid}`;

        const userRef = fb.doc(
          fb.db,
          'organizations',
          organizationId,
          'users',
          user.uid
        );

        const userSnap = await fb.getDoc(userRef);

        if(!userSnap.exists()) {

          console.warn(
            "Firebase Authentication account exists, but Attendo profile was not found."
          );

          /*
          * If this account was created before our Firebase
          * integration was completed, create its Attendo profile.
          */

          const profile = {
            name: user.displayName || user.email?.split('@')[0] || 'Administrator',
            email: user.email || '',
            role: 'Administrator',
            organizationId: organizationId,
            createdAt: new Date().toISOString()
          };

          await fb.setDoc(userRef, profile);

          /*
          * Also make sure the organization exists.
          */

          await fb.setDoc(
            fb.doc(
              fb.db,
              'organizations',
              organizationId
            ),
            {
              name: 'My Organization',
              type: 'School',
              ownerId: user.uid,
              createdAt: new Date().toISOString()
            },
            {
              merge: true
            }
          );

          state.user = {
            uid: user.uid,
            name: profile.name,
            role: profile.role,
            email: profile.email,
            organizationId: organizationId
          };

        } else {

          const profile = userSnap.data();

          state.user = {
            uid: user.uid,
            name: profile.name || user.email,
            role: profile.role || 'Administrator',
            email: user.email,
            organizationId:
              profile.organizationId || organizationId
          };
        }

        state.data = await loadData();

        if(!state.data){

          state.data = {
            org:{
              name:"My Organization",
              type:"School",
              lateThresholdMin: 10,
              minAttendancePct: 75
            },
            students:[],
            classes:[],
            classGroups:[],
            departments:[],
            enrollments:[],
            attendance:{},
            marks:[]
          };

        }

        pushNav();

        state.stage = 'app';
        state.view = 'dashboard';

        render();

        showToast('Welcome back!');

      }

    }
    
    catch(error){
      state.authBusy = false;
      console.error('Firebase authentication error:', error);

      let message = 'Something went wrong. Please try again.';

      switch(error.code){

        case 'auth/email-already-in-use':
          message = 'An account with this email already exists.';
          break;

        case 'auth/invalid-email':
          message = 'Please enter a valid email address.';
          break;

        case 'auth/weak-password':
          message = 'Password should be at least 6 characters.';
          break;

        case 'auth/invalid-credential':
        case 'auth/wrong-password':
        case 'auth/user-not-found':
          message = 'Invalid email or password.';
          break;

        case 'auth/too-many-requests':
          message = 'Too many attempts. Please try again later.';
          break;

        case 'auth/network-request-failed':
          message = 'Network error. Please check your internet connection.';
          break;

        case 'permission-denied':
          message = 'Firebase permission denied. We need to configure Firestore rules.';
          break;
      }

      showToast(message);
    }
  };
}

function attachGlobalSearch(){
  const input = document.getElementById('global-search');
  const results = document.getElementById('global-search-results');
  if(!input || !results) return;

  const closeResults = ()=>{ results.classList.remove('open'); results.innerHTML=''; };

  const runSearch = (raw)=>{
    const q = raw.trim().toLowerCase();
    if(!q){ closeResults(); return; }
    const data = state.data;
    const students = (data.students||[]).filter(s =>
      s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q) || String(s.roll).includes(q)
    ).slice(0,5);
    const classes = (data.classes||[]).filter(c =>
      `${c.subject} ${c.name} ${c.section} ${c.teacher}`.toLowerCase().includes(q)
    ).slice(0,5);

    if(students.length===0 && classes.length===0){
      results.innerHTML = `<div class="gsr-empty">No matches for "${raw.trim()}"</div>`;
      results.classList.add('open');
      return;
    }

    let html = '';
    if(students.length){
      html += `<div class="gsr-sec-label">Students</div>`;
      html += students.map(s=>`<div class="gsr-item" data-type="student" data-id="${s.id}">
        <div class="s-av" style="width:28px;height:28px;font-size:10px;">${initials(s.name)}</div>
        <div><div class="gsr-name">${s.name}</div><div class="gsr-sub">Roll #${s.roll} · ${classesForStudent(s.id).map(c=>`${c.name}${c.section}`).join(', ')||'No classes'}</div></div>
      </div>`).join('');
    }
    if(classes.length){
      html += `<div class="gsr-sec-label">Classes</div>`;
      html += classes.map(c=>`<div class="gsr-item" data-type="class" data-id="${c.id}">
        <div class="gsr-ic">${ic('school').replace('<svg','<svg style="width:14px;height:14px;color:var(--blue-deep)"')}</div>
        <div><div class="gsr-name">${c.subject} — ${c.name}${c.section}</div><div class="gsr-sub">${c.teacher}${c.time?' · '+c.time:''}</div></div>
      </div>`).join('');
    }
    results.innerHTML = html;
    results.classList.add('open');

    results.querySelectorAll('[data-type="student"]').forEach(el=>el.onclick=()=>{
      pushNav();
      state.view = 'students';
      state._studentProfile = el.getAttribute('data-id');
      closeResults(); input.value='';
      render();
    });
    results.querySelectorAll('[data-type="class"]').forEach(el=>el.onclick=()=>{
      pushNav();
      state.view = 'classes';
      closeResults(); input.value='';
      render();
    });
  };

  input.oninput = (e)=> runSearch(e.target.value);
  input.onfocus = (e)=>{ if(e.target.value) runSearch(e.target.value); };
  input.onkeydown = (e)=>{ if(e.key==='Escape'){ input.value=''; closeResults(); input.blur(); } };
}

function renderDashboard(root){
  const data = state.data, today = todayStr(), wd = todayWeekday();
  const allClasses = data.classes || [];
  const todaysClasses = allClasses.filter(c => (c.days||[]).includes(wd));
  let present=0,absent=0,late=0,marked=0;
  allClasses.forEach(c=>{ const rec=data.attendance[`${today}|${c.id}`]; if(rec) Object.values(rec.records).forEach(s=>{ marked++; if(s==='Present')present++; if(s==='Absent')absent++; if(s==='Late')late++; }); });
  const pct = marked ? Math.round(present/marked*100) : 0;

  const weekLabels=[], weekVals=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i); const iso=d.toISOString().slice(0,10);
    let p=0,tot=0; allClasses.forEach(c=>{ const rec=data.attendance[`${iso}|${c.id}`]; if(rec) Object.values(rec.records).forEach(s=>{tot++; if(s==='Present')p++;}); });
    if(tot){ weekLabels.push(d.toLocaleDateString('en-US',{weekday:'short'})); weekVals.push(Math.round(p/tot*100)); }
  }

  const cards = [
    {label:'Total Students', value:data.students.length, icon:'users', color:'#2B6CF6', bg:'var(--blue-soft)'},
    {label:'Present Today', value:present, icon:'checkCircle', color:T.mintDeep, bg:'var(--mint-soft)'},
    {label:'Absent Today', value:absent, icon:'xCircle', color:T.red, bg:'var(--red-soft)'},
    {label:'Late Today', value:late, icon:'clock', color:T.amber, bg:'var(--amber-soft)'},

  root.innerHTML = `
    <div class="dash-head">
      <div><h1>${(()=>{const h=new Date().getHours();return h<12?'Good morning 👋':h<17?'Good afternoon 👋':'Good evening 👋';})()}</h1><p>Here's what's happening across your organization today.</p></div>
      <div style="display:flex;gap:10px;">
        <div style="position:relative;">
          <button class="btn btn-mint" id="compare-picto-btn">${ic('bar')} Compare Picto</button>
          <span class="new-badge">NEW</span>
        </div>
        <button class="btn btn-primary" data-action="nav" data-view="rollcall">${ic('clipboard')} Take Attendance</button>
      </div>
    </div>
    <div class="grid-4" style="margin-bottom:20px;">
      ${cards.map(c=>`<div class="card card-hover stat-card">
        <div class="stat-ic" style="background:${c.bg}">${ic(c.icon).replace('<svg','<svg style="width:18px;height:18px;color:'+c.color+'"')}</div>
        <div class="stat-val">${c.value}</div><div class="stat-lbl">${c.label}</div>
      </div>`).join('')}
    </div>
    <div class="dash-charts-grid">
      <div class="card" style="padding:22px;">
        <div class="chart-title">Today's Attendance</div>
        <div class="today-ring">
          <svg viewBox="0 0 36 36" width="140" height="140">
            <circle cx="18" cy="18" r="15.5" fill="none" stroke="#EEF2F8" stroke-width="3.2"/>
            <circle cx="18" cy="18" r="15.5" fill="none" stroke="${T.mint}" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${pct} 100" transform="rotate(-90 18 18)"/>
            <text x="18" y="21" text-anchor="middle" font-size="7" font-weight="800" fill="var(--navy)">${pct}%</text>
          </svg>
        </div>
        <div class="legend-row"><div class="dotwrap"><span class="dot" style="background:${T.mintDeep}"></span>Present</div><b>${present}</b></div>
        <div class="legend-row"><div class="dotwrap"><span class="dot" style="background:${T.red}"></span>Absent</div><b>${absent}</b></div>
        <div class="legend-row"><div class="dotwrap"><span class="dot" style="background:${T.amber}"></span>Late</div><b>${late}</b></div>
        ${marked===0?`<div style="font-size:12px;margin-top:14px;padding:12px;border-radius:12px;background:#F4F7FC;color:var(--slate);">No attendance recorded yet today. <button data-action="nav" data-view="rollcall" style="background:none;color:var(--blue);font-weight:700;">Take attendance →</button></div>`:''}
      </div>
      <div class="card" style="padding:22px;">
        <div class="chart-title">Attendance Overview — This Week</div>
        ${weekVals.length? '<canvas id="week-chart" height="120"></canvas>' : `<div class="empty"><div class="empty-ic">${ic('clipboard').replace('<svg','<svg style="width:20px;height:20px;color:var(--slate)"')}</div><div class="empty-txt">No attendance history yet.</div></div>`}
      </div>
    </div>
    <div style="margin-top:24px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
        <div class="chart-title" style="margin-bottom:0;">Today's Classes</div>
        ${allClasses.length>0?`<button class="btn btn-sm btn-outline" data-action="nav" data-view="classes">${ic('plus')} Manage Classes</button>`:''}
      </div>

        <div class="card" style="padding:40px;">

          const roster = rosterFor(c.id);
          const done = !!data.attendance[`${today}|${c.id}`];
          return `<div class="card card-hover class-row">
            <div>
              <div class="class-time">${c.time}</div>
              <div class="class-title">${c.subject} — ${c.name}${c.section}</div>

              ${done?`<span class="badge" style="background:${STATUS_META.Present.bg};color:${STATUS_META.Present.color}">${ic(STATUS_META.Present.icon).replace('<svg','<svg style="width:12px;height:12px"')} Present</span>`:`<span style="font-size:12px;color:var(--slate);font-weight:600;">Not taken</span>`}
              <div style="margin-top:8px;"><button class="btn btn-sm ${done?'btn-outline':'btn-primary'}" data-action="goto-rollcall" data-class="${c.id}">${done?'Edit':'Take Attendance'}</button></div>
            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>
  `;
  document.querySelectorAll('[data-action="nav"]').forEach(b=>b.onclick=()=>{ pushNav(); state.view=b.getAttribute('data-view'); render(); });
  document.querySelectorAll('[data-action="goto-rollcall"]').forEach(b=>b.onclick=()=>{ pushNav(); state.activeClass=b.getAttribute('data-class'); state.view='rollcall'; render(); });
  const cmpBtn = document.getElementById('compare-picto-btn');
  if(cmpBtn) cmpBtn.onclick = ()=> openComparePictoModal();

  if(weekVals.length){
    const ctx = document.getElementById('week-chart');
    if(state.charts.week) state.charts.week.destroy();
    state.charts.week = new Chart(ctx, { type:'line', data:{ labels:weekLabels, datasets:[{ data:weekVals, borderColor:T.blue, backgroundColor:T.blue, tension:.35, pointRadius:4, borderWidth:2.5 }] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{min:50,max:100, grid:{color:'#EEF2F8'}}, x:{grid:{display:false}} } } });
  }
}

/* ============================================================================
   ROLL CALL
============================================================================ */
function renderRollCall(root){
  const data = state.data;
  const classes = data.classes || [];
  if(classes.length===0){
    root.innerHTML = `<div class="card" style="padding:48px;"><div class="empty">
      <div class="empty-ic">${ic('calendar').replace('<svg','<svg style="width:20px;height:20px;color:var(--slate)"')}</div>
      <div class="empty-txt">You need a class set up before you can take attendance.</div>
      <button class="btn btn-primary" data-action="nav" data-view="classes">${ic('plus')} Add Class</button>
    </div></div>`;
    document.querySelectorAll('[data-action="nav"]').forEach(b=>b.onclick=()=>{ pushNav(); state.view=b.getAttribute('data-view'); render(); });
    return;
  }
  const cls = classes.find(c=>c.id===state.activeClass) || classes[0];
  const roster = rosterFor(cls.id).sort((a,b)=>a.roll-b.roll);
  const date = todayStr(), key = `${date}|${cls.id}`;
  const existing = (data.attendance[key] && data.attendance[key].records) || {};
  // If attendance for this class/date hasn't been saved yet, default every
  // student to Present so the teacher only has to click Absent (or Late/
  // Excused) for the exceptions, instead of marking everyone by hand. Once
  // a session is saved, re-opening it shows exactly what was saved.
  const defaultStatus = ()=>{
    if(data.attendance[key]) return {...existing};
    const m = {}; roster.forEach(s=>{ m[s.id] = 'Present'; }); return m;
  };
  if(!state._rcKey || state._rcKey!==key){ state.rcStatus = defaultStatus(); state.rcDirty=false; state._rcKey=key; }
  const statusMap = state.rcStatus;

  const search = state._rcSearch || '', filter = state._rcFilter || 'All';
  const filtered = roster.filter(s=>{
    if(search && !s.name.toLowerCase().includes(search.toLowerCase()) && !String(s.roll).includes(search)) return false;
    if(filter!=='All' && statusMap[s.id]!==filter) return false;
    return true;
  });
  const counts = STATUSES.reduce((a,st)=>{ a[st]=roster.filter(s=>statusMap[s.id]===st).length; return a; },{});
  const markedCount = Object.keys(statusMap).length;
  const saved = !!data.attendance[key] && !state.rcDirty;

  root.innerHTML = `
    <div class="card rc-meta-bar">
      <div class="rc-meta-inner">
        <div class="rc-meta"><div class="l">Class</div><div class="v">${cls.name} ${cls.section}</div></div>
        <div class="rc-meta"><div class="l">Subject</div><div class="v">${cls.subject}</div></div>
        <div class="rc-meta"><div class="l">Teacher</div><div class="v">${cls.teacher}</div></div>
        <div class="rc-meta"><div class="l">Date</div><div class="v">${prettyDate(date)}</div></div>
        <div class="rc-meta"><div class="l">Time</div><div class="v">${cls.time}</div></div>
      </div>
      <select id="rc-class-select" class="input" style="width:auto;font-weight:600;">
        ${(()=>{
          // Multiple periods can share the same class + section (e.g. two
          // Maths periods), which used to show as duplicate identical
          // entries here. Collapse those down to one option per unique
          // class name — picking it takes you to whichever specific
          // period is currently active for that class, or its first
          // period otherwise.
          const seen = new Set();
          const uniqueClasses = classes.filter(c=>{
            const label = `${c.name}${c.section}`;
            if(seen.has(label)) return false;
            seen.add(label); return true;
          });
          return uniqueClasses.map(c=>`<option value="${c.id}" ${c.name===cls.name && c.section===cls.section?'selected':''}>${c.name}${c.section}</option>`).join('');
        })()}
      </select>
    </div>

    <div class="rc-toolbar">
      <button class="btn btn-sm btn-mint" data-action="mark-all" data-status="Present">${ic('check')} Mark all Present</button>
      <button class="btn btn-sm btn-danger" data-action="mark-all" data-status="Absent">Mark all Absent</button>
      <button class="btn btn-sm btn-subtle" data-action="rc-reset">${ic('reset')} Reset</button>
      <button class="btn btn-sm btn-outline" data-action="nav" data-view="quickroll">${ic('zap')} Quick Mode</button>
      <div style="flex:1;"></div>
      <div class="search-box" style="width:220px;"><input id="rc-search" placeholder="Search student…" value="${search}"/></div>
      <select id="rc-filter" class="input" style="width:auto;">
        <option ${filter==='All'?'selected':''}>All</option>
        ${STATUSES.map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>

    <div class="rc-counts">
      ${STATUSES.map(s=>`<div class="rc-count" style="background:${STATUS_META[s].bg}"><div class="n" style="color:${STATUS_META[s].color}">${counts[s]}</div><div class="l" style="color:${STATUS_META[s].color}">${s}</div></div>`).join('')}
    </div>

    <div class="card">
      ${filtered.length===0?`<div class="empty"><div class="empty-ic">${ic('search').replace('<svg','<svg style="width:20px;height:20px;color:var(--slate)"')}</div><div class="empty-txt">No students match your search.</div></div>`:
      filtered.map(s=>`<div class="student-row">
        <div class="s-av">${initials(s.name)}</div>
        <div class="s-roll">#${s.roll}</div>
        <div class="s-info"><div class="s-name">${s.name}</div><div class="s-sub">${cls.name}${cls.section}</div></div>
        <div class="status-btns">
          ${STATUSES.map(st=>{
            const active = statusMap[s.id]===st, meta=STATUS_META[st];
            return `<button class="status-btn ${active?'active':''}" style="${active?`background:${meta.color};box-shadow:0 4px 10px -2px ${meta.color}88;`:''}" data-action="set-status" data-sid="${s.id}" data-status="${st}" title="${st}">${ic(meta.icon)}</button>`;
          }).join('')}
        </div>
      </div>`).join('')}
    </div>

    <div class="rc-savebar">
      <div class="status-txt">${markedCount}/${roster.length} marked ${saved?`<span style="color:${T.mintDeep};font-weight:700;">· Saved</span>`:''}${state.rcDirty?`<span style="color:${T.amber};font-weight:700;">· Unsaved changes</span>`:''}</div>
      <button class="btn btn-primary" id="rc-save" ${markedCount===0?'disabled':''}>${ic('save')} Save Attendance</button>
    </div>
  `;

  document.querySelectorAll('[data-action="set-status"]').forEach(b=>b.onclick=()=>{
    state.rcStatus[b.getAttribute('data-sid')] = b.getAttribute('data-status');
    state.rcDirty = true; renderRollCall(root);
  });
  document.querySelectorAll('[data-action="mark-all"]').forEach(b=>b.onclick=()=>{
    const st = b.getAttribute('data-status'); const m={}; roster.forEach(s=>m[s.id]=st);
    state.rcStatus = m; state.rcDirty=true; renderRollCall(root);
  });
  document.querySelector('[data-action="rc-reset"]').onclick=()=>{ state.rcStatus=defaultStatus(); state.rcDirty=false; renderRollCall(root); };
  document.getElementById('rc-search').oninput = (e)=>{ state._rcSearch = e.target.value; renderRollCall(root); document.getElementById('rc-search').focus(); document.getElementById('rc-search').setSelectionRange(999,999); };
  document.getElementById('rc-filter').onchange = (e)=>{ state._rcFilter = e.target.value; renderRollCall(root); };
  document.getElementById('rc-class-select').onchange = (e)=>{
    if(state.rcDirty && !confirm('You have unsaved attendance changes. Leave without saving?')){ renderRollCall(root); return; }
    state.activeClass = e.target.value; renderRollCall(root);
  };
  document.querySelectorAll('[data-action="nav"]').forEach(b=>b.onclick=()=>{
    if(state.rcDirty && !confirm('You have unsaved attendance changes. Leave without saving?')) return;
    state.view = b.getAttribute('data-view'); render();
  });
  document.getElementById('rc-save').onclick = async ()=>{
    await saveAttendanceSession(cls, date, state.rcStatus);
    state.rcDirty=false;
    showToast(`Attendance Saved — ${counts.Present} Present, ${counts.Absent} Absent, ${counts.Late} Late`);
    renderRollCall(root);
  };
}

/* ============================================================================
   QUICK ROLL CALL
============================================================================ */
function renderQuickRoll(){
  const data = state.data;
  const classes = data.classes || [];
  if(classes.length===0) return `<div class="qr-overlay"><div class="qr-top"><button class="qr-exit" data-action="qr-exit">${ic('arrowLeft')} Back</button></div><div class="qr-body"><div style="color:#fff;font-weight:600;">No classes set up yet.</div><div style="color:rgba(255,255,255,.5);font-size:13.5px;margin-top:8px;">Add a class first to take attendance.</div></div></div>`;
  const cls = classes.find(c=>c.id===state.activeClass) || classes[0];
  const roster = rosterFor(cls.id).sort((a,b)=>a.roll-b.roll);
  const date = todayStr(), key = `${date}|${cls.id}`;
  if(state._qrKey!==key){ state.quickStatus = {...((data.attendance[key]||{}).records||{})}; state.quickIdx=0; state._qrKey=key; }
  const idx = Math.min(state.quickIdx, roster.length-1);
  const current = roster[idx];
  if(!current) return `<div class="qr-overlay"><div class="qr-top"><button class="qr-exit" data-action="qr-exit">${ic('arrowLeft')} Back</button></div><div class="qr-body"><div style="color:#fff;font-weight:600;">No students in this class.</div><div style="color:rgba(255,255,255,.5);font-size:13.5px;margin-top:8px;">Add students to ${cls.name}${cls.section} first.</div></div></div>`;
  const status = state.quickStatus[current.id];

  return `<div class="qr-overlay">
    <div class="qr-top">
      <button class="qr-exit" data-action="qr-exit">${ic('arrowLeft')} Exit Quick Mode</button>
      <div class="qr-classname">${cls.subject} — ${cls.name}${cls.section}</div>
    </div>
    <div class="qr-body">
      <div class="qr-progtxt">Student ${idx+1} / ${roster.length}</div>
      <div class="qr-progbar"><div class="qr-progbar-fill" style="width:${(idx+1)/roster.length*100}%"></div></div>
      <div class="qr-avatar">
        ${initials(current.name)}
        ${status?`<div class="qr-status-pill" style="background:${STATUS_META[status].color}">${status}</div>`:''}
      </div>
      <div class="qr-name">${current.name}</div>
      <div class="qr-sub">Roll #${current.roll} · ${cls.name}${cls.section}</div>
      <div class="qr-btns">
        ${['Present','Absent','Late'].map(s=>`<button class="qr-btn" style="background:${STATUS_META[s].color};box-shadow:0 10px 30px -10px ${STATUS_META[s].color}" data-action="qr-mark" data-status="${s}">${ic(STATUS_META[s].icon).replace('<svg','<svg style="width:24px;height:24px"')}<span style="font-size:12px;">${s} (${s[0]})</span></button>`).join('')}
      </div>
      <div class="qr-hint">
        <button data-action="qr-prev">${ic('chevLeft')} Prev (←)</button>
        <span class="qr-kbd-only">Space = confirm</span>
        <button data-action="qr-next">Next (→) ${ic('chevRight')}</button>
      </div>
    </div>
    <div class="qr-bottom"><button class="btn btn-mint btn-lg" data-action="qr-finish">${ic('save')} Finish & Save Attendance</button></div>
  </div>`;
}
function attachQuickRollEvents(){
  const data = state.data;
  const classes = data.classes || [];
  const bindExit = ()=>{ const b=document.querySelector('[data-action="qr-exit"]'); if(b) b.onclick=()=>{ state.view='rollcall'; render(); }; };
  if(classes.length===0){ bindExit(); return; }
  const cls = classes.find(c=>c.id===state.activeClass) || classes[0];
  const roster = rosterFor(cls.id).sort((a,b)=>a.roll-b.roll);
  if(roster.length===0){ bindExit(); return; }
  const mark = (status)=>{
    const idx = Math.min(state.quickIdx, roster.length-1); const cur = roster[idx];
    if(!cur) return;
    state.quickStatus[cur.id] = status;
    state.quickIdx = Math.min(idx+1, roster.length-1);
    render();
  };
  document.querySelectorAll('[data-action="qr-mark"]').forEach(b=>b.onclick=()=>mark(b.getAttribute('data-status')));
  const prevBtn = document.querySelector('[data-action="qr-prev"]'); if(prevBtn) prevBtn.onclick=()=>{ state.quickIdx=Math.max(state.quickIdx-1,0); render(); };
  const nextBtn = document.querySelector('[data-action="qr-next"]'); if(nextBtn) nextBtn.onclick=()=>{ state.quickIdx=Math.min(state.quickIdx+1,roster.length-1); render(); };
  const exitBtn = document.querySelector('[data-action="qr-exit"]'); if(exitBtn) exitBtn.onclick=()=>{ state.view='rollcall'; render(); };
  const finishBtn = document.querySelector('[data-action="qr-finish"]');
  if(finishBtn) finishBtn.onclick = async ()=>{
    await saveAttendanceSession(cls, todayStr(), state.quickStatus);
    const counts = STATUSES.reduce((a,s)=>{ a[s]=roster.filter(r=>state.quickStatus[r.id]===s).length; return a; },{});
    showToast(`Attendance Saved — ${counts.Present} Present, ${counts.Absent} Absent, ${counts.Late} Late`);
    state.view='dashboard'; render();
  };
  document.onkeydown = (e)=>{
    if(state.view!=='quickroll') return;
    const k = e.key.toLowerCase();
    if(k==='p') mark('Present');
    else if(k==='a') mark('Absent');
    else if(k==='l') mark('Late');
    else if(e.key==='ArrowRight'){ state.quickIdx=Math.min(state.quickIdx+1,roster.length-1); render(); }
    else if(e.key==='ArrowLeft'){ state.quickIdx=Math.max(state.quickIdx-1,0); render(); }
    else if(e.key==='Escape'){ state.view='rollcall'; render(); }
  };
}

/* ============================================================================
   STUDENTS
============================================================================ */
function renderStudents(root){
  const data = state.data;
  if(state._studentProfile){ return renderStudentProfile(root); }
  const search = state._stuSearch || '', classFilter = state._stuClassFilter || 'All', deptFilter = state._stuDeptFilter || 'All';
  const minOnly = !!state._stuMinOnly;
  const minPct = data.org.minAttendancePct ?? 75;
  const filtered = data.students.filter(s=>{
    if(deptFilter!=='All' && s.departmentId!==deptFilter) return false;
    if(classFilter!=='All' && !(state.data.enrollments||[]).some(e=>e.studentId===s.id && e.classGroupId===classFilter)) return false;
    if(search && !s.name.toLowerCase().includes(search.toLowerCase()) && !s.id.toLowerCase().includes(search.toLowerCase())) return false;
    if(minOnly && attendancePct(data, s.id) >= minPct) return false;
    return true;
  }).sort((a,b)=> (a.roll ?? 0) - (b.roll ?? 0));

  root.innerHTML = `
    <div class="page-head">
      <div><h1>Students</h1><p>${data.students.length} students across ${(data.departments||[]).length} departments · ${(data.classGroups||[]).length} classes</p></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline" id="stu-export">${ic('download')} Export</button>
        <button class="btn btn-primary" id="stu-add">${ic('plus')} Add Student</button>
      </div>
    </div>
    <div class="filters-row">
      <div class="search-box">${ic('search').replace('<svg','<svg style="width:14px;height:14px;color:var(--slate)"')}<input id="stu-search" placeholder="Search by name or ID…" value="${search}"/></div>
      <select id="stu-dept-filter" class="input">
        <option value="All" ${deptFilter==='All'?'selected':''}>All Departments</option>
        ${(data.departments||[]).map(d=>`<option value="${d.id}" ${deptFilter===d.id?'selected':''}>${d.name}</option>`).join('')}
      </select>
      <select id="stu-class-filter" class="input">
        <option value="All" ${classFilter==='All'?'selected':''}>All Classes</option>
        ${(data.classGroups||[]).map(g=>`<option value="${g.id}" ${classFilter===g.id?'selected':''}>${g.name}${g.section}</option>`).join('')}
      </select>
      <button class="btn btn-sm" id="stu-min-toggle" title="Show only students below ${minPct}% attendance" style="background:${minOnly?T.red:'var(--red-soft)'};color:${minOnly?'#fff':T.red};">${ic('alert').replace('<svg','<svg style="width:13px;height:13px"')} Min</button>
    </div>
    <div class="card table-wrap">
      <table>
        <thead><tr><th>Student</th><th>Department</th><th>Classes</th><th>Email</th><th title="Based on the last 14 days — open a student's profile for their full history">Attendance (14d)</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${filtered.length===0?`<tr><td colspan="7"><div class="empty"><div class="empty-ic">${ic('users').replace('<svg','<svg style="width:20px;height:20px;color:var(--slate)"')}</div><div class="empty-txt">No students match your filters.</div></div></td></tr>`:
          filtered.map(s=>{
            const pct = attendancePct(data, s.id);
            const enrolled = classesForStudent(s.id);
            return `<tr class="clickable" data-action="open-profile" data-sid="${s.id}">
              <td><div class="tname"><div class="s-av" style="width:32px;height:32px;font-size:11px;">${initials(s.name)}</div><div><div class="n">${s.name}</div><div class="s">Roll #${s.roll} · ${s.id}</div></div></div></td>
              <td style="color:var(--slate)">${deptNameOf(s.departmentId)||'—'}</td>
              <td style="color:var(--slate)">${enrolled.length?enrolled.map(c=>`${c.name}${c.section}`).join(', '):'—'}</td>
              <td style="color:var(--slate)">${s.email}</td>
              <td style="font-weight:700;color:${pct<(data.org.minAttendancePct??75)?T.red:T.mintDeep}">${pct}%</td>
              <td><span class="badge" style="background:var(--mint-soft);color:${T.mintDeep}">${s.status}</span></td>
              <td>
                <div class="row-actions" onclick="event.stopPropagation()">
                  <button class="icon-btn" data-action="edit-student" data-sid="${s.id}">${ic('edit').replace('<svg','<svg style="width:14px;height:14px;color:var(--slate)"')}</button>
                  <button class="icon-btn" data-action="delete-student" data-sid="${s.id}">${ic('trash').replace('<svg','<svg style="width:14px;height:14px;color:'+T.red+'"')}</button>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('stu-search').oninput = (e)=>{ state._stuSearch=e.target.value; renderStudents(root); document.getElementById('stu-search').focus(); document.getElementById('stu-search').setSelectionRange(999,999); };
  document.getElementById('stu-class-filter').onchange = (e)=>{ state._stuClassFilter=e.target.value; renderStudents(root); };
  document.getElementById('stu-dept-filter').onchange = (e)=>{ state._stuDeptFilter=e.target.value; renderStudents(root); };
  document.getElementById('stu-min-toggle').onclick = ()=>{ state._stuMinOnly = !state._stuMinOnly; renderStudents(root); };
  document.getElementById('stu-add').onclick = ()=> openStudentModal(null, classFilter!=='All' ? classFilter : null);
  document.getElementById('stu-export').onclick = ()=>{
    const rows=[["Student ID","Roll","Name","Email","Department","Classes","Status"], ...filtered.map(s=>[s.id,s.roll,s.name,s.email,deptNameOf(s.departmentId),classesForStudent(s.id).map(c=>`${c.name}${c.section}`).join('; '),s.status])];
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join(String.fromCharCode(10));
    const blob = new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='students.csv'; a.click();
    showToast('Students exported to CSV');
  };
  document.querySelectorAll('[data-action="open-profile"]').forEach(r=>r.onclick=()=>{ state._studentProfile = r.getAttribute('data-sid'); renderStudents(root); });
  document.querySelectorAll('[data-action="edit-student"]').forEach(b=>b.onclick=()=> openStudentModal(b.getAttribute('data-sid')));
  document.querySelectorAll('[data-action="delete-student"]').forEach(b=>b.onclick=()=> deleteStudent(b.getAttribute('data-sid')));
}

function openStudentModal(studentId, presetClassId){
  const data = state.data;
  const classGroups = data.classGroups || [];
  const departments = data.departments || [];
  if(classGroups.length===0){ showToast('Add a class first'); state.view='classes'; render(); return; }
  const student = studentId ? data.students.find(s=>s.id===studentId) : null;
  const enrolledGroupIds = new Set(student ? classesForStudent(student.id).map(g=>g.id) : (presetClassId && classGroups.some(g=>g.id===presetClassId) ? [presetClassId] : []));
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="card modal">
    <div class="modal-head"><h3>${student?'Edit Student':'Add Student'}</h3><button class="modal-close" id="modal-close">${ic('x')}</button></div>
    <form id="student-form">
      <div class="field"><label>Full Name</label><input required name="name" class="input" value="${student?student.name:''}"/></div>
      <div class="modal-grid2">
        <div class="field"><label>Roll Number</label><input required type="number" name="roll" class="input" value="${student?student.roll:''}"/></div>
        <div class="field"><label>Department</label><select name="departmentId" class="input" style="width:100%;"><option value="">— None —</option>${departments.map(d=>`<option value="${d.id}" ${student&&student.departmentId===d.id?'selected':''}>${d.name}</option>`).join('')}</select></div>
      </div>
      <div class="field">
        <label>Class</label>
        <div style="display:flex;flex-direction:column;gap:6px;max-height:170px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;padding:10px 12px;">
          ${classGroups.map(g=>`<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;">
            <input type="checkbox" name="classGroupIds" value="${g.id}" ${enrolledGroupIds.has(g.id)?'checked':''}/> ${g.name}${g.section}
          </label>`).join('')}
        </div>
        <div style="font-size:11.5px;color:var(--slate);margin-top:6px;">Selecting a class enrolls this student in every timetable period scheduled under it.</div>
      </div>
      <div class="field"><label>Email</label><input required type="email" name="email" class="input" value="${student?student.email:''}"/></div>
      <div class="field"><label>Phone</label><input name="phone" class="input" value="${student?student.phone||'':''}"/></div>
      <div class="field"><label>Parent / Guardian</label><input name="guardian" class="input" value="${student?student.guardian||'':''}"/></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Student</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#modal-close').onclick = close;
  overlay.querySelector('#modal-cancel').onclick = close;
  overlay.querySelector('#student-form').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const selectedGroupIds = fd.getAll('classGroupIds');
    const payload = { name:fd.get('name'), roll:Number(fd.get('roll')), departmentId:fd.get('departmentId')||null, email:fd.get('email'), phone:fd.get('phone'), guardian:fd.get('guardian'), status:'Active', enrolled: student?student.enrolled:todayStr() };
    let studentId2;
    if(student){
      Object.assign(student, payload);
      studentId2 = student.id;
      showToast('Student updated');
    } else {
      studentId2 = `S${2000+Math.floor(Math.random()*9000)}`;
      data.students.push({ id: studentId2, ...payload });
      showToast('New student added');
    }
    // Reconcile enrollments: add newly-checked class groups, remove
    // unchecked ones. Enrolling in a group is what makes this student
    // show up in every timetable period under it — see rosterFor().
    if(!data.enrollments) data.enrollments = [];
    const existingForStudent = new Set(data.enrollments.filter(en=>en.studentId===studentId2).map(en=>en.classGroupId));
    for(const classGroupId of selectedGroupIds){
      if(!existingForStudent.has(classGroupId)){
        data.enrollments.push({ id:`${classGroupId}_${studentId2}`, studentId:studentId2, classGroupId, departmentId: payload.departmentId, enrolledAt: todayStr() });
      }
    }
    data.enrollments = data.enrollments.filter(en => en.studentId!==studentId2 || selectedGroupIds.includes(en.classGroupId));
    await persist(data); close(); renderView();
  };
}
async function deleteStudent(sid){
  if(!confirm('Delete this student? This cannot be undone.')) return;
  const data = state.data;
  data.students = data.students.filter(s=>s.id!==sid);
  data.enrollments = (data.enrollments||[]).filter(en=>en.studentId!==sid);
  await persist(data);
  showToast('Student deleted');
  renderView();
}

function renderStudentProfile(root){
  const data = state.data;
  const student = data.students.find(s=>s.id===state._studentProfile);
  if(!student){ state._studentProfile=null; return renderStudents(root); }
  const enrolled = classesForStudent(student.id);
  const cachedHistory = state._studentHistoryCache && state._studentHistoryCache[student.id];

  const renderBody = (history, loading)=>{
    const present = history.filter(h=>h.status==='Present').length;
    const absent = history.filter(h=>h.status==='Absent').length;
    const late = history.filter(h=>h.status==='Late').length;
    const total = history.length;
    const pct = total ? Math.round(present/total*100) : 100;

    root.innerHTML = `
      <button class="back-link" id="back-to-students">${ic('arrowLeft')} Back to Students</button>
      <div class="card profile-head">
        <div class="profile-id">
          <div class="profile-av">${initials(student.name)}</div>
          <div><div class="profile-name">${student.name}</div><div class="profile-meta">Roll #${student.roll} · ${deptNameOf(student.departmentId)||'No department'} · ${enrolled.length?enrolled.map(c=>`${c.name}${c.section}`).join(', '):'No classes'} · ${student.email}</div></div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" id="profile-marks">${ic('bar')} View Marks</button>
          <button class="btn btn-outline" id="profile-edit">${ic('edit')} Edit</button>
          <button class="btn btn-danger" id="profile-delete">${ic('trash')} Delete</button>
        </div>
      </div>
      <div class="grid-4" style="margin-bottom:20px;">
        <div class="card statbox"><div class="n" style="color:${pct<(data.org.minAttendancePct??75)?T.red:T.mintDeep}">${loading?'…':pct+'%'}</div><div class="l">Attendance (all-time)</div></div>
        <div class="card statbox"><div class="n" style="color:${T.mintDeep}">${loading?'…':present}</div><div class="l">Present Days</div></div>
        <div class="card statbox"><div class="n" style="color:${T.red}">${loading?'…':absent}</div><div class="l">Absent Days</div></div>
        <div class="card statbox"><div class="n" style="color:${T.amber}">${loading?'…':late}</div><div class="l">Late Days</div></div>
      </div>
      <div class="card" style="padding:22px;">
        <div class="chart-title">Attendance History${total>15?` <span style="font-weight:500;color:var(--slate);font-size:12px;">(most recent 15 of ${total})</span>`:''}</div>
        ${loading?`<div class="empty"><div class="empty-txt">Loading full attendance history…</div></div>`:
        history.length===0?`<div class="empty"><div class="empty-txt">No attendance recorded yet.</div></div>`:
        history.slice(0,15).map(h=>`<div class="hist-row"><span>${prettyDate(h.date)} · ${h.subject}</span><span class="badge" style="background:${STATUS_META[h.status].bg};color:${STATUS_META[h.status].color}">${ic(STATUS_META[h.status].icon).replace('<svg','<svg style="width:12px;height:12px"')} ${h.status}</span></div>`).join('')}
      </div>
    `;
    document.getElementById('back-to-students').onclick = ()=>{ state._studentProfile=null; renderView(); };
    document.getElementById('profile-marks').onclick = ()=>{
      pushNav();
      state._studentProfile = null;
      state._markStudentFilter = student.id;
      state.view = 'marks';
      render();
    };
    document.getElementById('profile-edit').onclick = ()=> openStudentModal(student.id);
    document.getElementById('profile-delete').onclick = ()=> deleteStudent(student.id);
  };

  if(cachedHistory){
    renderBody(cachedHistory, false);
    return;
  }

  // Full multi-year history isn't preloaded (see loadData()'s 14-day
  // window) — fetch it on demand, scoped to just this one student via
  // an indexed query, so opening a profile stays fast no matter how
  // large the college-wide attendance collection has grown.
  renderBody([], true);
  fetchStudentAttendanceHistory(student.id).then(history=>{
    if(!state._studentHistoryCache) state._studentHistoryCache = {};
    state._studentHistoryCache[student.id] = history;
    if(state._studentProfile===student.id) renderBody(history, false);
  }).catch(err=>{
    console.error('Failed to load student attendance history:', err);
    if(state._studentProfile===student.id) renderBody([], false);
  });
}

      // their parent group for display (Roll Call, Marks, History all
      // read c.name/c.section straight off the period) — keep them in
      // sync so an edit here doesn't leave periods showing stale info.
      (data.classes||[]).forEach(c=>{ if(c.classGroupId===group.id){ c.name=payload.name; c.section=payload.section; c.departmentId=payload.departmentId; } });

    await persist(data); close(); renderView();
  };
}
