<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="logo.ico">
<title>Attendo — Smart Attendance, Simple Roll Call</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
/* ============================= TOKENS ============================= */
:root{
  --blue:#2B6CF6; --blue-deep:#1E4FD1; --blue-soft:#EAF1FF;
  --mint:#12C99B; --mint-deep:#0EA37D; --mint-soft:#E1FBF3;
  --navy:#0B1E3D; --slate:#64748B; --border:#E7ECF5;
  --amber:#F5A524; --amber-soft:#FFF4E0; --amber-text:#92660E;
  --red:#EF5A5A; --red-soft:#FDEBEB;
  --bg:#FAFCFF; --card-shadow:0 1px 2px rgba(11,30,61,.04), 0 8px 24px -12px rgba(11,30,61,.08);
  --surface:#fff; --surface-2:#F4F7FC; --surface-3:#F7FAFD; --table-head-bg:#F8FAFD;
}
html.dark{
  --blue:#5B8DFF; --blue-deep:#8FB4FF; --blue-soft:#17253F;
  --mint:#2FE1B4; --mint-deep:#6FEFCB; --mint-soft:#0F2E28;
  --navy:#E7ECFA; --slate:#93A4C4; --border:#26314E;
  --amber:#FFC155; --amber-soft:#3B2C10; --amber-text:#FFCB70;
  --red:#FF7C7C; --red-soft:#3A1A1A;
  --bg:#0B1220; --card-shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.6);
  --surface:#131B2E; --surface-2:#1A2439; --surface-3:#1E293F; --table-head-bg:#141D33;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--navy); background:var(--bg); -webkit-font-smoothing:antialiased;
  transition:background .15s,color .15s;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none;}
input,select{font-family:inherit;}
ul{list-style:none;}
img{max-width:100%; display:block;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#D7E0F0; border-radius:8px;}

.container{max-width:1200px; margin:0 auto; padding:0 24px;}

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border-radius:12px; font-weight:600; font-size:14px; padding:10px 18px;
  transition:.15s; white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5; pointer-events:none;}
.btn-lg{padding:14px 26px; font-size:16px; border-radius:14px;}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:10px;}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-deep)); color:#fff; box-shadow:0 6px 16px -6px rgba(43,108,246,.5);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-mint{background:linear-gradient(135deg,var(--mint),var(--mint-deep)); color:#fff; box-shadow:0 6px 16px -6px rgba(18,201,155,.5);}
.btn-mint:hover{filter:brightness(1.06);}
.btn-outline{background:var(--surface); color:var(--navy); border:1px solid var(--border);}
.btn-outline:hover{background:var(--surface-3);}
.btn-ghost{background:var(--blue-soft); color:var(--blue-deep);}
.btn-ghost:hover{filter:brightness(1.03);}
.btn-danger{background:var(--red-soft); color:var(--red);}
.btn-danger:hover{filter:brightness(.98);}
.btn-subtle{background:#F4F7FC; color:var(--navy);}
.icon{width:15px; height:15px; stroke-width:2.25; flex-shrink:0;}

/* ============================= CARD ============================= */
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--card-shadow);}
.card-hover{transition:.2s;}
.card-hover:hover{transform:translateY(-2px); box-shadow:0 20px 34px -18px rgba(11,30,61,.18);}

/* ============================= INPUT ============================= */
.field{display:block; margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; margin-bottom:6px; color:var(--navy);}
.input{
  width:100%; padding:10px 14px; border-radius:12px; border:1px solid var(--border);
  font-size:14px; outline:none; transition:.15s; background:var(--surface); color:var(--navy);
}
.input:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft);}
select.input{width:auto;}

/* ============================= BADGE ============================= */
.badge{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:5px 11px; font-size:12px; font-weight:700;}

/* ============================= TOAST ============================= */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  z-index:400; display:none; align-items:center; gap:12px;
  background:var(--navy); color:#fff; border-radius:16px; padding:14px 20px;
  box-shadow:0 20px 45px -15px rgba(11,30,61,.5); font-size:14px; font-weight:500;
  animation:toastIn .25s ease-out;
}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);}}
.toast-tick{width:26px; height:26px; border-radius:999px; background:var(--mint); display:grid; place-items:center; flex-shrink:0;}

/* ============================= LANDING ============================= */
.nav-landing{position:sticky; top:0; z-index:100; backdrop-filter:blur(10px); background:rgba(255,255,255,.85); border-bottom:1px solid var(--border);}
.nav-landing .container{height:64px; display:flex; align-items:center; justify-content:space-between;}
.nav-links{display:flex; gap:32px; font-size:14px; font-weight:500; color:var(--slate);}
.nav-links a:hover{color:var(--navy);}
.logo{display:flex; align-items:center; gap:8px;}
.logo-mark{width:32px; height:32px; border-radius:12px; background:linear-gradient(135deg,var(--blue),var(--mint)); display:grid; place-items:center; flex-shrink:0;}
.logo-text{font-size:17px; font-weight:800; letter-spacing:-.02em;}

.hero{padding:70px 0 90px; display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center;}
.eyebrow{display:inline-flex; align-items:center; gap:6px; background:var(--blue-soft); color:var(--blue-deep); font-size:12px; font-weight:700; padding:7px 13px; border-radius:999px; margin-bottom:22px;}
.hero h1{font-size:56px; line-height:1.05; font-weight:800; letter-spacing:-.02em; color:var(--navy);}
.hero h1 span{color:var(--blue);}
.hero p{font-size:18px; line-height:1.6; color:var(--slate); max-width:460px; margin-top:22px;}
.hero-cta{display:flex; gap:12px; margin-top:32px;}
.hero-trust{display:flex; gap:24px; margin-top:36px; font-size:14px; color:var(--slate);}
.hero-trust > div{display:flex; align-items:center; gap:6px;}

.section-eyebrow{font-size:13px; font-weight:700; color:var(--blue); margin-bottom:8px; letter-spacing:.02em;}
.section-title{font-size:32px; font-weight:800; color:var(--navy); letter-spacing:-.01em;}
.section{padding:64px 0;}
.section-tinted{background:linear-gradient(180deg,#F8FBFF,#FFFFFF);}

.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}

.org-tile{padding:20px; display:flex; align-items:center; gap:12px;}
.org-tile .ic{width:40px; height:40px; border-radius:12px; background:var(--blue-soft); display:grid; place-items:center; flex-shrink:0;}
.org-tile span{font-size:14px; font-weight:600;}

.feature-card{padding:26px;}
.feature-ic{width:44px; height:44px; border-radius:16px; background:linear-gradient(135deg,var(--blue-soft),var(--mint-soft)); display:grid; place-items:center; margin-bottom:16px;}
.feature-card h3{font-size:16px; font-weight:700; margin-bottom:6px;}
.feature-card p{font-size:14px; color:var(--slate); line-height:1.55;}

.step{padding-right:12px;}
.step .num{font-size:46px; font-weight:800; color:var(--blue-soft); margin-bottom:10px;}
.step h4{font-size:17px; font-weight:700; margin-bottom:6px;}
.step p{font-size:14px; color:var(--slate); line-height:1.55;}


.security-card{padding:44px; border-radius:20px; background:linear-gradient(135deg,var(--navy),#122A55); display:grid; grid-template-columns:1fr 1fr; gap:32px; align-items:center; border:none;}
.security-card h2{color:#fff; font-size:24px; font-weight:800; margin:14px 0 10px;}
.security-card p{color:#B9C6E0; font-size:14px; line-height:1.6;}
.security-pills{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.security-pills div{background:rgba(255,255,255,.08); color:#fff; border-radius:12px; padding:12px 14px; font-size:13.5px; font-weight:600;}

.testi-card{padding:24px;}
.testi-card p{font-size:14px; line-height:1.6; margin-bottom:16px;}
.testi-name{font-size:14px; font-weight:700;}
.testi-role{font-size:12px; color:var(--slate);}


.faq-item{padding:18px 20px; cursor:pointer;}
.faq-q{display:flex; align-items:center; justify-content:between; justify-content:space-between; font-size:14px; font-weight:700;}
.faq-a{font-size:13.5px; color:var(--slate); margin-top:10px; line-height:1.6; display:none;}
.faq-item.open .faq-a{display:block;}
.faq-item.open .chev{transform:rotate(90deg);}
.chev{transition:.15s;}

.footer{border-top:1px solid var(--border); padding:36px 0; display:flex; justify-content:space-between; align-items:center; margin-top:20px;}
.footer-copy{font-size:12px; color:var(--slate);}

/* ============================= 3D FLOAT CARD ============================= */
.float-wrap{position:relative; height:400px; perspective:1400px;}
@keyframes floatY{0%,100%{transform:translateY(0) rotateY(-10deg) rotateX(4deg);} 50%{transform:translateY(-14px) rotateY(-10deg) rotateX(4deg);}}
@keyframes floatY2{0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);}}
@keyframes orbit{from{transform:rotate(0deg) translateX(150px) rotate(0deg);} to{transform:rotate(360deg) translateX(150px) rotate(-360deg);}}
@keyframes orbit2{from{transform:rotate(90deg) translateX(170px) rotate(-90deg);} to{transform:rotate(450deg) translateX(170px) rotate(-450deg);}}
.orbit-wrap{position:absolute; inset:0; display:grid; place-items:center;}
.orbit-a{position:absolute; width:34px; height:34px; border-radius:12px; background:var(--mint-soft); display:grid; place-items:center; animation:orbit 14s linear infinite;}
.orbit-b{position:absolute; width:34px; height:34px; border-radius:12px; background:var(--blue-soft); display:grid; place-items:center; animation:orbit2 18s linear infinite;}
.float-main{
  position:absolute; inset:32px 16px auto 16px; border-radius:24px; padding:24px;
  background:linear-gradient(160deg, rgba(255,255,255,.92), rgba(234,241,255,.85));
  backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.6);
  box-shadow:0 30px 60px -20px rgba(30,79,209,.35), inset 0 1px 0 rgba(255,255,255,.8);
  transform-style:preserve-3d; animation:floatY 6s ease-in-out infinite;
}
.float-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
.float-pct{font-size:30px; font-weight:800;}
.float-label{font-size:11px; font-weight:700; color:var(--slate); letter-spacing:.03em;}
.float-ring{width:64px; height:64px; position:relative;}
.float-ring svg{transform:rotate(-90deg);}
.float-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.float-stat{border-radius:16px; padding:12px; text-align:left;}
.float-stat .n{font-size:17px; font-weight:800;}
.float-stat .l{font-size:10.5px; font-weight:600;}
.float-chip{
  position:absolute; left:0; bottom:20px; background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:9px 12px; display:flex; align-items:center; gap:9px;
  box-shadow:0 20px 30px -15px rgba(11,30,61,.25); animation:floatY2 7s ease-in-out infinite .5s;
}
.chip-av{width:28px; height:28px; border-radius:999px; display:grid; place-items:center; color:#fff; font-size:11px; font-weight:800; background:linear-gradient(135deg,var(--blue),var(--mint));}

/* ============================= AUTH ============================= */
.auth-wrap{min-height:100vh; display:grid; grid-template-columns:1fr 1fr;}
.auth-side{background:linear-gradient(160deg,var(--navy),#10265A); padding:48px; display:flex; flex-direction:column; justify-content:space-between;}
.auth-quote{color:#9FB1D4; font-size:13.5px; line-height:1.6;}
.auth-form-wrap{display:flex; align-items:center; justify-content:center; padding:32px;}
.auth-form{width:100%; max-width:380px;}
.auth-title{font-size:26px; font-weight:800; margin-bottom:6px;}
.auth-sub{font-size:14px; color:var(--slate); margin-bottom:26px;}
.auth-row{display:flex; align-items:center; justify-content:space-between; font-size:13.5px; margin-bottom:16px;}
.auth-switch{text-align:center; font-size:14px; color:var(--slate); margin-top:22px;}
.auth-switch button{color:var(--blue); font-weight:700; background:none;}

/* ============================= APP SHELL ============================= */
.shell{min-height:100vh; display:flex; background:var(--bg);}
.sidebar{width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); padding:16px; display:flex; flex-direction:column;}
.sidebar-logo{padding:8px; margin-bottom:22px;}
.nav-item{
  width:100%; display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px;
  font-size:14px; font-weight:600; color:var(--slate); background:none; text-align:left;
}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--blue-soft); color:var(--blue-deep);}
.nav-list{display:flex; flex-direction:column; gap:2px; flex:1;}
.quickroll-btn{display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:12px; font-size:14px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--mint),var(--mint-deep)); margin-bottom:12px;}
.user-chip{display:flex; align-items:center; gap:9px; padding:8px; border-radius:12px; background:var(--surface-2);}
.user-av{width:32px; height:32px; border-radius:999px; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:800; background:linear-gradient(135deg,var(--blue),var(--mint)); flex-shrink:0;}
.user-meta{flex:1; min-width:0;}
.user-name{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.user-role{font-size:11px; color:var(--slate);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{height:64px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 28px; border-bottom:1px solid var(--border); background:var(--surface);}
.search-box{display:flex; align-items:center; gap:8px; background:var(--surface-2); border-radius:12px; padding:9px 13px; width:280px;}
.search-box input{background:none; border:none; outline:none; font-size:14px; flex:1; color:var(--navy);}
.global-search-results{
  position:absolute; top:calc(100% + 8px); left:0; width:340px; max-height:380px; overflow-y:auto;
  background:#fff; border:1px solid var(--border); border-radius:14px;
  box-shadow:0 24px 44px -14px rgba(11,30,61,.2); z-index:300; display:none;
}
.global-search-results.open{display:block;}
.gsr-sec-label{font-size:11px; font-weight:700; color:var(--slate); padding:10px 14px 4px; text-transform:uppercase; letter-spacing:.03em;}
.gsr-item{display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer;}
.gsr-item:hover{background:var(--surface-3);}
.gsr-name{font-size:13px; font-weight:700; color:var(--navy);}
.gsr-sub{font-size:11px; color:var(--slate);}
.gsr-empty{padding:18px 14px; text-align:center; font-size:13px; color:var(--slate);}
.gsr-ic{width:28px; height:28px; border-radius:9px; display:grid; place-items:center; flex-shrink:0; background:var(--blue-soft);}
.bell-wrap{position:relative;}
.bell-dot{position:absolute; top:-4px; right:-4px; width:16px; height:16px; border-radius:999px; background:var(--red); color:#fff; font-size:9px; font-weight:800; display:grid; place-items:center;}
.view{flex:1; overflow-y:auto; padding:32px; max-width:1180px; margin:0 auto; width:100%;}

/* ============================= DASHBOARD ============================= */
.dash-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;}
.dash-head h1{font-size:24px; font-weight:800;}
.dash-head p{font-size:14px; color:var(--slate); margin-top:2px;}

.stat-card{padding:18px;}
.stat-ic{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; margin-bottom:12px;}
.stat-val{font-size:24px; font-weight:800;}
.stat-lbl{font-size:12px; font-weight:600; color:var(--slate);}

.today-ring{width:140px; height:140px; margin:0 auto 16px;}
.legend-row{display:flex; align-items:center; justify-content:space-between; font-size:13.5px; margin-bottom:8px;}
.legend-row .dotwrap{display:flex; align-items:center; gap:8px;}
.dot{width:8px; height:8px; border-radius:999px;}

.class-row{padding:18px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
.class-time{font-size:11.5px; font-weight:700; color:var(--blue); margin-bottom:3px;}
.class-title{font-size:14px; font-weight:700;}
.class-meta{font-size:12px; color:var(--slate); margin-top:3px;}

.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px; text-align:center;}
.empty-ic{width:48px; height:48px; border-radius:16px; background:var(--surface-2); display:grid; place-items:center; margin-bottom:12px;}
.empty-txt{font-size:13.5px; font-weight:600; color:var(--slate); margin-bottom:10px;}

/* ============================= ROLL CALL ============================= */
.rc-meta-bar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; padding:20px; margin-bottom:20px;}
.rc-meta-inner{display:flex; flex-wrap:wrap; gap:26px;}
.rc-meta .l{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--slate); letter-spacing:.03em;}
.rc-meta .v{font-size:14px; font-weight:800;}
.rc-toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:16px;}
.rc-counts{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
.rc-count{border-radius:14px; padding:12px; text-align:center;}
.rc-count .n{font-size:18px; font-weight:800;}
.rc-count .l{font-size:11px; font-weight:600;}

.student-row{display:flex; align-items:center; gap:16px; padding:14px 18px; border-top:1px solid var(--border);}
.student-row:first-child{border-top:none;}
.s-av{width:36px; height:36px; border-radius:999px; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:800; background:linear-gradient(135deg,var(--blue),var(--mint)); flex-shrink:0;}
.s-roll{width:38px; font-size:12px; font-weight:700; color:var(--slate); flex-shrink:0;}
.s-info{flex:1; min-width:0;}
.s-name{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.s-sub{font-size:11.5px; color:var(--slate);}
.status-btns{display:flex; gap:6px; flex-shrink:0;}
.status-btn{width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--surface-2); color:var(--slate); transition:.12s;}
.status-btn:active{transform:scale(.9);}
.status-btn.active{color:#fff;}

.rc-savebar{position:sticky; bottom:16px; margin-top:20px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border-radius:16px; background:var(--surface); border:1px solid var(--border); box-shadow:0 20px 40px -20px rgba(11,30,61,.25);}
.rc-savebar .status-txt{font-size:13.5px; color:var(--slate);}

/* ============================= QUICK ROLL CALL ============================= */
.qr-overlay{position:fixed; inset:0; z-index:500; display:flex; flex-direction:column; background:linear-gradient(160deg,var(--navy),#0F2452);}
.qr-top{display:flex; align-items:center; justify-content:space-between; padding:24px;}
.qr-exit{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; color:rgba(255,255,255,.7); background:none;}
.qr-exit:hover{color:#fff;}
.qr-classname{font-size:13.5px; font-weight:700; color:rgba(255,255,255,.7);}
.qr-body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
.qr-progtxt{color:rgba(255,255,255,.5); font-size:13.5px; font-weight:700; margin-bottom:8px;}
.qr-progbar{width:260px; height:6px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; margin-bottom:40px;}
.qr-progbar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--blue),var(--mint)); transition:width .25s;}
.qr-avatar{width:224px; height:224px; border-radius:999px; display:grid; place-items:center; font-size:48px; font-weight:800; color:#fff; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.15); margin-bottom:24px; position:relative;}
.qr-status-pill{position:absolute; bottom:-8px; border-radius:999px; padding:6px 16px; font-size:13.5px; font-weight:800; color:#fff;}
.qr-name{font-size:26px; font-weight:800; color:#fff; margin-bottom:4px;}
.qr-sub{color:rgba(255,255,255,.5); font-size:13.5px; margin-bottom:40px;}
.qr-btns{display:flex; gap:16px;}
.qr-btn{width:96px; height:96px; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; font-weight:800; color:#fff;}
.qr-btn:active{transform:scale(.95);}
.qr-hint{display:flex; align-items:center; gap:22px; margin-top:40px; color:rgba(255,255,255,.5); font-size:12px;}
.qr-hint button{display:flex; align-items:center; gap:4px; background:none; color:inherit;}
.qr-hint button:hover{color:#fff;}
.qr-bottom{padding:24px; display:flex; justify-content:center;}

/* ============================= TABLES ============================= */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{text-align:left; font-weight:700; color:var(--slate); padding:12px 16px; background:var(--table-head-bg); font-size:12.5px;}
tbody td{padding:12px 16px; border-top:1px solid var(--border); vertical-align:middle;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:#FAFBFE;}
.table-wrap{overflow-x:auto;}

/* ============================= STUDENTS ============================= */
.page-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px;}
.page-head h1{font-size:24px; font-weight:800;}
.page-head p{font-size:14px; color:var(--slate); margin-top:2px;}
.filters-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
.filters-row .search-box{flex:1; min-width:200px;}

.tname{display:flex; align-items:center; gap:11px;}
.tname .n{font-weight:700; font-size:13.5px;}
.tname .s{font-size:11.5px; color:var(--slate);}
.row-actions{display:flex; justify-content:flex-end; gap:4px;}
.icon-btn{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:none;}
.icon-btn:hover{background:var(--surface-2);}

/* ============================= MODAL ============================= */
.modal-overlay{position:fixed; inset:0; z-index:600; background:rgba(11,30,61,.4); display:flex; align-items:center; justify-content:center; padding:16px;}
.modal{width:100%; max-width:420px; max-height:90vh; overflow-y:auto; padding:24px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h3{font-size:17px; font-weight:800;}
.modal-close{background:none;}
.modal-grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.modal-actions{display:flex; gap:10px; padding-top:6px;}
.modal-actions .btn{flex:1;}

/* ============================= PROFILE ============================= */
.back-link{display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--blue); background:none; margin-bottom:18px;}
.profile-head{padding:24px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px;}
.profile-id{display:flex; align-items:center; gap:16px;}
.profile-av{width:64px; height:64px; border-radius:20px; display:grid; place-items:center; color:#fff; font-size:20px; font-weight:800; background:linear-gradient(135deg,var(--blue),var(--mint));}
.profile-name{font-size:19px; font-weight:800;}
.profile-meta{font-size:13.5px; color:var(--slate); margin-top:2px;}
.statbox{padding:16px; text-align:center;}
.statbox .n{font-size:19px; font-weight:800;}
.statbox .l{font-size:11.5px; font-weight:600; color:var(--slate); margin-top:4px;}
.hist-row{display:flex; align-items:center; justify-content:space-between; font-size:13.5px; padding:10px 0; border-top:1px solid var(--border);}
.hist-row:first-child{border-top:none;}

/* ============================= CLASSES ============================= */
.class-card{padding:20px;}
.class-card-top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px;}
.class-card h3{font-size:15px; font-weight:800;}
.class-card .dept{font-size:12px; color:var(--slate); margin-top:2px;}
.class-ic{width:36px; height:36px; border-radius:12px; background:var(--blue-soft); display:grid; place-items:center; flex-shrink:0;}
.class-info{display:flex; align-items:center; gap:16px; font-size:13.5px; margin-bottom:16px;}
.class-info span{display:flex; align-items:center; gap:6px;}
.chart-title{font-size:14px; font-weight:800; margin-bottom:16px;}

/* ============================= SETTINGS ============================= */
.settings-title{font-size:14px; font-weight:800; margin-bottom:16px;}
.theme-row{display:flex; gap:8px;}
.theme-opt{flex:1; padding:11px; border-radius:12px; font-size:13.5px; font-weight:700; text-transform:capitalize; background:var(--surface-2); color:var(--slate); border:1px solid var(--border);}
.theme-opt.active{background:var(--blue-soft); color:var(--blue-deep); border-color:var(--blue);}

/* ============================= MOBILE ============================= */
.hamburger, .mobile-drawer, .drawer-overlay, .landing-hamburger{display:none;}
@media (max-width: 880px){
  .container{padding:0 16px;}
  .nav-landing .container{height:60px;}
  /* The marketing links (Features / How it works / FAQ) had no mobile
     home — they never collapsed into a menu and just overflowed the
     64px nav bar next to the logo and both auth buttons. Hide them on
     small screens so the nav stays a clean logo + 2 buttons row. */
  .nav-links{display:none;}
  .hero{grid-template-columns:1fr; text-align:center; padding:44px 0 56px;}
  .hero p{margin-left:auto; margin-right:auto;}
  .hero-cta{justify-content:center; flex-wrap:wrap;}
  .hero-trust{justify-content:center; flex-wrap:wrap; gap:14px 20px;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3, .grid-2{grid-template-columns:1fr;}
  .security-card{grid-template-columns:1fr;}
  .auth-side{display:none;}
  .sidebar{display:none;}
  .hamburger{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background:none; color:var(--navy); flex-shrink:0;}
  .hamburger svg{width:20px; height:20px;}
  .search-box{display:none;}
  .topbar{padding:0 16px;}
  .view{padding:18px;}
  .mobile-drawer{
    display:flex; position:fixed; top:0; left:0; bottom:0; width:250px; background:var(--surface); z-index:700;
    flex-direction:column; padding:16px; transform:translateX(-100%); transition:.2s;
  }
  .mobile-drawer.open{transform:translateX(0);}
  .drawer-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:650;}
  .drawer-overlay.open{display:block;}
  .modal-grid2{grid-template-columns:1fr;}
}

/* Extra-small phones: the 880px breakpoint alone still left oversized
   hero type and cramped nav/CTA buttons on ~360-400px wide screens. */
@media (max-width: 480px){
  .container{padding:0 14px;}
  .hero h1{font-size:34px;}
  .hero p{font-size:15.5px;}
  .section-title{font-size:24px;}
  .section{padding:44px 0;}
  .grid-4{grid-template-columns:1fr 1fr; gap:12px;}
  .nav-landing .container > div:last-child{gap:6px;}
  .nav-landing .btn{padding:8px 10px; font-size:13px;}
  .nav-landing .btn-primary{padding:8px 14px;}
  .hero-cta .btn{width:100%;}
  .hero-cta{flex-direction:column;}
}

function getOrganizationId(){
  return state.user?.organizationId || `ORG_${window.attendoFirebase.auth.currentUser?.uid}`;
}


/* --------------------------------------------------------------------------
   LOAD DATA FROM FIRESTORE
--------------------------------------------------------------------------- */

async function loadData(){

  try{

    const fb = window.attendoFirebase;

    const user = fb.auth.currentUser;

    if(!user){
      console.warn("No Firebase user logged in.");
      return null;
    }

    const organizationId = getOrganizationId();

    const orgRef = fb.doc(
      fb.db,
      'organizations',
      organizationId
    );

    const orgSnap = await fb.getDoc(orgRef);

    if(!orgSnap.exists()){

      console.warn("Organization document does not exist.");

      return {
        org:{
          name:"My Organization",
          type:"School"
        },
        students:[],
        classes:[],
        attendance:{}
      };
    }

    const org = orgSnap.data();


    /* ================================================================
       STUDENTS
    ================================================================= */

    const studentsSnap = await fb.getDocs(
      fb.collection(
        fb.db,
        'organizations',
        organizationId,
        'students'
      )
    );

    const students = [];

    studentsSnap.forEach(docSnap => {

      students.push({
        id: docSnap.id,
        ...docSnap.data()
      });

    });


    /* ================================================================
       CLASSES
    ================================================================= */

    const classesSnap = await fb.getDocs(
      fb.collection(
        fb.db,
        'organizations',
        organizationId,
        'classes'
      )
    );

    const classes = [];

/* --------------------------------------------------------------------------
   SAVE DATA TO FIRESTORE
--------------------------------------------------------------------------- */

/*
 * persist() used to re-download the ENTIRE students/classes/attendance
 * collections (3 full reads) and then write every single record back
 * one-at-a-time with a sequential `await` per document — even when only
 * one attendance record actually changed. On any real amount of data
 * that meant dozens/hundreds of round-trips for a single save, which is
 * what caused the lag when marking attendance or creating an account.
 *
 * Fixed version:
 *  - Diffs against the in-memory `state._firestoreCache` (already kept
 *    up to date by loadData/persist) instead of re-fetching from
 *    Firestore, so there are ZERO extra reads on save.
 *  - Only writes/deletes documents that actually changed.
 *  - Queues every write/delete into a single Firestore writeBatch, so
 *    the whole save is ONE network round-trip (chunked automatically if
 *    an org ever has 400+ changed records at once, well beyond normal use).
 */
function _recEqual(a, b){
  return JSON.stringify(a) === JSON.stringify(b);
}

async function _commitInChunks(fb, ops){
  // Firestore batches max out at 500 operations; chunk defensively.
  const CHUNK = 400;
  for(let i = 0; i < ops.length; i += CHUNK){
    const batch = fb.writeBatch(fb.db);
    ops.slice(i, i + CHUNK).forEach(op => op(batch));
    await batch.commit();
  }
}

async function persist(data){

  try{

    const fb = window.attendoFirebase;

    const user = fb.auth.currentUser;

    if(!user){

      console.warn(
        "Cannot save Firestore data: no authenticated user."
      );

      return;
    }

    const organizationId = getOrganizationId();
    const prev = state._firestoreCache || { students:[], classes:[], attendance:{}, org:{} };

    const ops = [];

    /* ================================================================
       ORGANIZATION (only write if it actually changed)
    ================================================================= */

    const newOrg = {
      name: data.org?.name || "My Organization",
      type: data.org?.type || "School",
      ownerId: user.uid
    };

    if(!_recEqual(newOrg, { ...prev.org, ownerId: user.uid })){
      const orgRef = fb.doc(fb.db, 'organizations', organizationId);
      ops.push(batch => batch.set(orgRef, newOrg, { merge:true }));
    }


    /* ================================================================
       STUDENTS
    ================================================================= */

    const studentsCollection = fb.collection(fb.db, 'organizations', organizationId, 'students');
    const prevStudents = new Map((prev.students || []).map(s => [s.id, s]));
    const nextStudents = new Map((data.students || []).map(s => [s.id, s]));

    for(const id of prevStudents.keys()){
      if(!nextStudents.has(id)){
        const ref = fb.doc(studentsCollection, id);
        ops.push(batch => batch.delete(ref));
      }
    }
    for(const [id, student] of nextStudents){
      if(!_recEqual(student, prevStudents.get(id))){
        const { id: _drop, ...studentData } = student;
        const ref = fb.doc(studentsCollection, id);
        ops.push(batch => batch.set(ref, studentData, { merge:true }));
      }
    }


    /* ================================================================
       CLASSES
    ================================================================= */

    const classesCollection = fb.collection(fb.db, 'organizations', organizationId, 'classes');
    const prevClasses = new Map((prev.classes || []).map(c => [c.id, c]));
    const nextClasses = new Map((data.classes || []).map(c => [c.id, c]));

    for(const id of prevClasses.keys()){
      if(!nextClasses.has(id)){
        const ref = fb.doc(classesCollection, id);
        ops.push(batch => batch.delete(ref));
      }
    }
    for(const [id, cls] of nextClasses){
      if(!_recEqual(cls, prevClasses.get(id))){
        const { id: _drop, ...classData } = cls;
        const ref = fb.doc(classesCollection, id);
        ops.push(batch => batch.set(ref, classData, { merge:true }));
      }
    }


    /* ================================================================
       ATTENDANCE
    ================================================================= */

    const attendanceCollection = fb.collection(fb.db, 'organizations', organizationId, 'attendance');
    const prevAttendance = prev.attendance || {};
    const nextAttendance = data.attendance || {};

    for(const id of Object.keys(prevAttendance)){
      if(!(id in nextAttendance)){
        const ref = fb.doc(attendanceCollection, id);
        ops.push(batch => batch.delete(ref));
      }
    }
    for(const [id, record] of Object.entries(nextAttendance)){
      if(!_recEqual(record, prevAttendance[id])){
        const ref = fb.doc(attendanceCollection, id);
        ops.push(batch => batch.set(ref, record, { merge:true }));
      }
    }


    /*
     * Nothing changed at all — skip the network call entirely.
     */

    if(ops.length === 0){
      console.log("Attendo persist(): no changes to save, skipped network call.");
      return;
    }

    await _commitInChunks(fb, ops);


    /*
     * Update local Firestore snapshot.
     */

    state._firestoreCache =
      JSON.parse(JSON.stringify(data));


    console.log(
      `Attendo data saved to Firestore (${ops.length} change${ops.length===1?'':'s'} in 1 batch).`
    );

  }
  catch(error){

    console.error(
      "Firestore save failed:",
      error
    );

    showToast(
      "Could not save data to Firebase."
    );

    throw error;
  }
}

/* ============================================================================
   THEME (Light / Dark / System)
============================================================================ */
const THEME_KEY = 'attendo-theme';
function applyTheme(theme, stage){
  // The marketing landing/auth pages have a fixed light design; dark mode
  // only applies to the authenticated app (dashboard, roll call, etc.).
  const currentStage = stage || state.stage;
  const inApp = currentStage === 'app';
  const isDark = inApp && (theme==='dark' || (theme==='system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
  document.documentElement.classList.toggle('dark', isDark);
}
function setTheme(theme){
  state._theme = theme;
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
  applyTheme(theme);
}
function initTheme(){
  let saved = 'light';
  try{ saved = localStorage.getItem(THEME_KEY) || 'light'; }catch(e){}
  state._theme = saved;
  applyTheme(saved);
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
      if(state._theme==='system') applyTheme('system');
    });
  }
}
initTheme();

function attendancePct(data, studentId){
  let present=0, total=0;
  Object.values(data.attendance).forEach(rec=>{ if(rec.records[studentId]){ total++; if(rec.records[studentId]==='Present') present++; } });
  return total ? Math.round(present/total*100) : 100;
}

/* ============================================================================
   BOOT
============================================================================ */

function boot(){

  const fb = window.attendoFirebase;

  if(!fb){
    console.error("Firebase is not initialized.");
    return;
  }

  fb.onAuthStateChanged(
    fb.auth,
    async (user) => {

      /*
       * ---------------------------------------------------------
       * Signup/login is currently handling the session.
       * Don't let the auth listener interfere with it.
       * ---------------------------------------------------------
       */
      if(state.authBusy){
        return;
      }


      /*
       * ---------------------------------------------------------
       * USER LOGGED OUT
       * ---------------------------------------------------------
       */
      if(!user){

        state.user = null;
        state.data = null;
        state.stage = 'landing';
        state.view = 'dashboard';

        render();

        return;
      }


      /*
       * ---------------------------------------------------------
       * USER LOGGED IN
       * ---------------------------------------------------------
       */

      try{

        const organizationId = `ORG_${user.uid}`;

        const userRef = fb.doc(
          fb.db,
          'organizations',
          organizationId,
          'users',
          user.uid
        );

        const userSnap = await fb.getDoc(userRef);


        /*
         * If there is no profile, DO NOT sign the user out.
         *
         * This can happen during a brand-new signup while
         * Firestore is still being initialized.
         */

        if(!userSnap.exists()){

          console.warn(
            "Attendo profile not found yet."
          );

          return;
        }


        const profile = userSnap.data();


        state.user = {
          uid: user.uid,
          name: profile.name || user.email || 'User',
          role: profile.role || 'Administrator',
          email: user.email || '',
          organizationId:
            profile.organizationId || organizationId
        };


        /*
         * Load Firestore application data.
         */

        const data = await loadData();


        state.data = data || {

          org:{
            name: 'My Organization',
            type: 'School'
          },

          students:[],
          classes:[],
          attendance:{}

        };


        state.stage = 'app';
        state.view = 'dashboard';

        render();


        console.log(
          'Attendo session restored:',
          state.user
        );

      }
      catch(error){

        console.error(
          'Failed to restore Firebase session:',
          error
        );

        showToast(
          'Unable to load your Attendo account.'
        );

      }

    }
  );
}

  if(!form) return;

  form.onsubmit = async (e) => {

    e.preventDefault();
    const fb = window.attendoFirebase;

    const fd = new FormData(form);

    const email = String(fd.get('email') || '').trim();
    const password = String(fd.get('password') || '').trim();

    const name = String(fd.get('name') || '').trim();
    const orgName = String(fd.get('org') || '').trim();
    const orgType = String(fd.get('orgType') || 'School').trim();

    if(!email || !password){
      showToast('Please enter your email and password.');
      return;
    }

    try {

      /* =========================================================
         SIGN UP
         ========================================================= */

      if(state.authMode === 'signup'){

  state.authBusy = true;

  if(!name){
    state.authBusy = false;
    showToast('Please enter your full name.');
    return;
  }

  if(!orgName){
    state.authBusy = false;
    showToast('Please enter your organization name.');
    return;
  }

  const credential =
    await window.attendoFirebase.createUserWithEmailAndPassword(
      window.attendoFirebase.auth,
      email,
      password
    );

  const user = credential.user;

  const organizationId = `ORG_${user.uid}`;

  await window.attendoFirebase.setDoc(
    window.attendoFirebase.doc(
      window.attendoFirebase.db,
      'organizations',
      organizationId
    ),
    {
      name: orgName,
      type: orgType,
      ownerId: user.uid,
      createdAt: new Date().toISOString()
    }
  );

  await window.attendoFirebase.setDoc(
    window.attendoFirebase.doc(
      window.attendoFirebase.db,
      'organizations',
      organizationId,
      'users',
      user.uid
    ),
    {
      name: name,
      email: email,
      role: 'Administrator',
      organizationId: organizationId,
      createdAt: new Date().toISOString()
    }
  );


  /*
   * Everything Firebase needs now exists.
   */

  state.user = {
    uid: user.uid,
    name: name,
    role: 'Administrator',
    email: email,
    organizationId: organizationId
  };

  state.data = {
    org:{
      name: orgName,
      type: orgType
    },
    students:[],
    classes:[],
    attendance:{}
  };

  state.stage = 'app';
  state.view = 'dashboard';

  /*
   * We are finished with the auth operation.
   */
  state.authBusy = false;

  render();

  showToast(
    'Organization created — welcome to Attendo!'
  );

  return;
}

      /* =========================================================
         LOGIN
         ========================================================= */

      else {

        const credential =
          await window.attendoFirebase.signInWithEmailAndPassword(
            window.attendoFirebase.auth,
            email,
            password
          );

        const user = credential.user;

        /*
         * For now we find the organization using the same
         * organization ID convention created during signup.
         */

        const organizationId = `ORG_${user.uid}`;

        const userRef = fb.doc(
          fb.db,
          'organizations',
          organizationId,
          'users',
          user.uid
        );

        const userSnap = await fb.getDoc(userRef);

        if(!userSnap.exists()) {

          console.warn(
            "Firebase Authentication account exists, but Attendo profile was not found."
          );

          /*
          * If this account was created before our Firebase
          * integration was completed, create its Attendo profile.
          */

          const profile = {
            name: user.displayName || user.email?.split('@')[0] || 'Administrator',
            email: user.email || '',
            role: 'Administrator',
            organizationId: organizationId,
            createdAt: new Date().toISOString()
          };

          await fb.setDoc(userRef, profile);

          /*
          * Also make sure the organization exists.
          */

          await fb.setDoc(
            fb.doc(
              fb.db,
              'organizations',
              organizationId
            ),
            {
              name: 'My Organization',
              type: 'School',
              ownerId: user.uid,
              createdAt: new Date().toISOString()
            },
            {
              merge: true
            }
          );

          state.user = {
            uid: user.uid,
            name: profile.name,
            role: profile.role,
            email: profile.email,
            organizationId: organizationId
          };

        } else {

          const profile = userSnap.data();

          state.user = {
            uid: user.uid,
            name: profile.name || user.email,
            role: profile.role || 'Administrator',
            email: user.email,
            organizationId:
              profile.organizationId || organizationId
          };
        }

        const profile = userSnap.data();

        state.user = {
          uid: user.uid,
          name: profile.name,
          role: profile.role,
          email: user.email,
          organizationId: profile.organizationId
        };

        state.data = await loadData();

        if(!state.data){

          state.data = {
            org:{
              name:"My Organization",
              type:"School"
            },
            students:[],
            classes:[],
            attendance:{}
          };

        }

        pushNav();

        state.stage = 'app';
        state.view = 'dashboard';

        render();

        showToast('Welcome back!');

      }

    }
    
    catch(error){
      state.authBusy = false;
      console.error('Firebase authentication error:', error);

      let message = 'Something went wrong. Please try again.';

      switch(error.code){

        case 'auth/email-already-in-use':
          message = 'An account with this email already exists.';
          break;

        case 'auth/invalid-email':
          message = 'Please enter a valid email address.';
          break;

        case 'auth/weak-password':
          message = 'Password should be at least 6 characters.';
          break;

        case 'auth/invalid-credential':
        case 'auth/wrong-password':
        case 'auth/user-not-found':
          message = 'Invalid email or password.';
          break;

        case 'auth/too-many-requests':
          message = 'Too many attempts. Please try again later.';
          break;

        case 'auth/network-request-failed':
          message = 'Network error. Please check your internet connection.';
          break;

        case 'permission-denied':
          message = 'Firebase permission denied. We need to configure Firestore rules.';
          break;
      }

      showToast(message);
    }
  };
}

function attachGlobalSearch(){
  const input = document.getElementById('global-search');
  const results = document.getElementById('global-search-results');
  if(!input || !results) return;

  const closeResults = ()=>{ results.classList.remove('open'); results.innerHTML=''; };

  const runSearch = (raw)=>{
    const q = raw.trim().toLowerCase();
    if(!q){ closeResults(); return; }
    const data = state.data;
    const students = (data.students||[]).filter(s =>
      s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q) || String(s.roll).includes(q)
    ).slice(0,5);
    const classes = (data.classes||[]).filter(c =>
      `${c.subject} ${c.name} ${c.section} ${c.teacher}`.toLowerCase().includes(q)
    ).slice(0,5);

    if(students.length===0 && classes.length===0){
      results.innerHTML = `<div class="gsr-empty">No matches for "${raw.trim()}"</div>`;
      results.classList.add('open');
      return;
    }

    let html = '';
    if(students.length){
      html += `<div class="gsr-sec-label">Students</div>`;
      html += students.map(s=>`<div class="gsr-item" data-type="student" data-id="${s.id}">
        <div class="s-av" style="width:28px;height:28px;font-size:10px;">${initials(s.name)}</div>
        <div><div class="gsr-name">${s.name}</div><div class="gsr-sub">Roll #${s.roll} · ${classNameOf(s.classId)}${s.section}</div></div>
      </div>`).join('');
    }
    if(classes.length){
      html += `<div class="gsr-sec-label">Classes</div>`;
      html += classes.map(c=>`<div class="gsr-item" data-type="class" data-id="${c.id}">
        <div class="gsr-ic">${ic('school').replace('<svg','<svg style="width:14px;height:14px;color:var(--blue-deep)"')}</div>
        <div><div class="gsr-name">${c.subject} — ${c.name}${c.section}</div><div class="gsr-sub">${c.teacher}${c.time?' · '+c.time:''}</div></div>
      </div>`).join('');
    }
    results.innerHTML = html;
    results.classList.add('open');

    results.querySelectorAll('[data-type="student"]').forEach(el=>el.onclick=()=>{
      pushNav();
      state.view = 'students';
      state._studentProfile = el.getAttribute('data-id');
      closeResults(); input.value='';
      render();
    });
    results.querySelectorAll('[data-type="class"]').forEach(el=>el.onclick=()=>{
      pushNav();
      state.view = 'classes';
      closeResults(); input.value='';
      render();
    });
  };

  input.oninput = (e)=> runSearch(e.target.value);
  input.onfocus = (e)=>{ if(e.target.value) runSearch(e.target.value); };
  input.onkeydown = (e)=>{ if(e.key==='Escape'){ input.value=''; closeResults(); input.blur(); } };
}

function renderDashboard(root){
  const data = state.data, today = todayStr(), wd = todayWeekday();
  const allClasses = data.classes || [];
  const todaysClasses = allClasses.filter(c => (c.days||[]).includes(wd));
  let present=0,absent=0,late=0,marked=0;
  allClasses.forEach(c=>{ const rec=data.attendance[`${today}|${c.id}`]; if(rec) Object.values(rec.records).forEach(s=>{ marked++; if(s==='Present')present++; if(s==='Absent')absent++; if(s==='Late')late++; }); });
  const pct = marked ? Math.round(present/marked*100) : 0;

  const weekLabels=[], weekVals=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i); const iso=d.toISOString().slice(0,10);
    let p=0,tot=0; allClasses.forEach(c=>{ const rec=data.attendance[`${iso}|${c.id}`]; if(rec) Object.values(rec.records).forEach(s=>{tot++; if(s==='Present')p++;}); });
    if(tot){ weekLabels.push(d.toLocaleDateString('en-US',{weekday:'short'})); weekVals.push(Math.round(p/tot*100)); }
  }

    {label:'Total Students', value:data.students.length, icon:'users', color:'#2B6CF6', bg:'var(--blue-soft)'},

            <circle cx="18" cy="18" r="15.5" fill="none" stroke="${T.mint}" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${pct} 100" transform="rotate(-90 18 18)"/>

        <div class="legend-row"><div class="dotwrap"><span class="dot" style="background:${T.red}"></span>Absent</div><b>${absent}</b></div>
        <div class="legend-row"><div class="dotwrap"><span class="dot" style="background:${T.amber}"></span>Late</div><b>${late}</b></div>

            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>
  `;
  document.querySelectorAll('[data-action="nav"]').forEach(b=>b.onclick=()=>{ pushNav(); state.view=b.getAttribute('data-view'); render(); });
  document.querySelectorAll('[data-action="goto-rollcall"]').forEach(b=>b.onclick=()=>{ pushNav(); state.activeClass=b.getAttribute('data-class'); state.view='rollcall'; render(); });

  if(weekVals.length){
    const ctx = document.getElementById('week-chart');
    if(state.charts.week) state.charts.week.destroy();
    state.charts.week = new Chart(ctx, { type:'line', data:{ labels:weekLabels, datasets:[{ data:weekVals, borderColor:T.blue, backgroundColor:T.blue, tension:.35, pointRadius:4, borderWidth:2.5 }] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{min:50,max:100, grid:{color:'#EEF2F8'}}, x:{grid:{display:false}} } } });
  }
}

  const existing = (data.attendance[key] && data.attendance[key].records) || {};

  const statusMap = state.rcStatus;

  const search = state._rcSearch || '', filter = state._rcFilter || 'All';
  const filtered = roster.filter(s=>{
    if(search && !s.name.toLowerCase().includes(search.toLowerCase()) && !String(s.roll).includes(search)) return false;
    if(filter!=='All' && statusMap[s.id]!==filter) return false;
    return true;
  });
  const counts = STATUSES.reduce((a,st)=>{ a[st]=roster.filter(s=>statusMap[s.id]===st).length; return a; },{});
  const markedCount = Object.keys(statusMap).length;
  const saved = !!data.attendance[key] && !state.rcDirty;

  root.innerHTML = `
    <div class="card rc-meta-bar">
      <div class="rc-meta-inner">
        <div class="rc-meta"><div class="l">Class</div><div class="v">${cls.name} ${cls.section}</div></div>
        <div class="rc-meta"><div class="l">Subject</div><div class="v">${cls.subject}</div></div>
        <div class="rc-meta"><div class="l">Teacher</div><div class="v">${cls.teacher}</div></div>
        <div class="rc-meta"><div class="l">Date</div><div class="v">${prettyDate(date)}</div></div>
        <div class="rc-meta"><div class="l">Time</div><div class="v">${cls.time}</div></div>
      </div>
      <select id="rc-class-select" class="input" style="width:auto;font-weight:600;">
        ${classes.map(c=>`<option value="${c.id}" ${c.id===cls.id?'selected':''}>${c.subject} — ${c.name}${c.section}</option>`).join('')}
      </select>
    </div>

============================================================================ */
function renderQuickRoll(){
  const data = state.data;
  const classes = data.classes || [];
  if(classes.length===0) return `<div class="qr-overlay"><div class="qr-body"><div style="color:#fff">No timetable set up yet.</div></div></div>`;
  const cls = classes.find(c=>c.id===state.activeClass) || classes[0];
  const roster = data.students.filter(s=>s.classId===cls.id).sort((a,b)=>a.roll-b.roll);
  const date = todayStr(), key = `${date}|${cls.id}`;
  if(state._qrKey!==key){ state.quickStatus = {...((data.attendance[key]||{}).records||{})}; state.quickIdx=0; state._qrKey=key; }
  const idx = Math.min(state.quickIdx, roster.length-1);
  const current = roster[idx];
  if(!current) return `<div class="qr-overlay"><div class="qr-body"><div style="color:#fff">No students in this class.</div></div></div>`;
  const status = state.quickStatus[current.id];

  return `<div class="qr-overlay">
    <div class="qr-top">
      <button class="qr-exit" data-action="qr-exit">${ic('arrowLeft')} Exit Quick Mode</button>
      <div class="qr-classname">${cls.subject} — ${cls.name}${cls.section}</div>
    </div>
    <div class="qr-body">
      <div class="qr-progtxt">Student ${idx+1} / ${roster.length}</div>
      <div class="qr-progbar"><div class="qr-progbar-fill" style="width:${(idx+1)/roster.length*100}%"></div></div>
      <div class="qr-avatar">
        ${initials(current.name)}
        ${status?`<div class="qr-status-pill" style="background:${STATUS_META[status].color}">${status}</div>`:''}
      </div>
      <div class="qr-name">${current.name}</div>
      <div class="qr-sub">Roll #${current.roll} · ${cls.name}${cls.section}</div>
      <div class="qr-btns">
        ${['Present','Absent','Late'].map(s=>`<button class="qr-btn" style="background:${STATUS_META[s].color};box-shadow:0 10px 30px -10px ${STATUS_META[s].color}" data-action="qr-mark" data-status="${s}">${ic(STATUS_META[s].icon).replace('<svg','<svg style="width:24px;height:24px"')}<span style="font-size:12px;">${s} (${s[0]})</span></button>`).join('')}
      </div>
      <div class="qr-hint">
        <button data-action="qr-prev">${ic('chevLeft')} Prev (←)</button>
        <span>Space = confirm</span>
        <button data-action="qr-next">Next (→) ${ic('chevRight')}</button>
      </div>
    </div>
    <div class="qr-bottom"><button class="btn btn-mint btn-lg" data-action="qr-finish">${ic('save')} Finish & Save Attendance</button></div>
  </div>`;
}
function attachQuickRollEvents(){
  const data = state.data;
  const classes = data.classes || [];
  if(classes.length===0) return;
  const cls = classes.find(c=>c.id===state.activeClass) || classes[0];
  const roster = data.students.filter(s=>s.classId===cls.id).sort((a,b)=>a.roll-b.roll);
  const mark = (status)=>{
    const idx = Math.min(state.quickIdx, roster.length-1); const cur = roster[idx];
    if(!cur) return;
    state.quickStatus[cur.id] = status;
    state.quickIdx = Math.min(idx+1, roster.length-1);
    render();
  };
  document.querySelectorAll('[data-action="qr-mark"]').forEach(b=>b.onclick=()=>mark(b.getAttribute('data-status')));
  const prevBtn = document.querySelector('[data-action="qr-prev"]'); if(prevBtn) prevBtn.onclick=()=>{ state.quickIdx=Math.max(state.quickIdx-1,0); render(); };
  const nextBtn = document.querySelector('[data-action="qr-next"]'); if(nextBtn) nextBtn.onclick=()=>{ state.quickIdx=Math.min(state.quickIdx+1,roster.length-1); render(); };
  const exitBtn = document.querySelector('[data-action="qr-exit"]'); if(exitBtn) exitBtn.onclick=()=>{ state.view='rollcall'; render(); };
  const finishBtn = document.querySelector('[data-action="qr-finish"]');
  if(finishBtn) finishBtn.onclick = async ()=>{
    const key = state._qrKey;
    data.attendance[key] = { classId:cls.id, date:todayStr(), subject:cls.subject, teacher:cls.teacher, records:{...state.quickStatus} };
    await persist(data);
    const counts = STATUSES.reduce((a,s)=>{ a[s]=roster.filter(r=>state.quickStatus[r.id]===s).length; return a; },{});
    showToast(`Attendance Saved — ${counts.Present} Present, ${counts.Absent} Absent, ${counts.Late} Late`);
    state.view='dashboard'; render();
  };
  document.onkeydown = (e)=>{
    if(state.view!=='quickroll') return;
    const k = e.key.toLowerCase();
    if(k==='p') mark('Present');
    else if(k==='a') mark('Absent');
    else if(k==='l') mark('Late');
    else if(e.key==='ArrowRight'){ state.quickIdx=Math.min(state.quickIdx+1,roster.length-1); render(); }
    else if(e.key==='ArrowLeft'){ state.quickIdx=Math.max(state.quickIdx-1,0); render(); }
    else if(e.key==='Escape'){ state.view='rollcall'; render(); }
  };
}

function openStudentModal(studentId, presetClassId){
  const data = state.data;
  const classes = data.classes || [];
  if(classes.length===0){ showToast('Add a class to your timetable first'); state.view='classes'; render(); return; }
  const student = studentId ? data.students.find(s=>s.id===studentId) : null;
  const defaultClassId = student ? student.classId : (presetClassId && classes.some(c=>c.id===presetClassId) ? presetClassId : classes[0].id);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="card modal">
    <div class="modal-head"><h3>${student?'Edit Student':'Add Student'}</h3><button class="modal-close" id="modal-close">${ic('x')}</button></div>
    <form id="student-form">
      <div class="field"><label>Full Name</label><input required name="name" class="input" value="${student?student.name:''}"/></div>
      <div class="modal-grid2">
        <div class="field"><label>Roll Number</label><input required type="number" name="roll" class="input" value="${student?student.roll:''}"/></div>
        <div class="field"><label>Class</label><select name="classId" class="input" style="width:100%;">${classes.map(c=>`<option value="${c.id}" ${defaultClassId===c.id?'selected':''}>${c.name}${c.section}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Email</label><input required type="email" name="email" class="input" value="${student?student.email:''}"/></div>
      <div class="field"><label>Phone</label><input name="phone" class="input" value="${student?student.phone||'':''}"/></div>
      <div class="field"><label>Parent / Guardian</label><input name="guardian" class="input" value="${student?student.guardian||'':''}"/></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Student</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#modal-close').onclick = close;
  overlay.querySelector('#modal-cancel').onclick = close;
  overlay.querySelector('#student-form').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const cls = classes.find(c=>c.id===fd.get('classId'));
    const payload = { name:fd.get('name'), roll:Number(fd.get('roll')), classId:fd.get('classId'), section:cls.section, email:fd.get('email'), phone:fd.get('phone'), guardian:fd.get('guardian'), status:'Active', enrolled: student?student.enrolled:todayStr() };
    if(student){
      Object.assign(student, payload);
      showToast('Student updated');
    } else {
      const id = `S${2000+Math.floor(Math.random()*9000)}`;
      data.students.push({ id, ...payload });
      showToast('New student added');
    }
    await persist(data); close(); renderView();
  };
}
async function deleteStudent(sid){
  if(!confirm('Delete this student? This cannot be undone.')) return;
  const data = state.data;
  data.students = data.students.filter(s=>s.id!==sid);
  await persist(data);
  showToast('Student deleted');
  renderView();
}

  `;
  document.querySelectorAll('[data-action="class-take"]').forEach(b=>b.onclick=()=>{ pushNav(); state.activeClass=b.getAttribute('data-class'); state.view='rollcall'; render(); });
  document.querySelectorAll('[data-action="class-edit"]').forEach(b=>b.onclick=()=> openClassModal(b.getAttribute('data-class')));
  document.querySelectorAll('[data-action="class-delete"]').forEach(b=>b.onclick=()=> deleteClass(b.getAttribute('data-class')));
  const addBtn = document.getElementById('class-add'); if(addBtn) addBtn.onclick = ()=> openClassModal(null);
  const addBtnEmpty = document.getElementById('class-add-empty'); if(addBtnEmpty) addBtnEmpty.onclick = ()=> openClassModal(null);
}

function openClassModal(classId){
  const data = state.data;
  if(!data.classes) data.classes = [];
  const cls = classId ? data.classes.find(c=>c.id===classId) : null;
  const selectedDays = new Set(cls ? (cls.days||[]) : ["Mon","Tue","Wed","Thu","Fri"]);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="card modal">
    <div class="modal-head"><h3>${cls?'Edit Class':'Add Class'}</h3><button class="modal-close" id="modal-close">${ic('x')}</button></div>
    <form id="class-form">
      <div class="modal-grid2">
        <div class="field"><label>Class Name</label><input required name="name" class="input" placeholder="Class 12" value="${cls?cls.name:''}"/></div>
        <div class="field"><label>Section</label><input required name="section" class="input" placeholder="A" value="${cls?cls.section:''}"/></div>
      </div>
      <div class="field"><label>Subject</label><input required name="subject" class="input" placeholder="Physics" value="${cls?cls.subject:''}"/></div>
      <div class="modal-grid2">
        <div class="field"><label>Teacher</label><input required name="teacher" class="input" placeholder="Mr. Kumar" value="${cls?cls.teacher:''}"/></div>
        <div class="field"><label>Room</label><input name="room" class="input" placeholder="Room 204" value="${cls?cls.room||'':''}"/></div>
      </div>
      <div class="modal-grid2">
        <div class="field"><label>Department</label><input name="department" class="input" placeholder="Science" value="${cls?cls.department||'':''}"/></div>
        <div class="field"><label>Time</label><input required name="time" type="time" class="input" value="${cls&&cls.time24?cls.time24:''}"/></div>
      </div>
      <div class="field">
        <label>Days</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${WEEKDAYS.map(w=>`<label style="display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:10px;background:#F4F7FC;font-size:12.5px;font-weight:600;cursor:pointer;">
            <input type="checkbox" name="days" value="${w}" ${selectedDays.has(w)?'checked':''}/> ${w}
          </label>`).join('')}
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">${cls?'Save Changes':'Add Class'}</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#modal-close').onclick = close;
  overlay.querySelector('#modal-cancel').onclick = close;
  overlay.querySelector('#class-form').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const days = fd.getAll('days');
    if(days.length===0){ showToast('Select at least one day'); return; }
    const time24 = fd.get('time');
    const timeLabel = time24 ? formatTime12(time24) : '';
    const payload = { name:fd.get('name'), section:fd.get('section'), subject:fd.get('subject'), teacher:fd.get('teacher'), room:fd.get('room'), department:fd.get('department'), time:timeLabel, time24, days };
    if(cls){
      Object.assign(cls, payload);
      showToast('Class updated');
    } else {
      const id = `CL${Date.now().toString(36)}${Math.floor(Math.random()*900+100)}`;
      data.classes.push({ id, ...payload });
      showToast('Class added to timetable');
    }
    await persist(data); close(); renderView();
  };
}
function formatTime12(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const period = h>=12?'PM':'AM';
  const h12 = h%12===0?12:h%12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
async function deleteClass(classId){
  if(!confirm('Delete this class? Its attendance history will remain but the class will no longer appear in your timetable.')) return;
  const data = state.data;
  data.classes = (data.classes||[]).filter(c=>c.id!==classId);
  await persist(data);
  showToast('Class removed from timetable');
  renderView();
}

/* ============================================================================
   HISTORY
============================================================================ */
function renderHistory(root){
  const data = state.data;
  const classFilter = state._histClass || 'All', statusFilter = state._histStatus || 'All';
  const rows = [];
  Object.values(data.attendance).forEach(rec=>{
    if(classFilter!=='All' && rec.classId!==classFilter) return;
    const clsObj = (data.classes||[]).find(c=>c.id===rec.classId);
    const clsLabel = clsObj ? `${clsObj.name}${clsObj.section||''}` : (rec.classId||'—');
    Object.entries(rec.records).forEach(([sid,status])=>{
      if(statusFilter!=='All' && status!==statusFilter) return;
      const student = data.students.find(s=>s.id===sid); if(!student) return;
      rows.push({date:rec.date, student:student.name, cls:clsLabel, subject:rec.subject, status});
    });
  });
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  const shown = rows.slice(0,200);

  root.innerHTML = `
    <div class="page-head"><h1>Attendance History</h1><button class="btn btn-outline" id="hist-export">${ic('download')} Export CSV</button></div>
    <div class="filters-row">
      <select id="hist-class" class="input"><option value="All" ${classFilter==='All'?'selected':''}>All Classes</option>${(data.classes||[]).map(c=>`<option value="${c.id}" ${classFilter===c.id?'selected':''}>${c.name}${c.section}</option>`).join('')}</select>
      <select id="hist-status" class="input"><option value="All" ${statusFilter==='All'?'selected':''}>All Statuses</option>${STATUSES.map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select>
    </div>
    <div class="card table-wrap" style="max-height:520px;overflow-y:auto;">
      <table>
        <thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Subject</th><th>Status</th></tr></thead>
        <tbody>
          ${shown.length===0?`<tr><td colspan="5"><div class="empty"><div class="empty-txt">No attendance recorded yet.</div></div></td></tr>`:
          shown.map(r=>`<tr><td>${prettyDate(r.date)}</td><td style="font-weight:600;">${r.student}</td><td style="color:var(--slate)">${r.cls}</td><td style="color:var(--slate)">${r.subject}</td><td><span class="badge" style="background:${STATUS_META[r.status].bg};color:${STATUS_META[r.status].color}">${ic(STATUS_META[r.status].icon).replace('<svg','<svg style="width:12px;height:12px"')} ${r.status}</span></td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('hist-class').onchange = (e)=>{ state._histClass=e.target.value; renderHistory(root); };
  document.getElementById('hist-status').onchange = (e)=>{ state._histStatus=e.target.value; renderHistory(root); };
  document.getElementById('hist-export').onclick = ()=>{
    const r=[["Date","Student","Class","Subject","Status"], ...rows.map(x=>[`'${prettyDate(x.date)}`,x.student,x.cls,x.subject,x.status])];
    const csv = r.map(row=>row.map(v=>`"${v}"`).join(",")).join(String.fromCharCode(13)+String.fromCharCode(10));
    const blob = new Blob(['\uFEFF'+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='attendance-history.csv'; a.click();
  };
}

/* ============================================================================
   SETTINGS
============================================================================ */
function renderSettings(root){
  const data = state.data;
  const theme = state._theme || 'light';
  root.innerHTML = `
    <h1 style="font-size:24px;font-weight:800;margin-bottom:22px;max-width:600px;">Settings</h1>
    <div style="max-width:600px;">
      <div class="card" style="padding:22px;margin-bottom:18px;">
        <div class="settings-title">Organization</div>
        <div class="field"><label>Organization Name</label><input id="set-org-name" class="input" value="${data.org.name}"/></div>
        <div class="field"><label>Organization Type</label><select id="set-org-type" class="input" style="width:100%;">${["School","College","University","Coaching Institute","Tuition Center","Training Institute","Company","Other"].map(t=>`<option ${data.org.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
      </div>
      <div class="card" style="padding:22px;margin-bottom:18px;">
        <div class="settings-title">Attendance Rules</div>
        <div class="modal-grid2">
          <div class="field"><label id="late-label">Late Threshold (10 min after start)</label><input type="range" min="0" max="30" value="10" id="late-range" style="width:100%;accent-color:var(--blue);"/></div>
          <div class="field"><label id="min-label">Minimum Attendance % (75%)</label><input type="range" min="50" max="100" value="75" id="min-range" style="width:100%;accent-color:var(--blue);"/></div>
        </div>
      </div>
      <div class="card" style="padding:22px;margin-bottom:22px;">
        <div class="settings-title">Appearance</div>
        <div class="theme-row">
          ${['light','dark','system'].map(t=>`<button class="theme-opt ${theme===t?'active':''}" data-action="set-theme" data-theme="${t}">${t}</button>`).join('')}
        </div>
        <div style="font-size:12px;color:var(--slate);margin-top:8px;">Default theme is White + Blue + Mint.</div>
      </div>
      <button class="btn btn-primary" id="save-settings">${ic('save')} Save Settings</button>
    </div>
  `;
  document.getElementById('late-range').oninput = (e)=>{ document.getElementById('late-label').textContent = `Late Threshold (${e.target.value} min after start)`; };
  document.getElementById('min-range').oninput = (e)=>{ document.getElementById('min-label').textContent = `Minimum Attendance % (${e.target.value}%)`; };
  document.querySelectorAll('[data-action="set-theme"]').forEach(b=>b.onclick=()=>{ setTheme(b.getAttribute('data-theme')); renderSettings(root); });
  document.getElementById('save-settings').onclick = async ()=>{
    data.org.name = document.getElementById('set-org-name').value;
    data.org.type = document.getElementById('set-org-type').value;
    await persist(data); showToast('Settings saved');
  };
}

/* ============================================================================
   LANDING/AUTH SHARED HANDLERS + KICKOFF
============================================================================ */
document.addEventListener('click', (e)=>{
  const go = e.target.closest('[data-action="go-signup"]'); if(go){ pushNav(); state.authMode='signup'; state.stage='auth'; render(); return; }
  const goL = e.target.closest('[data-action="go-login"]'); if(goL){ pushNav(); state.authMode='login'; state.stage='auth'; render(); return; }
  const backB = e.target.closest('[data-action="go-back"]'); if(backB){ goBack(); return; }
  const faq = e.target.closest('[data-action="toggle-faq"]'); if(faq){ const idx=Number(faq.getAttribute('data-idx')); state.faqOpen = state.faqOpen===idx? -1: idx; render(); return; }
  const wrap = document.getElementById('global-search-wrap');
  const results = document.getElementById('global-search-results');
  if(wrap && results && !wrap.contains(e.target)){ results.classList.remove('open'); results.innerHTML=''; }
});

</script>
