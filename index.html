  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="card modal">
    <div class="modal-head"><h3>${cls?'Edit Timetable Period':'Add Timetable Period'} <span style="color:var(--slate);font-weight:600;font-size:13px;">— ${group.name}${group.section}</span></h3><button class="modal-close" id="modal-close">${ic('x')}</button></div>
    <form id="class-form">
      <div class="field"><label>Subject</label><input required name="subject" class="input" placeholder="Physics" value="${cls?cls.subject:''}"/></div>
      <div class="modal-grid2">
        <div class="field"><label>Teacher</label><input required name="teacher" class="input" placeholder="Mr. Kumar" value="${cls?cls.teacher:''}"/></div>
        <div class="field"><label>Room</label><input name="room" class="input" placeholder="Room 204" value="${cls?cls.room||'':''}"/></div>
      </div>
      <div class="field"><label>Time</label><input required name="time" type="time" class="input" value="${cls&&cls.time24?cls.time24:''}"/></div>
      <div class="field">
        <label>Days</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${WEEKDAYS.map(w=>`<label style="display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:10px;background:#F4F7FC;font-size:12.5px;font-weight:600;cursor:pointer;">
            <input type="checkbox" name="days" value="${w}" ${selectedDays.has(w)?'checked':''}/> ${w}
          </label>`).join('')}
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">${cls?'Save Changes':'Add to Timetable'}</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#modal-close').onclick = close;
  overlay.querySelector('#modal-cancel').onclick = close;
  overlay.querySelector('#class-form').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const days = fd.getAll('days');
    if(days.length===0){ showToast('Select at least one day'); return; }
    const time24 = fd.get('time');
    const timeLabel = time24 ? formatTime12(time24) : '';
    // name/section/departmentId are denormalized straight from the parent
    // class group — see openClassGroupModal() for why.
    const payload = { classGroupId: groupId, name:group.name, section:group.section, subject:fd.get('subject'), teacher:fd.get('teacher'), room:fd.get('room'), departmentId:group.departmentId||null, time:timeLabel, time24, days };
    if(cls){
      Object.assign(cls, payload);
      showToast('Timetable period updated');
    } else {
      const id = `CL${Date.now().toString(36)}${Math.floor(Math.random()*900+100)}`;
      data.classes.push({ id, ...payload });
      // No separate enrollment step needed here — rosterFor() resolves
      // every period back to its classGroupId, so every student already
      // enrolled in this class shows up in this new period immediately.
      showToast(`Added to timetable — every student in ${group.name}${group.section} is included`);
    }
    await persist(data); close(); renderView();
  };
}
function formatTime12(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const period = h>=12?'PM':'AM';
  const h12 = h%12===0?12:h%12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
async function deleteClass(classId){
  if(!confirm('Delete this timetable period? Its attendance history will remain, but it will no longer appear in the timetable. Enrolled students stay in the class.')) return;
  const data = state.data;
  data.classes = (data.classes||[]).filter(c=>c.id!==classId);
  await persist(data);
  showToast('Timetable period removed');
  renderView();
}
async function deleteClassGroup(groupId){
  const data = state.data;
  const periods = (data.classes||[]).filter(c=>c.classGroupId===groupId);
  const roster = rosterFor(groupId);
  if(!confirm(`Delete this class? This removes its ${periods.length} timetable period${periods.length===1?'':'s'} and unenrolls ${roster.length} student${roster.length===1?'':'s'}. Attendance and marks history already recorded will remain. This cannot be undone.`)) return;
  data.classGroups = (data.classGroups||[]).filter(g=>g.id!==groupId);
  data.classes = (data.classes||[]).filter(c=>c.classGroupId!==groupId);
  data.enrollments = (data.enrollments||[]).filter(en=>en.classGroupId!==groupId);
  if(state._classGroupDetail===groupId) state._classGroupDetail = null;
  await persist(data);
  showToast('Class deleted');
  renderView();
}

/* ============================================================================
   MARKS
============================================================================ */
function renderMarks(root){
  const data = state.data;
  const students = data.students || [];
  const classes = data.classes || [];
  const today = todayStr();
  const defaultFrom = (()=>{ const d=new Date(); d.setDate(d.getDate()-89); return d.toISOString().slice(0,10); })();

  const classFilter   = state._markClassFilter   || 'All';
  const subjectFilter = state._markSubjectFilter || 'All';
  const studentFilter = state._markStudentFilter || 'All';
  const minFilter = state._markMin !== undefined && state._markMin !== '' ? Number(state._markMin) : null;
  const maxFilter = state._markMax !== undefined && state._markMax !== '' ? Number(state._markMax) : null;
  const from = state._markFrom || defaultFrom;
  const to = state._markTo || today;

  const subjects = [...new Set(classes.map(c=>c.subject).filter(Boolean))];
  const singleStudent = studentFilter!=='All' ? students.find(s=>s.id===studentFilter) : null;

  const enrich = (rawMarks)=> rawMarks.map(m=>{
    const student = students.find(s=>s.id===m.studentId);
    const cls = classes.find(c=>c.id===m.classId);
    const pct = m.absent ? null : (m.maxMarks ? Math.round((m.marks/m.maxMarks)*1000)/10 : 0);
    return { ...m, studentName: student?student.name:'Unknown Student', className: cls?`${cls.name}${cls.section}`:'—', subject: m.subject || (cls?cls.subject:'—'), pct };
  });

  const applyFilters = (enriched)=> enriched.filter(m=>{
    if(classFilter!=='All' && m.classId!==classFilter) return false;
    if(subjectFilter!=='All' && m.subject!==subjectFilter) return false;
    // A % filter doesn't apply to an absence (there's no score to compare),
    // so an active min/max filter excludes absent entries entirely rather
    // than treating a missing score as 0%.
    if((minFilter!==null || maxFilter!==null) && m.absent) return false;
    if(minFilter!==null && !isNaN(minFilter) && m.pct<minFilter) return false;
    if(maxFilter!==null && !isNaN(maxFilter) && m.pct>maxFilter) return false;
    return true;
  }).sort((a,b)=> b.date.localeCompare(a.date));

  const draw = (rawMarks, totalCountLabel, loading)=>{
    const enriched = enrich(rawMarks);
    const filtered = applyFilters(enriched);
    // Absences don't have a score, so they're excluded from average/
    // highest/lowest (an absence isn't a 0%) but still counted in
    // "Entries Shown" since they were still logged.
    const scored = filtered.filter(m=>!m.absent);
    const avg = scored.length ? Math.round((scored.reduce((s,m)=>s+m.pct,0)/scored.length)*10)/10 : 0;
    const highest = scored.length ? Math.max(...scored.map(m=>m.pct)) : 0;
    const lowest = scored.length ? Math.min(...scored.map(m=>m.pct)) : 0;

    root.innerHTML = `
      <div class="page-head">
        <div><h1>Marks</h1><p>${totalCountLabel}</p></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" id="marks-export" ${loading?'disabled':''}>${ic('download')} Export CSV</button>
          <button class="btn btn-mint" id="marks-quick">${ic('bolt')} Quick Marks Entry</button>
          <button class="btn btn-primary" id="marks-add">${ic('plus')} Add Marks</button>
        </div>
      </div>

      <div class="filters-row">
        <select id="mk-student-filter" class="input">
          <option value="All" ${studentFilter==='All'?'selected':''}>All Students</option>
          ${students.map(s=>`<option value="${s.id}" ${studentFilter===s.id?'selected':''}>${s.name}</option>`).join('')}
        </select>
        ${singleStudent?'':`
          <div class="field" style="margin:0;"><label style="font-size:11.5px;">From</label><input type="date" id="mk-from" class="input" value="${from}" max="${today}"/></div>
          <div class="field" style="margin:0;"><label style="font-size:11.5px;">To</label><input type="date" id="mk-to" class="input" value="${to}" max="${today}"/></div>
        `}
        <select id="mk-class-filter" class="input">
          <option value="All" ${classFilter==='All'?'selected':''}>All Classes</option>
          ${classes.map(c=>`<option value="${c.id}" ${classFilter===c.id?'selected':''}>${c.name}${c.section}</option>`).join('')}
        </select>
        <select id="mk-subject-filter" class="input">
          <option value="All" ${subjectFilter==='All'?'selected':''}>All Subjects</option>
          ${subjects.map(s=>`<option value="${s}" ${subjectFilter===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <input id="mk-min" type="number" min="-500" max="100" class="input" style="width:110px;" placeholder="Min %" value="${state._markMin||''}"/>
        <input id="mk-max" type="number" min="-500" max="100" class="input" style="width:110px;" placeholder="Max %" value="${state._markMax||''}"/>
        ${(classFilter!=='All'||subjectFilter!=='All'||studentFilter!=='All'||state._markMin||state._markMax)?`<button class="btn btn-outline btn-sm" id="mk-clear">${ic('x').replace('<svg','<svg style="width:12px;height:12px"')} Clear filters</button>`:''}
      </div>

      <div class="grid-4" style="margin-bottom:20px;">
        <div class="card statbox"><div class="n">${loading?'…':filtered.length}</div><div class="l">Entries Shown</div></div>
        <div class="card statbox"><div class="n" style="color:${avg<40?T.red:avg<75?T.amber:T.mintDeep}">${loading?'…':avg+'%'}</div><div class="l">Average Score</div></div>
        <div class="card statbox"><div class="n" style="color:${T.mintDeep}">${loading?'…':highest+'%'}</div><div class="l">Highest Score</div></div>
        <div class="card statbox"><div class="n" style="color:${T.red}">${loading?'…':lowest+'%'}</div><div class="l">Lowest Score</div></div>
      </div>

      ${singleStudent && !loading ? renderStudentMarksAnalysis(singleStudent, filtered) : ''}
      ${singleStudent && loading ? `<div class="card" style="padding:22px;margin-bottom:20px;"><div class="empty"><div class="empty-txt">Loading ${singleStudent.name}'s full marks history…</div></div></div>` : ''}

      <div class="card table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Subject</th><th>Exam</th><th>Marks</th><th>%</th><th></th></tr></thead>
          <tbody>
            ${loading?`<tr><td colspan="8"><div class="empty"><div class="empty-txt">Loading marks…</div></div></td></tr>`:
            filtered.length===0?`<tr><td colspan="8"><div class="empty"><div class="empty-ic">${ic('bar').replace('<svg','<svg style="width:20px;height:20px;color:var(--slate)"')}</div><div class="empty-txt">No marks match your filters.</div></div></td></tr>`:
            filtered.map(m=>`<tr>
              <td>${prettyDate(m.date)}</td>
              <td><div class="tname"><div class="s-av" style="width:28px;height:28px;font-size:10px;">${initials(m.studentName)}</div><div class="n">${m.studentName}</div></div></td>
              <td>${m.className}</td>
              <td style="color:var(--slate)">${m.subject}</td>
              <td style="color:var(--slate)">${m.examName}</td>
              <td>${m.absent ? `<span style="color:${T.red};font-weight:700;">Absent</span>` : `${m.marks} / ${m.maxMarks}`}</td>
              <td style="font-weight:700;color:${m.absent?'var(--slate)':(m.pct<40?T.red:m.pct<75?T.amber:T.mintDeep)}">${m.absent?'—':m.pct+'%'}</td>
              <td>
                <div class="row-actions">
                  <button class="icon-btn" data-action="edit-mark" data-mid="${m.id}">${ic('edit').replace('<svg','<svg style="width:14px;height:14px;color:var(--slate)"')}</button>
                  <button class="icon-btn" data-action="delete-mark" data-mid="${m.id}">${ic('trash').replace('<svg','<svg style="width:14px;height:14px;color:'+T.red+'"')}</button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;

    document.getElementById('mk-class-filter').onchange = (e)=>{ state._markClassFilter=e.target.value; renderMarks(root); };
    document.getElementById('mk-subject-filter').onchange = (e)=>{ state._markSubjectFilter=e.target.value; renderMarks(root); };
    document.getElementById('mk-student-filter').onchange = (e)=>{ state._markStudentFilter=e.target.value; renderMarks(root); };
    document.getElementById('mk-min').onchange = (e)=>{ state._markMin=e.target.value; renderMarks(root); };
    document.getElementById('mk-max').onchange = (e)=>{ state._markMax=e.target.value; renderMarks(root); };
    const fromEl = document.getElementById('mk-from'); if(fromEl) fromEl.onchange = (e)=>{ state._markFrom=e.target.value; renderMarks(root); };
    const toEl = document.getElementById('mk-to'); if(toEl) toEl.onchange = (e)=>{ state._markTo=e.target.value; renderMarks(root); };
    const clearBtn = document.getElementById('mk-clear');
    if(clearBtn) clearBtn.onclick = ()=>{ state._markClassFilter='All'; state._markSubjectFilter='All'; state._markStudentFilter='All'; state._markMin=''; state._markMax=''; renderMarks(root); };

    document.getElementById('marks-add').onclick = ()=> openBulkMarksModal(classFilter!=='All'?classFilter:null);
    document.getElementById('marks-quick').onclick = ()=> openQuickMarksSetupModal(classFilter!=='All'?classFilter:null);
    if(!loading){
      document.getElementById('marks-export').onclick = ()=>{
        const rows=[["Date","Student","Class","Subject","Exam","Marks","Max Marks","Percentage"], ...filtered.map(m=>[csvDateCell(m.date),m.studentName,m.className,m.subject,m.examName,m.absent?'AB':m.marks,m.maxMarks,m.absent?'AB':m.pct+'%'])];
        const csv = rows.map(r=>r.map((v,i)=> i===0 ? v : `"${String(v).replace(/"/g,'""')}"`).join(",")).join(String.fromCharCode(10));
        const blob = new Blob(['\uFEFF'+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='marks.csv'; a.click();
        showToast('Marks exported to CSV');
      };
    }
    document.querySelectorAll('[data-action="edit-mark"]').forEach(b=>b.onclick=()=> openMarkModal(b.getAttribute('data-mid')));
    document.querySelectorAll('[data-action="delete-mark"]').forEach(b=>b.onclick=()=> deleteMark(b.getAttribute('data-mid')));
  };

  /*
   * Marks now load as a rolling ~90-day window at boot (see loadData()),
   * since weekly exams across a whole college add up fast over the
   * years. Two on-demand paths cover everything outside that window:
   *   - a single student selected -> fetch THAT student's complete,
   *     all-time marks history (an indexed, scoped query — same
   *     pattern as fetchStudentAttendanceHistory)
   *   - browsing all students with a custom date range -> fetch that
   *     exact range fresh, same pattern as the History page
   */
  if(singleStudent){
    const cached = state._studentMarksCache && state._studentMarksCache[singleStudent.id];
    if(cached){ draw(cached, `${cached.length} mark${cached.length===1?'':'s'} for ${singleStudent.name}`, false); return; }
    draw([], `Loading marks for ${singleStudent.name}…`, true);
    const fb = window.attendoFirebase;
    const organizationId = getOrganizationId();
    fb.getDocs(fb.query(
      fb.collection(fb.db, 'organizations', organizationId, 'marks'),
      fb.where('studentId', '==', singleStudent.id)
    )).then(snap=>{
      const records = []; snap.forEach(d=>records.push({ id:d.id, ...d.data() }));
      if(!state._studentMarksCache) state._studentMarksCache = {};
      state._studentMarksCache[singleStudent.id] = records;
      if(state._markStudentFilter===singleStudent.id) draw(records, `${records.length} mark${records.length===1?'':'s'} for ${singleStudent.name}`, false);
    }).catch(err=>{
      console.error('Failed to load student marks history:', err);
      if(state._markStudentFilter===singleStudent.id) draw([], `Couldn't load marks for ${singleStudent.name}`, false);
    });
    return;
  }

  const cacheKey = `${from}_${to}`;
  if(state._marksCache && state._marksCache.key===cacheKey){
    draw(state._marksCache.records, `${state._marksCache.records.length} mark${state._marksCache.records.length===1?'':'s'} recorded, ${prettyDate(from)} – ${prettyDate(to)}`, false);
    return;
  }
  draw([], `Loading marks for ${prettyDate(from)} – ${prettyDate(to)}…`, true);
  const fb = window.attendoFirebase;
  const organizationId = getOrganizationId();
  fb.getDocs(fb.query(
    fb.collection(fb.db, 'organizations', organizationId, 'marks'),
    fb.where('date', '>=', from),
    fb.where('date', '<=', to)
  )).then(snap=>{
    const records = []; snap.forEach(d=>records.push({ id:d.id, ...d.data() }));
    state._marksCache = { key: cacheKey, records };
    if(state.view==='marks' && (state._markStudentFilter||'All')==='All') draw(records, `${records.length} mark${records.length===1?'':'s'} recorded, ${prettyDate(from)} – ${prettyDate(to)}`, false);
  }).catch(err=>{
    console.error('Failed to load marks range:', err);
    if(state.view==='marks') draw([], `Couldn't load marks`, false);
  });
}

function renderStudentMarksAnalysis(student, allRecords){
  // allRecords includes absences (m.absent===true, m.pct===null) — those
  // are excluded from averages/trend below but still shown, in red, in
  // the exam-by-exam list so a parent/teacher can see an absence at a
  // glance rather than it silently pulling a subject average toward 0.
  const records = allRecords.filter(m=>!m.absent);
  const absences = allRecords.filter(m=>m.absent);

  const bySubject = {};
  records.forEach(m=>{
    if(!bySubject[m.subject]) bySubject[m.subject] = [];
    bySubject[m.subject].push(m);
  });
  const subjectRows = Object.entries(bySubject).map(([subject, list])=>{
    const avg = Math.round((list.reduce((s,m)=>s+m.pct,0)/list.length)*10)/10;
    return {subject, avg, count:list.length};
  }).sort((a,b)=> b.avg-a.avg);

  const trend = [...records].sort((a,b)=> a.date.localeCompare(b.date));
  const maxPct = 100;

  const examList = [...allRecords].sort((a,b)=> b.date.localeCompare(a.date));

  return `<div class="card" style="padding:22px;margin-bottom:20px;">
    <div class="chart-title">${student.name} — Deep Analysis</div>
    ${allRecords.length===0?`<div class="empty"><div class="empty-txt">No marks recorded for this student yet.</div></div>`:`
    <div class="mk-analysis-grid">
      <div>
        <div style="font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:10px;">Average by Subject</div>
        ${subjectRows.length===0?`<div style="font-size:12.5px;color:var(--slate);">No scored exams yet.</div>`:subjectRows.map(r=>`
          <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
              <span style="font-weight:600;">${r.subject}</span>
              <span style="color:${r.avg<40?T.red:r.avg<75?T.amber:T.mintDeep};font-weight:700;">${r.avg}% <span style="color:var(--slate);font-weight:500;">(${r.count})</span></span>
            </div>
            <div style="height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;">
              <div style="height:100%;width:${Math.min(r.avg,100)}%;border-radius:99px;background:${r.avg<40?T.red:r.avg<75?T.amber:T.mintDeep};"></div>
            </div>
          </div>
        `).join('')}
      </div>
      <div>
        <div style="font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:10px;">Score Trend (oldest → newest)</div>
        <div style="display:flex;align-items:flex-end;gap:6px;height:140px;">
          ${trend.length===0?`<div style="font-size:12.5px;color:var(--slate);align-self:center;">No scored exams yet.</div>`:trend.map(m=>`
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;" title="${m.subject} — ${prettyDate(m.date)} — ${m.pct}%">
              <div style="width:100%;max-width:22px;border-radius:5px 5px 0 0;background:${m.pct<40?T.red:m.pct<75?T.amber:T.mintDeep};height:${Math.max((m.pct/maxPct)*100,4)}%;"></div>
            </div>
          `).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--slate);margin-top:6px;">
          <span>${trend.length?prettyDate(trend[0].date):''}</span>
          <span>${trend.length?prettyDate(trend[trend.length-1].date):''}</span>
        </div>
      </div>
    </div>
    <div style="margin-top:20px;">
      <div style="font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:10px;">Exam-by-Exam${absences.length?` <span style="color:${T.red};font-weight:700;">(${absences.length} absence${absences.length>1?'s':''})</span>`:''}</div>
      ${examList.map(m=>`<div class="hist-row">
        <span>${prettyDate(m.date)} · ${m.subject||''} — ${m.examName||''}</span>
        <span class="badge" style="background:${m.absent?'#FDEBEB':(m.pct<40?'#FDEBEB':m.pct<75?'#FEF3DA':'#E3F8F0')};color:${m.absent?T.red:(m.pct<40?T.red:m.pct<75?T.amber:T.mintDeep)};font-weight:700;">${m.absent?'Absent':m.pct+'%'}</span>
      </div>`).join('')}
    </div>`}
  </div>`;
}

function findMarkAnywhere(markId){
  if(!markId) return null;
  const inWorkingSet = (state.data.marks||[]).find(m=>m.id===markId);
  if(inWorkingSet) return inWorkingSet;
  if(state._marksCache){
    const hit = state._marksCache.records.find(m=>m.id===markId);
    if(hit) return hit;
  }
  if(state._studentMarksCache){
    for(const sid in state._studentMarksCache){
      const hit = state._studentMarksCache[sid].find(m=>m.id===markId);
      if(hit) return hit;
    }
  }
  return null;
}
function openMarkModal(markId, presetStudentId, presetClassId){
  const data = state.data;
  const students = data.students || [];
  const classes = data.classes || [];
  if(students.length===0){ showToast('Add a student first'); state.view='students'; render(); return; }
  // A mark being edited might be from an on-demand fetch (outside the
  // preloaded ~90-day window — see renderMarks()) rather than data.marks
  // itself, so look it up across every cache that could hold it.
  const mark = markId ? findMarkAnywhere(markId) : null;
  const defaultStudentId = mark ? mark.studentId : (presetStudentId || students[0].id);
  const defaultClassId = mark ? mark.classId : (presetClassId || (periodsForStudent(defaultStudentId)[0]||{}).id || (classes[0]||{}).id);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="card modal">
    <div class="modal-head"><h3>${mark?'Edit Marks':'Add Marks'}</h3><button class="modal-close" id="modal-close">${ic('x')}</button></div>
    <form id="mark-form">
      <div class="modal-grid2">
        <div class="field"><label>Student</label><select name="studentId" class="input" style="width:100%;">${students.map(s=>`<option value="${s.id}" ${defaultStudentId===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
        <div class="field"><label>Class</label><select name="classId" class="input" style="width:100%;">${classes.map(c=>`<option value="${c.id}" ${defaultClassId===c.id?'selected':''}>${c.name}${c.section}</option>`).join('')}</select></div>
      </div>
      <div class="modal-grid2">
        <div class="field"><label>Subject</label><input name="subject" class="input" placeholder="Maths" value="${mark?mark.subject:''}"/></div>
        <div class="field"><label>Exam / Test Name</label><input required name="examName" class="input" placeholder="Unit Test 1" value="${mark?mark.examName:''}"/></div>
      </div>
      <div class="modal-grid2">
        <div class="field">
          <label>Marks Obtained</label>
          <input type="number" min="0" step="0.5" name="marks" id="em-marks" class="input" value="${mark&&!mark.absent?mark.marks:''}" ${mark&&mark.absent?'disabled':''}/>
        </div>
        <div class="field"><label>Maximum Marks</label><input required type="number" min="1" step="0.5" name="maxMarks" class="input" value="${mark?mark.maxMarks:100}"/></div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:-4px 0 16px;cursor:pointer;">
        <input type="checkbox" name="absent" id="em-absent" ${mark&&mark.absent?'checked':''}/> Student was absent for this test
      </label>
      <div class="field"><label>Date</label><input required type="date" name="date" class="input" value="${mark?mark.date:todayStr()}"/></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Marks</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#modal-close').onclick = close;
  overlay.querySelector('#modal-cancel').onclick = close;
  overlay.querySelector('#em-absent').onchange = (e)=>{
    const marksInput = overlay.querySelector('#em-marks');
    marksInput.disabled = e.target.checked;
    if(e.target.checked) marksInput.value = '';
  };
  overlay.querySelector('#mark-form').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const cls = classes.find(c=>c.id===fd.get('classId'));
    const isAbsent = fd.get('absent') === 'on';
    const maxVal = Number(fd.get('maxMarks'));
    if(maxVal<=0){ showToast('Maximum marks must be greater than 0'); return; }
    let marksVal = null;
    if(!isAbsent){
      marksVal = Number(fd.get('marks'));
      if(fd.get('marks')===''){ showToast('Enter marks obtained, or check "Student was absent"'); return; }
      if(marksVal>maxVal){ showToast('Marks obtained cannot exceed maximum marks'); return; }
    }
    const payload = {
      studentId: fd.get('studentId'),
      classId: fd.get('classId'),
      subject: String(fd.get('subject')||'').trim() || (cls?cls.subject:''),
      examName: String(fd.get('examName')).trim(),
      marks: marksVal,
      absent: isAbsent,
      maxMarks: maxVal,
      date: fd.get('date')
    };
    if(!data.marks) data.marks = [];
    if(mark){
      Object.assign(mark, payload);
      // The found mark might have come from an on-demand cache rather
      // than data.marks (see findMarkAnywhere) — make sure it's part of
      // the working set persist() actually diffs against, or the edit
      // would only update the display cache and never reach Firestore.
      if(!data.marks.some(m=>m.id===mark.id)) data.marks.push(mark);
      showToast('Marks updated');
    } else {
      const id = `M${Date.now()}${Math.floor(Math.random()*1000)}`;
      data.marks.push({ id, ...payload });
      showToast('Marks added');
    }
    // Invalidate on-demand caches so the Marks page re-fetches fresh
    // data (including this change) instead of showing stale results.
    state._marksCache = null;
    state._studentMarksCache = null;
    await persist(data); close(); renderView();
  };
  overlay.querySelector('[name="studentId"]').onchange = (e)=>{
    const firstClass = periodsForStudent(e.target.value)[0];
    if(firstClass){ const clsSel = overlay.querySelector('[name="classId"]'); if(clsSel) clsSel.value = firstClass.id; }
  };
}

/* ============================================================================

   or an Absent checkbox). Replaces the old one-student-at-a-time modal for
   adding; openMarkModal() above is still used for editing a single entry.
============================================================================ */
function openBulkMarksModal(presetClassId){
  const data = state.data;
  const classes = data.classes || [];
  if(classes.length===0){ showToast('Add a class first'); state.view='classes'; render(); return; }
  let classId = presetClassId || classes[0].id;

  const overlay = document.createElement('div');

  overlay.innerHTML = `<div class="card modal" style="max-width:520px;">
    <div class="modal-head"><h3>Add Marks</h3><button class="modal-close" id="modal-close">${ic('x')}</button></div>
    <form id="bulk-mark-form">
      <div class="modal-grid2">
        <div class="field"><label>Test Name</label><input required name="examName" class="input" placeholder="Unit Test 1"/></div>
        <div class="field"><label>Subject</label><input name="subject" id="bm-subject" class="input" placeholder="Maths" value="${(classes.find(c=>c.id===classId)||{}).subject||''}"/></div>
      </div>
      <div class="modal-grid2">
        <div class="field">
          <label>Class</label>
          <select name="classId" id="bm-class" class="input" style="width:100%;">
            ${classes.map(c=>`<option value="${c.id}" ${c.id===classId?'selected':''}>${c.name}${c.section}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Maximum Marks</label><input required type="number" min="1" step="0.5" name="maxMarks" id="bm-max" class="input" value="100"/></div>
      </div>
      <div class="field">
        <label>Students</label>
        <div id="bm-rows" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;padding:10px 12px;"></div>
      </div>
      <div style="font-size:12px;color:var(--slate);margin:-8px 0 16px;">Leave a student's marks blank to skip them for this test.</div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Marks</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#modal-close').onclick = close;
  overlay.querySelector('#modal-cancel').onclick = close;

  function renderRows(){
    const roster = rosterFor(classId).sort((a,b)=>a.roll-b.roll);
    const rowsEl = overlay.querySelector('#bm-rows');
    rowsEl.innerHTML = roster.length===0
      ? `<div style="font-size:13px;color:var(--slate);">No students enrolled in this class yet.</div>`
      : roster.map(s=>`
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.name}</div>
            <div style="font-size:11px;color:var(--slate);">Roll #${s.roll}</div>
          </div>
          <input type="number" min="0" step="0.5" class="input bm-marks" data-sid="${s.id}" placeholder="Marks" style="width:90px;"/>
          <label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;">
            <input type="checkbox" class="bm-absent" data-sid="${s.id}"/> Absent
          </label>
        </div>
      `).join('');
    rowsEl.querySelectorAll('.bm-absent').forEach(cb=>{
      cb.onchange = ()=>{
        const marksInput = rowsEl.querySelector(`.bm-marks[data-sid="${cb.getAttribute('data-sid')}"]`);
        marksInput.disabled = cb.checked;
        if(cb.checked) marksInput.value = '';
      };
    });
  }
  renderRows();

  overlay.querySelector('#bm-class').onchange = (e)=>{
    classId = e.target.value;
    const subjInput = overlay.querySelector('#bm-subject');
    if(subjInput && !subjInput.value){ const cls = classes.find(c=>c.id===classId); subjInput.value = cls?cls.subject:''; }
    renderRows();
  };

  overlay.querySelector('#bulk-mark-form').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const examName = String(fd.get('examName')).trim();
    const cls = classes.find(c=>c.id===classId);
    const subject = String(fd.get('subject')||'').trim() || (cls?cls.subject:'');
    const maxMarks = Number(fd.get('maxMarks'));
    if(maxMarks<=0){ showToast('Maximum marks must be greater than 0'); return; }
    const roster = rosterFor(classId);
    const date = todayStr();
    const entries = [];
    let skipped = 0, invalid = false;
    roster.forEach(s=>{
      const marksInput = overlay.querySelector(`.bm-marks[data-sid="${s.id}"]`);
      const absentBox = overlay.querySelector(`.bm-absent[data-sid="${s.id}"]`);
      const isAbsent = absentBox && absentBox.checked;
      const raw = marksInput ? marksInput.value : '';
      if(isAbsent){
        entries.push({ studentId:s.id, classId, subject, examName, marks:null, absent:true, maxMarks, date });
      } else if(raw !== ''){
        const val = Number(raw);
        if(val>maxMarks){ invalid = true; return; }
        entries.push({ studentId:s.id, classId, subject, examName, marks:val, absent:false, maxMarks, date });
      } else {
        skipped++;
      }
    });
    if(invalid){ showToast('Marks obtained cannot exceed maximum marks'); return; }
    if(entries.length===0){ showToast('Enter marks (or mark Absent) for at least one student'); return; }
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    if(!data.marks) data.marks = [];
    entries.forEach((payload, i)=>{
      const id = `M${Date.now()}${i}${Math.floor(Math.random()*10000)}`;
      data.marks.push({ id, ...payload });
    });
    state._marksCache = null;
    state._studentMarksCache = null;
    try{
      await persist(data);
      showToast(`Marks saved for ${entries.length} student${entries.length===1?'':'s'}${skipped?` (${skipped} skipped)`:''}`);
      close();
      renderView();
    }catch(err){
      console.error('Failed to save marks:', err);
      showToast('Could not save — try again');
      submitBtn.disabled = false;
    }
  };
}

function renderQuickMarks(){
  const data = state.data;
  const setup = state.quickMarksSetup;
  const exitOverlay = (msg)=>`<div class="qr-overlay"><div class="qr-top"><button class="qr-exit" data-action="qm-exit">${ic('arrowLeft')} Back</button></div><div class="qr-body"><div style="color:#fff;font-weight:600;">${msg}</div></div></div>`;
  if(!setup) return exitOverlay('No test set up yet.');
  const cls = (data.classes||[]).find(c=>c.id===setup.classId);
  const roster = rosterFor(setup.classId).sort((a,b)=>a.roll-b.roll);
  if(roster.length===0) return exitOverlay(`No students in ${cls?`${cls.name}${cls.section}`:'this class'}.`);
  const idx = Math.min(state.quickMarksIdx, roster.length-1);
  const current = roster[idx];
  const entry = state.quickMarksEntries[current.id];
  const isAbsent = !!(entry && entry.absent);

  return `<div class="qr-overlay">
    <div class="qr-top">
      <button class="qr-exit" data-action="qm-exit">${ic('arrowLeft')} Exit Quick Marks</button>
      <div class="qr-classname">${setup.examName}${setup.subject?` · ${setup.subject}`:''} — ${cls?`${cls.name}${cls.section}`:''}</div>
    </div>
    <div class="qr-body">
      <div class="qr-progtxt">Student ${idx+1} / ${roster.length}</div>
      <div class="qr-progbar"><div class="qr-progbar-fill" style="width:${(idx+1)/roster.length*100}%"></div></div>
      <div class="qr-avatar">
        ${initials(current.name)}
        ${entry?`<div class="qr-status-pill" style="background:${isAbsent?T.red:T.mintDeep}">${isAbsent?'Absent':`${entry.marks}/${setup.maxMarks}`}</div>`:''}
      </div>
      <div class="qr-name">${current.name}</div>
      <div class="qr-sub">Roll #${current.roll} · ${cls?`${cls.name}${cls.section}`:''}</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:14px;">
        <input type="number" min="0" max="${setup.maxMarks}" step="0.5" id="qm-marks-input" placeholder="Marks out of ${setup.maxMarks}"
          value="${entry&&!isAbsent?entry.marks:''}" ${isAbsent?'disabled':''}
          style="width:230px;text-align:center;font-size:26px;font-weight:800;padding:14px;border-radius:16px;border:none;outline:none;"/>
        <button id="qm-absent-toggle" style="border:none;cursor:pointer;padding:10px 20px;border-radius:999px;font-weight:700;font-size:13px;background:${isAbsent?T.red:'rgba(255,255,255,.14)'};color:#fff;">
          ${isAbsent?'✓ Marked Absent — click to undo':'Mark Absent'}
        </button>
      </div>
      <div class="qr-hint" style="margin-top:24px;">
        <button data-action="qm-prev">${ic('chevLeft')} Prev (←)</button>
        <span class="qr-kbd-only">Enter = next</span>
        <button data-action="qm-next">Next (→) ${ic('chevRight')}</button>
      </div>
    </div>
    <div class="qr-bottom"><button class="btn btn-mint btn-lg" data-action="qm-finish">${ic('save')} Finish & Save Marks</button></div>
  </div>`;
}

function attachQuickMarksEvents(){
  const data = state.data;
  const setup = state.quickMarksSetup;
  const exitToMarks = ()=>{
    if(Object.keys(state.quickMarksEntries).length>0 && !confirm('Discard the marks you\'ve entered so far?')) return;
    document.onkeydown = null;
    state.quickMarksSetup = null; state.quickMarksEntries = {}; state.quickMarksIdx = 0;
    state.view='marks'; render();
  };
  const bindExit = ()=>{ const b=document.querySelector('[data-action="qm-exit"]'); if(b) b.onclick = exitToMarks; };
  if(!setup){ bindExit(); return; }
  const roster = rosterFor(setup.classId).sort((a,b)=>a.roll-b.roll);
  if(roster.length===0){ bindExit(); return; }

  const idx = Math.min(state.quickMarksIdx, roster.length-1);
  const current = roster[idx];

  const marksInput = document.getElementById('qm-marks-input');
  if(marksInput){
    marksInput.oninput = ()=>{
      const val = marksInput.value;
      if(val === '') delete state.quickMarksEntries[current.id];
      else state.quickMarksEntries[current.id] = { marks: Number(val), absent:false };
    };
    marksInput.focus();
    marksInput.select();
  }
  const absentToggle = document.getElementById('qm-absent-toggle');
  if(absentToggle){
    absentToggle.onclick = ()=>{
      const entry = state.quickMarksEntries[current.id];
      if(entry && entry.absent) delete state.quickMarksEntries[current.id];
      else state.quickMarksEntries[current.id] = { marks:null, absent:true };
      render();
    };
  }
  const goNext = ()=>{ state.quickMarksIdx = Math.min(idx+1, roster.length-1); render(); };
  const goPrev = ()=>{ state.quickMarksIdx = Math.max(idx-1, 0); render(); };
  const nextBtn = document.querySelector('[data-action="qm-next"]'); if(nextBtn) nextBtn.onclick = goNext;
  const prevBtn = document.querySelector('[data-action="qm-prev"]'); if(prevBtn) prevBtn.onclick = goPrev;
  const exitBtn = document.querySelector('[data-action="qm-exit"]'); if(exitBtn) exitBtn.onclick = exitToMarks;

  const finishBtn = document.querySelector('[data-action="qm-finish"]');
  if(finishBtn) finishBtn.onclick = async ()=>{
    const entries = Object.entries(state.quickMarksEntries);
    if(entries.length===0){ showToast('Enter marks for at least one student first'); return; }
    finishBtn.disabled = true;
    if(!data.marks) data.marks = [];
    const date = todayStr();
    entries.forEach(([sid, e], i)=>{
      const id = `M${Date.now()}${i}${Math.floor(Math.random()*10000)}`;
      data.marks.push({
        id, studentId: sid, classId: setup.classId, subject: setup.subject,
        examName: setup.examName, marks: e.absent?null:e.marks, absent: !!e.absent,
        maxMarks: setup.maxMarks, date
      });
    });
    state._marksCache = null;
    state._studentMarksCache = null;
    try{
      await persist(data);
      showToast(`Marks saved for ${entries.length} student${entries.length===1?'':'s'}`);
      document.onkeydown = null;
      state.quickMarksSetup = null; state.quickMarksEntries = {}; state.quickMarksIdx = 0;
      state.view = 'marks'; render();
    }catch(err){
      console.error('Failed to save quick marks:', err);
      showToast('Could not save — try again');
      finishBtn.disabled = false;
    }
  };

  document.onkeydown = (e)=>{
    if(state.view!=='quickmarks') return;
    const inMarksField = document.activeElement && document.activeElement.id==='qm-marks-input';
    if(e.key==='Enter'){ e.preventDefault(); goNext(); }
    else if(e.key==='Escape'){ exitToMarks(); }
    else if(!inMarksField && e.key==='ArrowRight'){ goNext(); }
    else if(!inMarksField && e.key==='ArrowLeft'){ goPrev(); }
  };
}

async function deleteMark(markId){
  if(!confirm('Delete this marks entry? This cannot be undone.')) return;
  const data = state.data;
  data.marks = (data.marks||[]).filter(m=>m.id!==markId);
  if(!state._pendingMarkDeletes) state._pendingMarkDeletes = [];
  state._pendingMarkDeletes.push(markId);
  // Also drop it from any on-demand caches so it doesn't reappear from a stale fetch.
  if(state._marksCache) state._marksCache.records = (state._marksCache.records||[]).filter(m=>m.id!==markId);
  if(state._studentMarksCache){
    for(const sid in state._studentMarksCache){
      state._studentMarksCache[sid] = state._studentMarksCache[sid].filter(m=>m.id!==markId);
    }
  }
  await persist(data);
  showToast('Marks entry deleted');
  renderView();
}

============================================================================ */
function renderHistory(root){
  const data = state.data;
  const classFilter = state._histClass || 'All', statusFilter = state._histStatus || 'All';
  const today = todayStr();
  const defaultFrom = (()=>{ const d=new Date(); d.setDate(d.getDate()-13); return d.toISOString().slice(0,10); })();
  const from = state._histFrom || defaultFrom;
  const to = state._histTo || today;

  const minOnly = !!state._histMinOnly;
  const minPct = data.org.minAttendancePct ?? 75;

  const buildRows = (sessions)=>{
    const rows = [];
    Object.values(sessions).forEach(rec=>{
      if(classFilter!=='All' && rec.classId!==classFilter) return;
      const clsObj = (data.classes||[]).find(c=>c.id===rec.classId);
      const clsLabel = clsObj ? `${clsObj.name}${clsObj.section||''}` : (rec.classId||'—');
      Object.entries(rec.records).forEach(([sid,status])=>{
        const student = data.students.find(s=>s.id===sid); if(!student) return;
        rows.push({date:rec.date, sid, student:student.name, classId:rec.classId, cls:clsLabel, subject:rec.subject, status});
      });
    });
    rows.sort((a,b)=>b.date.localeCompare(a.date));
    return rows;
  };

  const draw = (allRows, loading)=>{
    // Per-student attendance % across the currently selected date range + class
    // filter (independent of the status filter/dropdown), used to power "Min".
    const pctByStudent = {};
    if(!loading){
      const totals = {};
      allRows.forEach(r=>{
        if(!totals[r.sid]) totals[r.sid] = {present:0, total:0};
        totals[r.sid].total++;
        if(r.status==='Present') totals[r.sid].present++;
      });
      Object.entries(totals).forEach(([sid,t])=>{ pctByStudent[sid] = t.total ? Math.round(t.present/t.total*100) : 100; });
    }

    let rows = allRows;
    if(statusFilter!=='All') rows = rows.filter(r=>r.status===statusFilter);
    if(minOnly) rows = rows.filter(r=>(pctByStudent[r.sid] ?? 100) < minPct);

    const shown = rows.slice(0,500);
    root.innerHTML = `
      <div class="page-head"><h1>Attendance History</h1><button class="btn btn-outline" id="hist-export" ${loading?'disabled':''}>${ic('download')} Export CSV</button></div>
      <div class="filters-row">
        <div class="field" style="margin:0;"><label style="font-size:11.5px;">From</label><input type="date" id="hist-from" class="input" value="${from}" max="${today}"/></div>
        <div class="field" style="margin:0;"><label style="font-size:11.5px;">To</label><input type="date" id="hist-to" class="input" value="${to}" max="${today}"/></div>
        <select id="hist-class" class="input"><option value="All" ${classFilter==='All'?'selected':''}>All Classes</option>${(data.classes||[]).map(c=>`<option value="${c.id}" ${classFilter===c.id?'selected':''}>${c.name}${c.section}</option>`).join('')}</select>
        <select id="hist-status" class="input"><option value="All" ${statusFilter==='All'?'selected':''}>All Statuses</option>${STATUSES.map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select>
        <button class="btn btn-sm" id="hist-min-toggle" title="Show only students below ${minPct}% attendance" style="background:${minOnly?T.red:'var(--red-soft)'};color:${minOnly?'#fff':T.red};">${ic('alert').replace('<svg','<svg style="width:13px;height:13px"')} Min</button>
      </div>
      <div class="card table-wrap" style="max-height:520px;overflow-y:auto;">
        <table>
          <thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Subject</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${loading?`<tr><td colspan="6"><div class="empty"><div class="empty-txt">Loading attendance for ${prettyDate(from)} – ${prettyDate(to)}…</div></div></td></tr>`:
            shown.length===0?`<tr><td colspan="6"><div class="empty"><div class="empty-txt">${minOnly?`No students below ${minPct}% attendance in this range.`:'No attendance recorded in this range.'}</div></div></td></tr>`:
            shown.map(r=>`<tr><td>${prettyDate(r.date)}</td><td style="font-weight:600;">${r.student}</td><td style="color:var(--slate)">${r.cls}</td><td style="color:var(--slate)">${r.subject}</td><td><span class="badge" style="background:${STATUS_META[r.status].bg};color:${STATUS_META[r.status].color}">${ic(STATUS_META[r.status].icon).replace('<svg','<svg style="width:12px;height:12px"')} ${r.status}</span></td><td style="text-align:right;"><button class="icon-btn" data-action="hist-delete" data-date="${r.date}" data-class="${r.classId}" data-sid="${r.sid}" title="Delete this ${r.status.toLowerCase()} record for ${r.student} on ${prettyDate(r.date)} — does not affect their profile" style="color:${T.red};">${ic('trash').replace('<svg','<svg style="width:14px;height:14px"')}</button></td></tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${!loading && rows.length>500?`<div style="font-size:12px;color:var(--slate);margin-top:10px;">Showing the most recent 500 of ${rows.length} matching records. Narrow the date range or filters to see the rest, or use Export CSV for the full set.</div>`:''}
    `;
    document.getElementById('hist-from').onchange = (e)=>{ state._histFrom=e.target.value; renderHistory(root); };
    document.getElementById('hist-to').onchange = (e)=>{ state._histTo=e.target.value; renderHistory(root); };
    document.getElementById('hist-class').onchange = (e)=>{ state._histClass=e.target.value; renderHistory(root); };
    document.getElementById('hist-status').onchange = (e)=>{ state._histStatus=e.target.value; renderHistory(root); };
    document.getElementById('hist-min-toggle').onclick = ()=>{ state._histMinOnly = !state._histMinOnly; renderHistory(root); };
    document.querySelectorAll('[data-action="hist-delete"]').forEach(b=>b.onclick = async ()=>{
      const rDate = b.getAttribute('data-date'), rClass = b.getAttribute('data-class'), rSid = b.getAttribute('data-sid');
      const row = shown.find(x=>x.date===rDate && x.classId===rClass && x.sid===rSid);
      if(!confirm(`Delete ${row?row.student:'this'}'s ${row?row.status.toLowerCase():''} record for ${prettyDate(rDate)}${row?` (${row.subject})`:''}? This only removes this one attendance record — the student's profile is not affected.`)) return;
      b.disabled = true;
      try{
        await deleteAttendanceRecord(rDate, rClass, rSid);
        showToast('Attendance record deleted');
        renderHistory(root);
      }catch(err){
        console.error('Failed to delete attendance record:', err);
        showToast('Could not delete — try again');
        b.disabled = false;
      }
    });
    if(!loading){
      document.getElementById('hist-export').onclick = ()=>{
        const r=[["Date","Student","Class","Subject","Status"], ...rows.map(x=>[csvDateCell(x.date),x.student,x.cls,x.subject,x.status])];
        const csv = r.map(row=>row.map((v,i)=> i===0 ? v : `"${String(v).replace(/"/g,'""')}"`).join(",")).join(String.fromCharCode(13)+String.fromCharCode(10));
        const blob = new Blob(['\uFEFF'+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='attendance-history.csv'; a.click();
      };
    }
  };

  const cacheKey = `${from}_${to}`;
  if(state._histCache && state._histCache.key===cacheKey){
    draw(buildRows(state._histCache.sessions), false);
    return;
  }

  // Only the last 14 days are preloaded (see loadData()); any other range
  // — including everything History defaults to browsing further back —
  // is fetched fresh here with an explicit date-bounded Firestore query,
  // so browsing years of history never means loading years of history.
  draw([], true);
  const fb = window.attendoFirebase;
  const organizationId = getOrganizationId();
  fb.getDocs(fb.query(
    fb.collection(fb.db, 'organizations', organizationId, 'attendanceSessions'),
    fb.where('date', '>=', from),
    fb.where('date', '<=', to)
  )).then(snap=>{
    const sessions = {};
    snap.forEach(docSnap=>{ sessions[docSnap.id] = docSnap.data(); });
    state._histCache = { key: cacheKey, sessions };
    if(state.view==='history') draw(buildRows(sessions), false);
  }).catch(err=>{
    console.error('Failed to load attendance history range:', err);
    if(state.view==='history') draw([], false);
  });
}

/* ============================================================================
   ONE-TIME STRUCTURE MIGRATION
   ------------------------------------------------------------------------
   For accounts created before multi-class enrollment support. Old data
   shapes it upgrades:
     - student.classId / student.section (single class)  -> an enrollments doc
     - class.department (free text)                      -> a real departments doc + class.departmentId
     - the old flat "attendance" collection                -> attendanceSessions + attendanceRecords

   Deterministic IDs throughout (enrollment id = `${classId}_${studentId}`,
   session/record ids reuse the original date|classId key) make this
   idempotent — running it again just re-writes the same documents rather
   than creating duplicates. Nothing in the OLD "attendance" collection is
   deleted, so it stays as a backup until you're confident and remove it
   yourself from the Firebase console.
============================================================================ */
async function runStructureMigration(){
  const statusEl = document.getElementById('migration-status');
  const setStatus = (msg)=>{ if(statusEl) statusEl.textContent = msg; };
  const btn = document.getElementById('run-migration');
  if(btn) btn.disabled = true;

  try{
    const fb = window.attendoFirebase;
    const user = fb.auth.currentUser;
    if(!user){ setStatus('Not signed in.'); return; }
    const organizationId = getOrganizationId();
    const data = state.data;

    setStatus('Migrating departments…');

    // 1) Turn any legacy free-text class.department values into real department docs.
    if(!data.departments) data.departments = [];
    const deptByName = new Map(data.departments.map(d=>[d.name.toLowerCase(), d]));
    for(const cls of (data.classes||[])){
      const legacyName = cls.department; // old free-text field, if present
      if(cls.departmentId) continue; // already migrated
      if(!legacyName) continue;
      let dept = deptByName.get(legacyName.toLowerCase());
      if(!dept){
        dept = { id:`DEPT${Date.now().toString(36)}${Math.floor(Math.random()*900+100)}`, name: legacyName, code:'' };
        data.departments.push(dept);
        deptByName.set(legacyName.toLowerCase(), dept);
      }
      cls.departmentId = dept.id;
    }

    setStatus('Migrating student class assignments…');

    // 2) Turn each student's old single classId into an enrollment.
    if(!data.enrollments) data.enrollments = [];
    const existingEnrollIds = new Set(data.enrollments.map(e=>e.id));
    let newEnrollments = 0;
    for(const s of (data.students||[])){
      const legacyClassId = s.classId; // old single-class field, if present
      if(!legacyClassId) continue;
      const enrollId = `${legacyClassId}_${s.id}`;
      if(existingEnrollIds.has(enrollId)) continue;
      const cls = (data.classes||[]).find(c=>c.id===legacyClassId);
      data.enrollments.push({ id: enrollId, studentId: s.id, classId: legacyClassId, departmentId: cls?cls.departmentId:null, enrolledAt: s.enrolled||todayStr() });
      existingEnrollIds.add(enrollId);
      newEnrollments++;
    }

    await persist(data);

    setStatus('Migrating attendance history — this can take a while for large histories…');

    // 3) Copy the OLD flat "attendance" collection into the new
    // attendanceSessions + attendanceRecords structure.
    const oldAttendanceSnap = await fb.getDocs(
      fb.collection(fb.db, 'organizations', organizationId, 'attendance')
    );

    let sessionsMigrated = 0, recordsMigrated = 0;
    const ops = [];
    const sessionsCollection = fb.collection(fb.db, 'organizations', organizationId, 'attendanceSessions');
    const recordsCollection = fb.collection(fb.db, 'organizations', organizationId, 'attendanceRecords');

    oldAttendanceSnap.forEach(docSnap=>{
      const old = docSnap.data();
      const [date, classId] = docSnap.id.split('|');
      if(!date || !classId || !old.records) return;
      const cls = (data.classes||[]).find(c=>c.id===classId);
      const sessionRef = fb.doc(sessionsCollection, docSnap.id);
      ops.push(batch => batch.set(sessionRef, {
        classId, date, subject: old.subject||(cls?cls.subject:''), records: old.records
      }, { merge:true }));
      sessionsMigrated++;
      for(const [studentId, status] of Object.entries(old.records)){
        const recordId = `${date}|${classId}|${studentId}`;
        const ref = fb.doc(recordsCollection, recordId);
        ops.push(batch => batch.set(ref, {
          studentId, classId, subject: old.subject||(cls?cls.subject:''), date, status
        }, { merge:true }));
        recordsMigrated++;
      }
    });

    if(ops.length){
      await _commitInChunks(fb, ops);
    }

    setStatus(`Done — ${newEnrollments} enrollment${newEnrollments===1?'':'s'} created, ${sessionsMigrated} attendance session${sessionsMigrated===1?'':'s'} and ${recordsMigrated} attendance record${recordsMigrated===1?'':'s'} migrated. Reloading…`);
    showToast('Migration complete');

    // Reload from Firestore so the app picks up the migrated structure.
    state.data = await loadData();
    renderView();

  } catch(error){
    console.error('Migration failed:', error);
    setStatus('Migration failed — see console for details.');
    showToast('Migration failed');
  } finally {
    if(btn) btn.disabled = false;
  }
}

    (data.students||[]).forEach(s=>{ if(s.departmentId===did) s.departmentId = null; });
    (data.classGroups||[]).forEach(g=>{ if(g.departmentId===did) g.departmentId = null; });
    (data.classes||[]).forEach(c=>{ if(c.departmentId===did) c.departmentId = null; });
    await persist(data); showToast('Department deleted'); renderSettings(root);
  });
  document.getElementById('run-migration').onclick = ()=> runStructureMigration();
  document.getElementById('change-pwd-btn').onclick = async ()=>{
    const statusEl = document.getElementById('pwd-status');
    const oldPwd = document.getElementById('pwd-old').value;
    const newPwd = document.getElementById('pwd-new').value;
    const confirmPwd = document.getElementById('pwd-confirm').value;
    statusEl.style.color = T.red;
    if(newPwd !== confirmPwd){ statusEl.textContent = 'New password and confirmation do not match.'; return; }
    const btn = document.getElementById('change-pwd-btn');
    btn.disabled = true; statusEl.textContent = 'Updating password…'; statusEl.style.color = 'var(--slate)';
    try{
      await changeOwnPassword(oldPwd, newPwd);
      statusEl.style.color = T.mintDeep;
      statusEl.textContent = 'Password updated.';
      document.getElementById('pwd-old').value = '';
      document.getElementById('pwd-new').value = '';
      document.getElementById('pwd-confirm').value = '';
      showToast('Password updated');
    }catch(err){
      console.error('Password change failed:', err);
      statusEl.style.color = T.red;
      statusEl.textContent = (err && (err.code==='auth/invalid-credential' || err.code==='auth/wrong-password')) ? 'Current password is incorrect.' : (err.message || 'Could not update password.');
    }finally{
      btn.disabled = false;
    }
  };
  document.getElementById('save-settings').onclick = async ()=>{
    data.org.name = document.getElementById('set-org-name').value;
    data.org.type = document.getElementById('set-org-type').value;
    data.org.lateThresholdMin = Number(document.getElementById('late-range').value);
    data.org.minAttendancePct = Number(document.getElementById('min-range').value);
    await persist(data); showToast('Settings saved');
  };
}

function renderParentShell(){
  const pd = state.parentData;
  const student = pd ? pd.student : {name:'Student'};
  const unread = parentUnreadNotifCount();
  const bellBtn = `<div class="bell-wrap">
      <button class="btn btn-outline btn-sm" data-action="toggle-parent-notif" title="Notifications">${ic('bell').replace('<svg','<svg style="width:13px;height:13px"')}${unread>0?`<span class="bell-dot">${unread>9?'9+':unread}</span>`:''}</button>

      </div>
    </div>`;
  return `<div class="shell">
    <div class="sidebar">
      <div class="sidebar-logo">${logoHTML()}</div>
      <div style="margin:0 0 18px;"><span class="badge" style="background:var(--blue-soft);color:var(--blue-deep);">${ic('users').replace('<svg','<svg style="width:12px;height:12px"')} Parent View</span></div>
      <div class="nav-list">${parentNavHTML()}</div>
      <div class="user-chip" style="margin-top:auto;">
        <div class="user-av">${initials(student.name)}</div>
        <div class="user-meta"><div class="user-name">${student.name}</div><div class="user-role">Roll #${student.roll??'—'}</div></div>
        <button data-action="logout" title="Log out">${ic('logout').replace('<svg','<svg style="width:15px;height:15px;color:var(--slate)"')}</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;font-weight:700;">
          <button class="hamburger" data-action="open-drawer">${ic('menu').replace('<svg','<svg style="width:20px;height:20px"')}</button>
          <span>${state.parentView==='timetable'?'Time Table':'Student Analysis'}</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          ${bellBtn}
          <button class="btn btn-outline btn-sm" data-action="logout">${ic('logout').replace('<svg','<svg style="width:13px;height:13px"')} Log Out</button>
        </div>
      </div>
      <div class="view" id="view-root"></div>
    </div>
    <div class="drawer-overlay" data-action="close-drawer"></div>
    <div class="mobile-drawer">
      <div class="sidebar-logo">${logoHTML()}</div>
      <div style="margin:0 0 18px;"><span class="badge" style="background:var(--blue-soft);color:var(--blue-deep);">${ic('users').replace('<svg','<svg style="width:12px;height:12px"')} Parent View</span></div>
      <div class="nav-list">${parentNavHTML()}</div>
      <div class="user-chip" style="margin-top:auto;">
        <div class="user-av">${initials(student.name)}</div>
        <div class="user-meta"><div class="user-name">${student.name}</div><div class="user-role">Roll #${student.roll??'—'}</div></div>
        <button data-action="logout" title="Log out">${ic('logout').replace('<svg','<svg style="width:15px;height:15px;color:var(--slate)"')}</button>
      </div>
    </div>
  </div>`;
}
function attachParentShellEvents(){
  document.querySelectorAll('[data-action="logout"]').forEach(b=>b.onclick=()=> logoutUser());
  const drawer = document.querySelector('.mobile-drawer');
  const overlay = document.querySelector('.drawer-overlay');
  document.querySelectorAll('[data-action="open-drawer"]').forEach(b=>b.onclick=()=>{ drawer.classList.add('open'); overlay.classList.add('open'); });
  document.querySelectorAll('[data-action="close-drawer"]').forEach(b=>b.onclick=()=>{ drawer.classList.remove('open'); overlay.classList.remove('open'); });
  document.querySelectorAll('[data-action="parent-nav"]').forEach(b=>b.onclick=()=>{
    state.parentView = b.getAttribute('data-view');
    render();
  });
  const bellBtn = document.querySelector('[data-action="toggle-parent-notif"]');
  const panel = document.getElementById('parent-notif-panel');
  if(bellBtn && panel){
    bellBtn.onclick = (e)=>{
      e.stopPropagation();
      const opening = !panel.classList.contains('open');
      panel.classList.toggle('open');
      if(opening){
        try{ localStorage.setItem(parentNotifSeenKey(), String(Date.now())); }catch(err){}
        const dot = bellBtn.querySelector('.bell-dot');
        if(dot) dot.remove();
      }
    };
    document.addEventListener('click', (e)=>{
      if(panel.classList.contains('open') && !panel.contains(e.target) && e.target!==bellBtn && !bellBtn.contains(e.target)){
        panel.classList.remove('open');
      }
    }, { once:true });
  }
  refreshParentNotifications();
  if(state.parentView==='timetable') renderParentTimetable(document.getElementById('view-root'));
  else renderParentDashboard(document.getElementById('view-root'));
}
function refreshParentNotifications(){
  const session = state.parentSession;
  const pd = state.parentData;
  if(!session || !pd) return;
  if(state.parentNotifications){
    return; // already loaded this session; avoids a re-fetch on every re-render
  }
  fetchParentNotifications(session.organizationId, pd.cls.id).then(list=>{
    state.parentNotifications = list;
    const listEl = document.getElementById('parent-notif-list');
    if(listEl) listEl.innerHTML = renderParentNotifPanel();
    const bellBtn = document.querySelector('[data-action="toggle-parent-notif"]');
    const unread = parentUnreadNotifCount();
    if(bellBtn){
      let dot = bellBtn.querySelector('.bell-dot');
      if(unread>0){
        if(!dot){ dot = document.createElement('span'); dot.className='bell-dot'; bellBtn.appendChild(dot); }
        dot.textContent = unread>9?'9+':unread;
      } else if(dot){ dot.remove(); }
    }
  }).catch(err=>{
    console.error('Failed to load notifications:', err);
    state.parentNotifications = [];
  });
}
function renderParentTimetable(root){
  if(!root) return;
  root.innerHTML = `
    <div style="margin-bottom:18px;">
      <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">Time Table</h1>
      <p style="font-size:13.5px;color:var(--slate);">2026-27 timetables for all sections. Find the one matching your child's class.</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr;gap:20px;max-width:900px;">
      ${TIMETABLE_LIST.map(t=>`
        <div class="card" style="padding:18px;">
          <div class="tt-label">${t.label} <span style="color:var(--slate);font-weight:500;font-size:12px;">— ${t.sub}</span></div>
          <img class="tt-img" src="${TIMETABLE_IMAGES[t.key]}" alt="${t.label} timetable"/>
        </div>
      `).join('')}
    </div>
  `;
}
function renderParentDashboard(root){
  const session = state.parentSession;
  const pd = state.parentData;
  if(!root || !session || !pd){ logoutUser(); return; }

  const draw = (attendance, marks, loading)=>{
    const present = attendance.filter(a=>a.status==='Present').length;
    const absent = attendance.filter(a=>a.status==='Absent').length;
    const late = attendance.filter(a=>a.status==='Late').length;
    const total = attendance.length;
    const pct = total ? Math.round(present/total*100) : 100;
    const student = pd.student, cls = pd.cls;

    root.innerHTML = `
      <div class="card profile-head" style="margin-bottom:20px;">
        <div class="profile-id">
          <div class="profile-av">${initials(student.name)}</div>
          <div><div class="profile-name">${student.name}</div><div class="profile-meta">Roll #${student.roll??'—'} · ${cls.name}${cls.section}${cls.subject?' — '+cls.subject:''}${student.email?' · '+student.email:''}</div></div>
        </div>
      </div>
      <div class="grid-4" style="margin-bottom:20px;">
        <div class="card statbox"><div class="n" style="color:${pct<75?T.red:T.mintDeep}">${loading?'…':pct+'%'}</div><div class="l">Attendance (all-time)</div></div>
        <div class="card statbox"><div class="n" style="color:${T.mintDeep}">${loading?'…':present}</div><div class="l">Present Days</div></div>
        <div class="card statbox"><div class="n" style="color:${T.red}">${loading?'…':absent}</div><div class="l">Absent Days</div></div>
        <div class="card statbox"><div class="n" style="color:${T.amber}">${loading?'…':late}</div><div class="l">Late Days</div></div>
      </div>
      ${loading ? '' : renderStudentMarksAnalysis(student, marks)}
      <div class="card" style="padding:22px;">
        <div class="chart-title">Attendance History${total>20?` <span style="font-weight:500;color:var(--slate);font-size:12px;">(most recent 20 of ${total})</span>`:''}</div>
        ${loading?`<div class="empty"><div class="empty-txt">Loading attendance history…</div></div>`:
        attendance.length===0?`<div class="empty"><div class="empty-txt">No attendance recorded yet.</div></div>`:
        attendance.slice(0,20).map(h=>`<div class="hist-row"><span>${prettyDate(h.date)} · ${h.subject||''}</span><span class="badge" style="background:${STATUS_META[h.status].bg};color:${STATUS_META[h.status].color}">${ic(STATUS_META[h.status].icon).replace('<svg','<svg style="width:12px;height:12px"')} ${h.status}</span></div>`).join('')}
      </div>
    `;
  };

  if(pd.attendance && pd.marks){ draw(pd.attendance, pd.marks, false); return; }

  draw([], [], true);
  fetchParentChildData(session.organizationId, session.studentId).then(({attendance, marks})=>{
    if(!state.parentData) return;
    state.parentData.attendance = attendance;
    state.parentData.marks = marks;
    if(state.stage==='parent') draw(attendance, marks, false);
  }).catch(err=>{
    console.error('Failed to load parent child data:', err);
    if(state.stage==='parent') draw([], [], false);
    showToast("Couldn't load the student's records. Please try again.");
  });
}

/* ============================================================================
   LANDING/AUTH SHARED HANDLERS + KICKOFF
============================================================================ */
document.addEventListener('click', (e)=>{
  const go = e.target.closest('[data-action="go-signup"]'); if(go){ pushNav(); state.authMode='login'; state.stage='auth'; render(); return; }
  const goL = e.target.closest('[data-action="go-login"]'); if(goL){ pushNav(); state.authMode='login'; state.stage='auth'; render(); return; }
  const goP = e.target.closest('[data-action="go-parent-login"]'); if(goP){ pushNav(); state.authMode='parent'; state.stage='auth'; render(); return; }
  const backB = e.target.closest('[data-action="go-back"]'); if(backB){ goBack(); return; }
  const faq = e.target.closest('[data-action="toggle-faq"]'); if(faq){ const idx=Number(faq.getAttribute('data-idx')); state.faqOpen = state.faqOpen===idx? -1: idx; render(); return; }
  const wrap = document.getElementById('global-search-wrap');
  const results = document.getElementById('global-search-results');
  if(wrap && results && !wrap.contains(e.target)){ results.classList.remove('open'); results.innerHTML=''; }
});

/* Close any open modal when clicking outside the dialog (on the dark backdrop) */
document.addEventListener('mousedown', (e)=>{
  if(e.target.classList && e.target.classList.contains('modal-overlay')){
    const closeBtn = e.target.querySelector('#modal-close');
    if(closeBtn) closeBtn.click();
    else e.target.remove();
  }
});

</script>
</body>
