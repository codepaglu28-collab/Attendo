function openStudentModal(studentId, presetClassId){
  const data = state.data;
  const classes = data.classes || [];
  const departments = data.departments || [];
  if(classes.length===0){ showToast('Add a class to your timetable first'); state.view='classes'; render(); return; }
  const student = studentId ? data.students.find(s=>s.id===studentId) : null;
  const enrolledClassIds = new Set(student ? classesForStudent(student.id).map(c=>c.id) : (presetClassId && classes.some(c=>c.id===presetClassId) ? [presetClassId] : []));
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="card modal">
    <div class="modal-head"><h3>${student?'Edit Student':'Add Student'}</h3><button class="modal-close" id="modal-close">${ic('x')}</button></div>
    <form id="student-form">
      <div class="field"><label>Full Name</label><input required name="name" class="input" value="${student?student.name:''}"/></div>
      <div class="modal-grid2">
        <div class="field"><label>Roll Number</label><input required type="number" name="roll" class="input" value="${student?student.roll:''}"/></div>
        <div class="field"><label>Department</label><select name="departmentId" class="input" style="width:100%;"><option value="">— None —</option>${departments.map(d=>`<option value="${d.id}" ${student&&student.departmentId===d.id?'selected':''}>${d.name}</option>`).join('')}</select></div>
      </div>
      <div class="field">
        <label>Enrolled Classes / Subjects</label>
        <div style="display:flex;flex-direction:column;gap:6px;max-height:170px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;padding:10px 12px;">
          ${classes.map(c=>`<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;">
            <input type="checkbox" name="classIds" value="${c.id}" ${enrolledClassIds.has(c.id)?'checked':''}/> ${c.subject} — ${c.name}${c.section}
          </label>`).join('')}
        </div>
      </div>
      <div class="field"><label>Email</label><input required type="email" name="email" class="input" value="${student?student.email:''}"/></div>
      <div class="field"><label>Phone</label><input name="phone" class="input" value="${student?student.phone||'':''}"/></div>
      <div class="field"><label>Parent / Guardian</label><input name="guardian" class="input" value="${student?student.guardian||'':''}"/></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Student</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#modal-close').onclick = close;
  overlay.querySelector('#modal-cancel').onclick = close;
  overlay.querySelector('#student-form').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const selectedClassIds = fd.getAll('classIds');
    const payload = { name:fd.get('name'), roll:Number(fd.get('roll')), departmentId:fd.get('departmentId')||null, email:fd.get('email'), phone:fd.get('phone'), guardian:fd.get('guardian'), status:'Active', enrolled: student?student.enrolled:todayStr() };
    let studentId2;
    if(student){
      Object.assign(student, payload);
      studentId2 = student.id;
      showToast('Student updated');
    } else {
      studentId2 = `S${2000+Math.floor(Math.random()*9000)}`;
      data.students.push({ id: studentId2, ...payload });
      showToast('New student added');
    }
    // Reconcile enrollments: add newly-checked classes, remove unchecked ones.
    if(!data.enrollments) data.enrollments = [];
    const existingForStudent = new Set(data.enrollments.filter(en=>en.studentId===studentId2).map(en=>en.classId));
    for(const classId of selectedClassIds){
      if(!existingForStudent.has(classId)){
        data.enrollments.push({ id:`${classId}_${studentId2}`, studentId:studentId2, classId, departmentId: payload.departmentId, enrolledAt: todayStr() });
      }
    }
    data.enrollments = data.enrollments.filter(en => en.studentId!==studentId2 || selectedClassIds.includes(en.classId));
    await persist(data); close(); renderView();
  };
}
async function deleteStudent(sid){
  if(!confirm('Delete this student? This cannot be undone.')) return;
  const data = state.data;
  data.students = data.students.filter(s=>s.id!==sid);
  data.enrollments = (data.enrollments||[]).filter(en=>en.studentId!==sid);
  await persist(data);
  showToast('Student deleted');
  renderView();
}

function renderStudentProfile(root){
  const data = state.data;
  const student = data.students.find(s=>s.id===state._studentProfile);
  if(!student){ state._studentProfile=null; return renderStudents(root); }
  const enrolled = classesForStudent(student.id);
  const cachedHistory = state._studentHistoryCache && state._studentHistoryCache[student.id];

  const renderBody = (history, loading)=>{
    const present = history.filter(h=>h.status==='Present').length;
    const absent = history.filter(h=>h.status==='Absent').length;
    const late = history.filter(h=>h.status==='Late').length;
    const total = history.length;
    const pct = total ? Math.round(present/total*100) : 100;

    root.innerHTML = `
      <button class="back-link" id="back-to-students">${ic('arrowLeft')} Back to Students</button>
      <div class="card profile-head">
        <div class="profile-id">
          <div class="profile-av">${initials(student.name)}</div>
          <div><div class="profile-name">${student.name}</div><div class="profile-meta">Roll #${student.roll} · ${deptNameOf(student.departmentId)||'No department'} · ${enrolled.length?enrolled.map(c=>`${c.name}${c.section}`).join(', '):'No classes'} · ${student.email}</div></div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" id="profile-marks">${ic('bar')} View Marks</button>
          <button class="btn btn-outline" id="profile-edit">${ic('edit')} Edit</button>
          <button class="btn btn-danger" id="profile-delete">${ic('trash')} Delete</button>
        </div>
      </div>
      <div class="grid-4" style="margin-bottom:20px;">
        <div class="card statbox"><div class="n" style="color:${pct<(data.org.minAttendancePct??75)?T.red:T.mintDeep}">${loading?'…':pct+'%'}</div><div class="l">Attendance (all-time)</div></div>
        <div class="card statbox"><div class="n" style="color:${T.mintDeep}">${loading?'…':present}</div><div class="l">Present Days</div></div>
        <div class="card statbox"><div class="n" style="color:${T.red}">${loading?'…':absent}</div><div class="l">Absent Days</div></div>
        <div class="card statbox"><div class="n" style="color:${T.amber}">${loading?'…':late}</div><div class="l">Late Days</div></div>
      </div>
      <div class="card" style="padding:22px;">
        <div class="chart-title">Attendance History${total>15?` <span style="font-weight:500;color:var(--slate);font-size:12px;">(most recent 15 of ${total})</span>`:''}</div>
        ${loading?`<div class="empty"><div class="empty-txt">Loading full attendance history…</div></div>`:
        history.length===0?`<div class="empty"><div class="empty-txt">No attendance recorded yet.</div></div>`:
        history.slice(0,15).map(h=>`<div class="hist-row"><span>${prettyDate(h.date)} · ${h.subject}</span><span class="badge" style="background:${STATUS_META[h.status].bg};color:${STATUS_META[h.status].color}">${ic(STATUS_META[h.status].icon).replace('<svg','<svg style="width:12px;height:12px"')} ${h.status}</span></div>`).join('')}
      </div>
    `;
    document.getElementById('back-to-students').onclick = ()=>{ state._studentProfile=null; renderView(); };
    document.getElementById('profile-marks').onclick = ()=>{
      pushNav();
      state._studentProfile = null;
      state._markStudentFilter = student.id;
      state.view = 'marks';
      render();
    };
    document.getElementById('profile-edit').onclick = ()=> openStudentModal(student.id);
    document.getElementById('profile-delete').onclick = ()=> deleteStudent(student.id);
  };

  if(cachedHistory){
    renderBody(cachedHistory, false);
    return;
  }

  // Full multi-year history isn't preloaded (see loadData()'s 14-day
  // window) — fetch it on demand, scoped to just this one student via
  // an indexed query, so opening a profile stays fast no matter how
  // large the college-wide attendance collection has grown.
  renderBody([], true);
  fetchStudentAttendanceHistory(student.id).then(history=>{
    if(!state._studentHistoryCache) state._studentHistoryCache = {};
    state._studentHistoryCache[student.id] = history;
    if(state._studentProfile===student.id) renderBody(history, false);
  }).catch(err=>{
    console.error('Failed to load student attendance history:', err);
    if(state._studentProfile===student.id) renderBody([], false);
  });
}

  document.querySelectorAll('[data-action="class-delete"]').forEach(b=>b.onclick=()=> deleteClass(b.getAttribute('data-class')));
  const addBtn = document.getElementById('class-add'); if(addBtn) addBtn.onclick = ()=> openClassModal(null);
  const addBtnEmpty = document.getElementById('class-add-empty'); if(addBtnEmpty) addBtnEmpty.onclick = ()=> openClassModal(null);
}

  const overlay = document.createElement('div');

    <form id="class-form">

        <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">${cls?'Save Changes':'Add Class'}</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#modal-close').onclick = close;
  overlay.querySelector('#modal-cancel').onclick = close;
  overlay.querySelector('#class-form').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const days = fd.getAll('days');
    if(days.length===0){ showToast('Select at least one day'); return; }
    const time24 = fd.get('time');
    const timeLabel = time24 ? formatTime12(time24) : '';
    const payload = { name:fd.get('name'), section:fd.get('section'), subject:fd.get('subject'), teacher:fd.get('teacher'), room:fd.get('room'), departmentId:fd.get('departmentId')||null, time:timeLabel, time24, days };
    if(cls){
      Object.assign(cls, payload);
      showToast('Class updated');

function formatTime12(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const period = h>=12?'PM':'AM';
  const h12 = h%12===0?12:h%12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
async function deleteClass(classId){
  if(!confirm('Delete this class? Its attendance history will remain but the class will no longer appear in your timetable, and students will be unenrolled from it.')) return;
  const data = state.data;
  data.classes = (data.classes||[]).filter(c=>c.id!==classId);
  data.enrollments = (data.enrollments||[]).filter(en=>en.classId!==classId);
  await persist(data);
  showToast('Class removed from timetable');
  renderView();
}

   MARKS
============================================================================ */
function renderMarks(root){
  const data = state.data;
  const students = data.students || [];
  const classes = data.classes || [];
  const today = todayStr();
  const defaultFrom = (()=>{ const d=new Date(); d.setDate(d.getDate()-89); return d.toISOString().slice(0,10); })();

  const classFilter   = state._markClassFilter   || 'All';
  const subjectFilter = state._markSubjectFilter || 'All';
  const studentFilter = state._markStudentFilter || 'All';
  const minFilter = state._markMin !== undefined && state._markMin !== '' ? Number(state._markMin) : null;
  const maxFilter = state._markMax !== undefined && state._markMax !== '' ? Number(state._markMax) : null;
  const from = state._markFrom || defaultFrom;
  const to = state._markTo || today;

  const subjects = [...new Set(classes.map(c=>c.subject).filter(Boolean))];
  const singleStudent = studentFilter!=='All' ? students.find(s=>s.id===studentFilter) : null;

  const enrich = (rawMarks)=> rawMarks.map(m=>{
    const student = students.find(s=>s.id===m.studentId);
    const cls = classes.find(c=>c.id===m.classId);
    const pct = m.maxMarks ? Math.round((m.marks/m.maxMarks)*1000)/10 : 0;
    return { ...m, studentName: student?student.name:'Unknown Student', className: cls?`${cls.name}${cls.section}`:'—', subject: m.subject || (cls?cls.subject:'—'), pct };
  });

  const applyFilters = (enriched)=> enriched.filter(m=>{
    if(classFilter!=='All' && m.classId!==classFilter) return false;
    if(subjectFilter!=='All' && m.subject!==subjectFilter) return false;
    if(minFilter!==null && !isNaN(minFilter) && m.pct<minFilter) return false;
    if(maxFilter!==null && !isNaN(maxFilter) && m.pct>maxFilter) return false;
    return true;
  }).sort((a,b)=> b.date.localeCompare(a.date));

  const draw = (rawMarks, totalCountLabel, loading)=>{
    const enriched = enrich(rawMarks);
    const filtered = applyFilters(enriched);
    const avg = filtered.length ? Math.round((filtered.reduce((s,m)=>s+m.pct,0)/filtered.length)*10)/10 : 0;
    const highest = filtered.length ? Math.max(...filtered.map(m=>m.pct)) : 0;
    const lowest = filtered.length ? Math.min(...filtered.map(m=>m.pct)) : 0;

    root.innerHTML = `
      <div class="page-head">
        <div><h1>Marks</h1><p>${totalCountLabel}</p></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" id="marks-export" ${loading?'disabled':''}>${ic('download')} Export CSV</button>
          <button class="btn btn-primary" id="marks-add">${ic('plus')} Add Marks</button>
        </div>
      </div>

      <div class="filters-row">
        <select id="mk-student-filter" class="input">
          <option value="All" ${studentFilter==='All'?'selected':''}>All Students</option>
          ${students.map(s=>`<option value="${s.id}" ${studentFilter===s.id?'selected':''}>${s.name}</option>`).join('')}
        </select>
        ${singleStudent?'':`
          <div class="field" style="margin:0;"><label style="font-size:11.5px;">From</label><input type="date" id="mk-from" class="input" value="${from}" max="${today}"/></div>
          <div class="field" style="margin:0;"><label style="font-size:11.5px;">To</label><input type="date" id="mk-to" class="input" value="${to}" max="${today}"/></div>
        `}
        <select id="mk-class-filter" class="input">
          <option value="All" ${classFilter==='All'?'selected':''}>All Classes</option>
          ${classes.map(c=>`<option value="${c.id}" ${classFilter===c.id?'selected':''}>${c.name}${c.section}</option>`).join('')}
        </select>
        <select id="mk-subject-filter" class="input">
          <option value="All" ${subjectFilter==='All'?'selected':''}>All Subjects</option>
          ${subjects.map(s=>`<option value="${s}" ${subjectFilter===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <input id="mk-min" type="number" min="-500" max="100" class="input" style="width:110px;" placeholder="Min %" value="${state._markMin||''}"/>
        <input id="mk-max" type="number" min="-500" max="100" class="input" style="width:110px;" placeholder="Max %" value="${state._markMax||''}"/>
        ${(classFilter!=='All'||subjectFilter!=='All'||studentFilter!=='All'||state._markMin||state._markMax)?`<button class="btn btn-outline btn-sm" id="mk-clear">${ic('x').replace('<svg','<svg style="width:12px;height:12px"')} Clear filters</button>`:''}
      </div>

      <div class="grid-4" style="margin-bottom:20px;">
        <div class="card statbox"><div class="n">${loading?'…':filtered.length}</div><div class="l">Entries Shown</div></div>
        <div class="card statbox"><div class="n" style="color:${avg<40?T.red:avg<75?T.amber:T.mintDeep}">${loading?'…':avg+'%'}</div><div class="l">Average Score</div></div>
        <div class="card statbox"><div class="n" style="color:${T.mintDeep}">${loading?'…':highest+'%'}</div><div class="l">Highest Score</div></div>
        <div class="card statbox"><div class="n" style="color:${T.red}">${loading?'…':lowest+'%'}</div><div class="l">Lowest Score</div></div>
      </div>

      ${singleStudent && !loading ? renderStudentMarksAnalysis(singleStudent, filtered) : ''}
      ${singleStudent && loading ? `<div class="card" style="padding:22px;margin-bottom:20px;"><div class="empty"><div class="empty-txt">Loading ${singleStudent.name}'s full marks history…</div></div></div>` : ''}

      <div class="card table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Subject</th><th>Exam</th><th>Marks</th><th>%</th><th></th></tr></thead>
          <tbody>
            ${loading?`<tr><td colspan="8"><div class="empty"><div class="empty-txt">Loading marks…</div></div></td></tr>`:
            filtered.length===0?`<tr><td colspan="8"><div class="empty"><div class="empty-ic">${ic('bar').replace('<svg','<svg style="width:20px;height:20px;color:var(--slate)"')}</div><div class="empty-txt">No marks match your filters.</div></div></td></tr>`:
            filtered.map(m=>`<tr>
              <td>${prettyDate(m.date)}</td>
              <td><div class="tname"><div class="s-av" style="width:28px;height:28px;font-size:10px;">${initials(m.studentName)}</div><div class="n">${m.studentName}</div></div></td>
              <td>${m.className}</td>
              <td style="color:var(--slate)">${m.subject}</td>
              <td style="color:var(--slate)">${m.examName}</td>
              <td>${m.marks} / ${m.maxMarks}</td>
              <td style="font-weight:700;color:${m.pct<40?T.red:m.pct<75?T.amber:T.mintDeep}">${m.pct}%</td>
              <td>
                <div class="row-actions">
                  <button class="icon-btn" data-action="edit-mark" data-mid="${m.id}">${ic('edit').replace('<svg','<svg style="width:14px;height:14px;color:var(--slate)"')}</button>
                  <button class="icon-btn" data-action="delete-mark" data-mid="${m.id}">${ic('trash').replace('<svg','<svg style="width:14px;height:14px;color:'+T.red+'"')}</button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;

    document.getElementById('mk-class-filter').onchange = (e)=>{ state._markClassFilter=e.target.value; renderMarks(root); };
    document.getElementById('mk-subject-filter').onchange = (e)=>{ state._markSubjectFilter=e.target.value; renderMarks(root); };
    document.getElementById('mk-student-filter').onchange = (e)=>{ state._markStudentFilter=e.target.value; renderMarks(root); };
    document.getElementById('mk-min').onchange = (e)=>{ state._markMin=e.target.value; renderMarks(root); };
    document.getElementById('mk-max').onchange = (e)=>{ state._markMax=e.target.value; renderMarks(root); };
    const fromEl = document.getElementById('mk-from'); if(fromEl) fromEl.onchange = (e)=>{ state._markFrom=e.target.value; renderMarks(root); };
    const toEl = document.getElementById('mk-to'); if(toEl) toEl.onchange = (e)=>{ state._markTo=e.target.value; renderMarks(root); };
    const clearBtn = document.getElementById('mk-clear');
    if(clearBtn) clearBtn.onclick = ()=>{ state._markClassFilter='All'; state._markSubjectFilter='All'; state._markStudentFilter='All'; state._markMin=''; state._markMax=''; renderMarks(root); };

    document.getElementById('marks-add').onclick = ()=> openMarkModal(null, studentFilter!=='All'?studentFilter:null, classFilter!=='All'?classFilter:null);
    if(!loading){
      document.getElementById('marks-export').onclick = ()=>{
        const rows=[["Date","Student","Class","Subject","Exam","Marks","Max Marks","Percentage"], ...filtered.map(m=>[csvDateCell(m.date),m.studentName,m.className,m.subject,m.examName,m.marks,m.maxMarks,m.pct+'%'])];
        const csv = rows.map(r=>r.map((v,i)=> i===0 ? v : `"${String(v).replace(/"/g,'""')}"`).join(",")).join(String.fromCharCode(10));
        const blob = new Blob(['\uFEFF'+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='marks.csv'; a.click();
        showToast('Marks exported to CSV');
      };
    }
    document.querySelectorAll('[data-action="edit-mark"]').forEach(b=>b.onclick=()=> openMarkModal(b.getAttribute('data-mid')));
    document.querySelectorAll('[data-action="delete-mark"]').forEach(b=>b.onclick=()=> deleteMark(b.getAttribute('data-mid')));
  };

  /*
   * Marks now load as a rolling ~90-day window at boot (see loadData()),
   * since weekly exams across a whole college add up fast over the
   * years. Two on-demand paths cover everything outside that window:
   *   - a single student selected -> fetch THAT student's complete,
   *     all-time marks history (an indexed, scoped query — same
   *     pattern as fetchStudentAttendanceHistory)
   *   - browsing all students with a custom date range -> fetch that
   *     exact range fresh, same pattern as the History page
   */
  if(singleStudent){
    const cached = state._studentMarksCache && state._studentMarksCache[singleStudent.id];
    if(cached){ draw(cached, `${cached.length} mark${cached.length===1?'':'s'} for ${singleStudent.name}`, false); return; }
    draw([], `Loading marks for ${singleStudent.name}…`, true);
    const fb = window.attendoFirebase;
    const organizationId = getOrganizationId();
    fb.getDocs(fb.query(
      fb.collection(fb.db, 'organizations', organizationId, 'marks'),
      fb.where('studentId', '==', singleStudent.id)
    )).then(snap=>{
      const records = []; snap.forEach(d=>records.push({ id:d.id, ...d.data() }));
      if(!state._studentMarksCache) state._studentMarksCache = {};
      state._studentMarksCache[singleStudent.id] = records;
      if(state._markStudentFilter===singleStudent.id) draw(records, `${records.length} mark${records.length===1?'':'s'} for ${singleStudent.name}`, false);
    }).catch(err=>{
      console.error('Failed to load student marks history:', err);
      if(state._markStudentFilter===singleStudent.id) draw([], `Couldn't load marks for ${singleStudent.name}`, false);
    });
    return;
  }

  const cacheKey = `${from}_${to}`;
  if(state._marksCache && state._marksCache.key===cacheKey){
    draw(state._marksCache.records, `${state._marksCache.records.length} mark${state._marksCache.records.length===1?'':'s'} recorded, ${prettyDate(from)} – ${prettyDate(to)}`, false);
    return;
  }
  draw([], `Loading marks for ${prettyDate(from)} – ${prettyDate(to)}…`, true);
  const fb = window.attendoFirebase;
  const organizationId = getOrganizationId();
  fb.getDocs(fb.query(
    fb.collection(fb.db, 'organizations', organizationId, 'marks'),
    fb.where('date', '>=', from),
    fb.where('date', '<=', to)
  )).then(snap=>{
    const records = []; snap.forEach(d=>records.push({ id:d.id, ...d.data() }));
    state._marksCache = { key: cacheKey, records };
    if(state.view==='marks' && (state._markStudentFilter||'All')==='All') draw(records, `${records.length} mark${records.length===1?'':'s'} recorded, ${prettyDate(from)} – ${prettyDate(to)}`, false);
  }).catch(err=>{
    console.error('Failed to load marks range:', err);
    if(state.view==='marks') draw([], `Couldn't load marks`, false);
  });
}

function renderStudentMarksAnalysis(student, records){
  const bySubject = {};
  records.forEach(m=>{
    if(!bySubject[m.subject]) bySubject[m.subject] = [];
    bySubject[m.subject].push(m);
  });
  const subjectRows = Object.entries(bySubject).map(([subject, list])=>{
    const avg = Math.round((list.reduce((s,m)=>s+m.pct,0)/list.length)*10)/10;
    return {subject, avg, count:list.length};
  }).sort((a,b)=> b.avg-a.avg);

  const trend = [...records].sort((a,b)=> a.date.localeCompare(b.date));
  const maxPct = 100;

  return `<div class="card" style="padding:22px;margin-bottom:20px;">
    <div class="chart-title">${student.name} — Deep Analysis</div>
    ${records.length===0?`<div class="empty"><div class="empty-txt">No marks recorded for this student yet.</div></div>`:`
    <div class="mk-analysis-grid">
      <div>
        <div style="font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:10px;">Average by Subject</div>
        ${subjectRows.map(r=>`
          <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
              <span style="font-weight:600;">${r.subject}</span>
              <span style="color:${r.avg<40?T.red:r.avg<75?T.amber:T.mintDeep};font-weight:700;">${r.avg}% <span style="color:var(--slate);font-weight:500;">(${r.count})</span></span>
            </div>
            <div style="height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;">
              <div style="height:100%;width:${Math.min(r.avg,100)}%;border-radius:99px;background:${r.avg<40?T.red:r.avg<75?T.amber:T.mintDeep};"></div>
            </div>
          </div>
        `).join('')}
      </div>
      <div>
        <div style="font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:10px;">Score Trend (oldest → newest)</div>
        <div style="display:flex;align-items:flex-end;gap:6px;height:140px;">
          ${trend.map(m=>`
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;" title="${m.subject} — ${prettyDate(m.date)} — ${m.pct}%">
              <div style="width:100%;max-width:22px;border-radius:5px 5px 0 0;background:${m.pct<40?T.red:m.pct<75?T.amber:T.mintDeep};height:${Math.max((m.pct/maxPct)*100,4)}%;"></div>
            </div>
          `).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--slate);margin-top:6px;">
          <span>${trend.length?prettyDate(trend[0].date):''}</span>
          <span>${trend.length?prettyDate(trend[trend.length-1].date):''}</span>
        </div>
      </div>
    </div>`}
  </div>`;
}

function findMarkAnywhere(markId){
  if(!markId) return null;
  const inWorkingSet = (state.data.marks||[]).find(m=>m.id===markId);
  if(inWorkingSet) return inWorkingSet;
  if(state._marksCache){
    const hit = state._marksCache.records.find(m=>m.id===markId);
    if(hit) return hit;
  }
  if(state._studentMarksCache){
    for(const sid in state._studentMarksCache){
      const hit = state._studentMarksCache[sid].find(m=>m.id===markId);
      if(hit) return hit;
    }
  }
  return null;
}
function openMarkModal(markId, presetStudentId, presetClassId){

  const mark = markId ? findMarkAnywhere(markId) : null;
  const defaultStudentId = mark ? mark.studentId : (presetStudentId || students[0].id);

    <form id="mark-form">

        <div class="field"><label>Student</label><select name="studentId" class="input" style="width:100%;">${students.map(s=>`<option value="${s.id}" ${defaultStudentId===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>

      </div>
      <div class="modal-grid2">
        <div class="field"><label>Subject</label><input name="subject" class="input" placeholder="Maths" value="${mark?mark.subject:''}"/></div>
        <div class="field"><label>Exam / Test Name</label><input required name="examName" class="input" placeholder="Unit Test 1" value="${mark?mark.examName:''}"/></div>
      </div>
      <div class="modal-grid2">
        <div class="field"><label>Marks Obtained</label><input required type="number" min="-500" step="0.5" name="marks" class="input" value="${mark?mark.marks:''}"/></div>
        <div class="field"><label>Maximum Marks</label><input required type="number" min="1" step="0.5" name="maxMarks" class="input" value="${mark?mark.maxMarks:100}"/></div>
      </div>
      <div class="field"><label>Date</label><input required type="date" name="date" class="input" value="${mark?mark.date:todayStr()}"/></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Marks</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#modal-close').onclick = close;
  overlay.querySelector('#modal-cancel').onclick = close;
  overlay.querySelector('#mark-form').onsubmit = async (e)=>{

    if(marksVal>maxVal){ showToast('Marks obtained cannot exceed maximum marks'); return; }
    const payload = {
      studentId: fd.get('studentId'),
      classId: fd.get('classId'),
      subject: String(fd.get('subject')||'').trim() || (cls?cls.subject:''),
      examName: String(fd.get('examName')).trim(),
      marks: marksVal,
      maxMarks: maxVal,
      date: fd.get('date')
    };
    if(!data.marks) data.marks = [];
    if(mark){
      Object.assign(mark, payload);
      // The found mark might have come from an on-demand cache rather
      // than data.marks (see findMarkAnywhere) — make sure it's part of
      // the working set persist() actually diffs against, or the edit
      // would only update the display cache and never reach Firestore.
      if(!data.marks.some(m=>m.id===mark.id)) data.marks.push(mark);
      showToast('Marks updated');
    } else {
      const id = `M${Date.now()}${Math.floor(Math.random()*1000)}`;
      data.marks.push({ id, ...payload });
      showToast('Marks added');
    }
    // Invalidate on-demand caches so the Marks page re-fetches fresh
    // data (including this change) instead of showing stale results.
    state._marksCache = null;
    state._studentMarksCache = null;
    await persist(data); close(); renderView();
  };
  overlay.querySelector('[name="studentId"]').onchange = (e)=>{
    const firstClass = classesForStudent(e.target.value)[0];
    if(firstClass){ const clsSel = overlay.querySelector('[name="classId"]'); if(clsSel) clsSel.value = firstClass.id; }
  };
}

async function deleteMark(markId){
  if(!confirm('Delete this marks entry? This cannot be undone.')) return;
  const data = state.data;
  data.marks = (data.marks||[]).filter(m=>m.id!==markId);
  if(!state._pendingMarkDeletes) state._pendingMarkDeletes = [];
  state._pendingMarkDeletes.push(markId);
  // Also drop it from any on-demand caches so it doesn't reappear from a stale fetch.
  if(state._marksCache) state._marksCache.records = (state._marksCache.records||[]).filter(m=>m.id!==markId);
  if(state._studentMarksCache){
    for(const sid in state._studentMarksCache){
      state._studentMarksCache[sid] = state._studentMarksCache[sid].filter(m=>m.id!==markId);
    }
  }
  await persist(data);
  showToast('Marks entry deleted');
  renderView();
}

============================================================================ */
function renderHistory(root){
  const data = state.data;
  const classFilter = state._histClass || 'All', statusFilter = state._histStatus || 'All';
  const today = todayStr();
  const defaultFrom = (()=>{ const d=new Date(); d.setDate(d.getDate()-13); return d.toISOString().slice(0,10); })();
  const from = state._histFrom || defaultFrom;
  const to = state._histTo || today;

  const buildRows = (sessions)=>{
    const rows = [];
    Object.values(sessions).forEach(rec=>{
      if(classFilter!=='All' && rec.classId!==classFilter) return;
      const clsObj = (data.classes||[]).find(c=>c.id===rec.classId);
      const clsLabel = clsObj ? `${clsObj.name}${clsObj.section||''}` : (rec.classId||'—');
      Object.entries(rec.records).forEach(([sid,status])=>{
        if(statusFilter!=='All' && status!==statusFilter) return;
        const student = data.students.find(s=>s.id===sid); if(!student) return;
        rows.push({date:rec.date, student:student.name, cls:clsLabel, subject:rec.subject, status});
      });
    });
    rows.sort((a,b)=>b.date.localeCompare(a.date));
    return rows;
  };

  const draw = (rows, loading)=>{
    const shown = rows.slice(0,500);
    root.innerHTML = `
      <div class="page-head"><h1>Attendance History</h1><button class="btn btn-outline" id="hist-export" ${loading?'disabled':''}>${ic('download')} Export CSV</button></div>
      <div class="filters-row">
        <div class="field" style="margin:0;"><label style="font-size:11.5px;">From</label><input type="date" id="hist-from" class="input" value="${from}" max="${today}"/></div>
        <div class="field" style="margin:0;"><label style="font-size:11.5px;">To</label><input type="date" id="hist-to" class="input" value="${to}" max="${today}"/></div>
        <select id="hist-class" class="input"><option value="All" ${classFilter==='All'?'selected':''}>All Classes</option>${(data.classes||[]).map(c=>`<option value="${c.id}" ${classFilter===c.id?'selected':''}>${c.name}${c.section}</option>`).join('')}</select>
        <select id="hist-status" class="input"><option value="All" ${statusFilter==='All'?'selected':''}>All Statuses</option>${STATUSES.map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>
      <div class="card table-wrap" style="max-height:520px;overflow-y:auto;">
        <table>
          <thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Subject</th><th>Status</th></tr></thead>
          <tbody>
            ${loading?`<tr><td colspan="5"><div class="empty"><div class="empty-txt">Loading attendance for ${prettyDate(from)} – ${prettyDate(to)}…</div></div></td></tr>`:
            shown.length===0?`<tr><td colspan="5"><div class="empty"><div class="empty-txt">No attendance recorded in this range.</div></div></td></tr>`:
            shown.map(r=>`<tr><td>${prettyDate(r.date)}</td><td style="font-weight:600;">${r.student}</td><td style="color:var(--slate)">${r.cls}</td><td style="color:var(--slate)">${r.subject}</td><td><span class="badge" style="background:${STATUS_META[r.status].bg};color:${STATUS_META[r.status].color}">${ic(STATUS_META[r.status].icon).replace('<svg','<svg style="width:12px;height:12px"')} ${r.status}</span></td></tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${!loading && rows.length>500?`<div style="font-size:12px;color:var(--slate);margin-top:10px;">Showing the most recent 500 of ${rows.length} matching records. Narrow the date range or filters to see the rest, or use Export CSV for the full set.</div>`:''}
    `;
    document.getElementById('hist-from').onchange = (e)=>{ state._histFrom=e.target.value; renderHistory(root); };
    document.getElementById('hist-to').onchange = (e)=>{ state._histTo=e.target.value; renderHistory(root); };
    document.getElementById('hist-class').onchange = (e)=>{ state._histClass=e.target.value; renderHistory(root); };
    document.getElementById('hist-status').onchange = (e)=>{ state._histStatus=e.target.value; renderHistory(root); };
    if(!loading){
      document.getElementById('hist-export').onclick = ()=>{
        const r=[["Date","Student","Class","Subject","Status"], ...rows.map(x=>[csvDateCell(x.date),x.student,x.cls,x.subject,x.status])];
        const csv = r.map(row=>row.map((v,i)=> i===0 ? v : `"${String(v).replace(/"/g,'""')}"`).join(",")).join(String.fromCharCode(13)+String.fromCharCode(10));
        const blob = new Blob(['\uFEFF'+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='attendance-history.csv'; a.click();
      };
    }
  };

  const cacheKey = `${from}_${to}`;
  if(state._histCache && state._histCache.key===cacheKey){
    draw(buildRows(state._histCache.sessions), false);
    return;
  }

  // Only the last 14 days are preloaded (see loadData()); any other range
  // — including everything History defaults to browsing further back —
  // is fetched fresh here with an explicit date-bounded Firestore query,
  // so browsing years of history never means loading years of history.
  draw([], true);
  const fb = window.attendoFirebase;
  const organizationId = getOrganizationId();
  fb.getDocs(fb.query(
    fb.collection(fb.db, 'organizations', organizationId, 'attendanceSessions'),
    fb.where('date', '>=', from),
    fb.where('date', '<=', to)
  )).then(snap=>{
    const sessions = {};
    snap.forEach(docSnap=>{ sessions[docSnap.id] = docSnap.data(); });
    state._histCache = { key: cacheKey, sessions };
    if(state.view==='history') draw(buildRows(sessions), false);
  }).catch(err=>{
    console.error('Failed to load attendance history range:', err);
    if(state.view==='history') draw([], false);
  });
}

/* ============================================================================
   ONE-TIME STRUCTURE MIGRATION
   ------------------------------------------------------------------------
   For accounts created before multi-class enrollment support. Old data
   shapes it upgrades:
     - student.classId / student.section (single class)  -> an enrollments doc
     - class.department (free text)                      -> a real departments doc + class.departmentId
     - the old flat "attendance" collection                -> attendanceSessions + attendanceRecords

   Deterministic IDs throughout (enrollment id = `${classId}_${studentId}`,
   session/record ids reuse the original date|classId key) make this
   idempotent — running it again just re-writes the same documents rather
   than creating duplicates. Nothing in the OLD "attendance" collection is
   deleted, so it stays as a backup until you're confident and remove it
   yourself from the Firebase console.
============================================================================ */
async function runStructureMigration(){
  const statusEl = document.getElementById('migration-status');
  const setStatus = (msg)=>{ if(statusEl) statusEl.textContent = msg; };
  const btn = document.getElementById('run-migration');
  if(btn) btn.disabled = true;

  try{
    const fb = window.attendoFirebase;
    const user = fb.auth.currentUser;
    if(!user){ setStatus('Not signed in.'); return; }
    const organizationId = getOrganizationId();
    const data = state.data;

    setStatus('Migrating departments…');

    // 1) Turn any legacy free-text class.department values into real department docs.
    if(!data.departments) data.departments = [];
    const deptByName = new Map(data.departments.map(d=>[d.name.toLowerCase(), d]));
    for(const cls of (data.classes||[])){
      const legacyName = cls.department; // old free-text field, if present
      if(cls.departmentId) continue; // already migrated
      if(!legacyName) continue;
      let dept = deptByName.get(legacyName.toLowerCase());
      if(!dept){
        dept = { id:`DEPT${Date.now().toString(36)}${Math.floor(Math.random()*900+100)}`, name: legacyName, code:'' };
        data.departments.push(dept);
        deptByName.set(legacyName.toLowerCase(), dept);
      }
      cls.departmentId = dept.id;
    }

    setStatus('Migrating student class assignments…');

    // 2) Turn each student's old single classId into an enrollment.
    if(!data.enrollments) data.enrollments = [];
    const existingEnrollIds = new Set(data.enrollments.map(e=>e.id));
    let newEnrollments = 0;
    for(const s of (data.students||[])){
      const legacyClassId = s.classId; // old single-class field, if present
      if(!legacyClassId) continue;
      const enrollId = `${legacyClassId}_${s.id}`;
      if(existingEnrollIds.has(enrollId)) continue;
      const cls = (data.classes||[]).find(c=>c.id===legacyClassId);
      data.enrollments.push({ id: enrollId, studentId: s.id, classId: legacyClassId, departmentId: cls?cls.departmentId:null, enrolledAt: s.enrolled||todayStr() });
      existingEnrollIds.add(enrollId);
      newEnrollments++;
    }

    await persist(data);

    setStatus('Migrating attendance history — this can take a while for large histories…');

    // 3) Copy the OLD flat "attendance" collection into the new
    // attendanceSessions + attendanceRecords structure.
    const oldAttendanceSnap = await fb.getDocs(
      fb.collection(fb.db, 'organizations', organizationId, 'attendance')
    );

    let sessionsMigrated = 0, recordsMigrated = 0;
    const ops = [];
    const sessionsCollection = fb.collection(fb.db, 'organizations', organizationId, 'attendanceSessions');
    const recordsCollection = fb.collection(fb.db, 'organizations', organizationId, 'attendanceRecords');

    oldAttendanceSnap.forEach(docSnap=>{
      const old = docSnap.data();
      const [date, classId] = docSnap.id.split('|');
      if(!date || !classId || !old.records) return;
      const cls = (data.classes||[]).find(c=>c.id===classId);
      const sessionRef = fb.doc(sessionsCollection, docSnap.id);
      ops.push(batch => batch.set(sessionRef, {
        classId, date, subject: old.subject||(cls?cls.subject:''), teacher: old.teacher||(cls?cls.teacher:''),
        departmentId: cls?cls.departmentId:null, records: old.records
      }, { merge:true }));
      sessionsMigrated++;
      for(const [studentId, status] of Object.entries(old.records)){
        const recordId = `${date}|${classId}|${studentId}`;
        const ref = fb.doc(recordsCollection, recordId);
        ops.push(batch => batch.set(ref, {
          studentId, classId, departmentId: cls?cls.departmentId:null,
          subject: old.subject||(cls?cls.subject:''), date, status
        }, { merge:true }));
        recordsMigrated++;
      }
    });

    if(ops.length){
      await _commitInChunks(fb, ops);
    }

    setStatus(`Done — ${newEnrollments} enrollment${newEnrollments===1?'':'s'} created, ${sessionsMigrated} attendance session${sessionsMigrated===1?'':'s'} and ${recordsMigrated} attendance record${recordsMigrated===1?'':'s'} migrated. Reloading…`);
    showToast('Migration complete');

    // Reload from Firestore so the app picks up the migrated structure.
    state.data = await loadData();
    renderView();

  } catch(error){
    console.error('Migration failed:', error);
    setStatus('Migration failed — see console for details.');
    showToast('Migration failed');
  } finally {
    if(btn) btn.disabled = false;
  }
}

function renderSettings(root){
  const data = state.data;
  const theme = state._theme || 'light';
  const departments = data.departments || [];
  root.innerHTML = `
    <h1 style="font-size:24px;font-weight:800;margin-bottom:22px;max-width:600px;">Settings</h1>
    <div style="max-width:600px;">
      <div class="card" style="padding:22px;margin-bottom:18px;">
        <div class="settings-title">Organization</div>
        <div class="field"><label>Organization Name</label><input id="set-org-name" class="input" value="${data.org.name}"/></div>
        <div class="field"><label>Organization Type</label><select id="set-org-type" class="input" style="width:100%;">${["School","College","University","Coaching Institute","Tuition Center","Training Institute","Company","Other"].map(t=>`<option ${data.org.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
      </div>
      <div class="card" style="padding:22px;margin-bottom:18px;">
        <div class="settings-title">Departments</div>
        <div style="font-size:12.5px;color:var(--slate);margin-bottom:14px;">Used to group students and classes (e.g. Computer Science, Mechanical, Commerce).</div>
        ${departments.length===0?`<div style="font-size:13px;color:var(--slate);margin-bottom:14px;">No departments yet.</div>`:
        departments.map(d=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--border);">
          <div><span style="font-weight:600;">${d.name}</span>${d.code?` <span style="color:var(--slate);font-size:12px;">(${d.code})</span>`:''}</div>
          <button class="icon-btn" data-action="delete-dept" data-did="${d.id}">${ic('trash').replace('<svg','<svg style="width:14px;height:14px;color:'+T.red+'"')}</button>
        </div>`).join('')}
        <div style="display:flex;gap:8px;margin-top:14px;">
          <input id="new-dept-name" class="input" placeholder="Department name (e.g. Computer Science)" style="flex:2;"/>
          <input id="new-dept-code" class="input" placeholder="Code (e.g. CSE)" style="flex:1;"/>
          <button class="btn btn-outline" id="add-dept">${ic('plus')} Add</button>
        </div>
      </div>
      <div class="card" style="padding:22px;margin-bottom:18px;">
        <div class="settings-title">Attendance Rules</div>
        <div class="modal-grid2">
          <div class="field"><label id="late-label">Late Threshold (${data.org.lateThresholdMin ?? 10} min after start)</label><input type="range" min="0" max="30" value="${data.org.lateThresholdMin ?? 10}" id="late-range" style="width:100%;accent-color:var(--blue);"/></div>
          <div class="field"><label id="min-label">Minimum Attendance % (${data.org.minAttendancePct ?? 75}%)</label><input type="range" min="50" max="100" value="${data.org.minAttendancePct ?? 75}" id="min-range" style="width:100%;accent-color:var(--blue);"/></div>
        </div>
      </div>
      <div class="card" style="padding:22px;margin-bottom:18px;">
        <div class="settings-title">Appearance</div>
        <div class="theme-row">
          ${['light','dark','system'].map(t=>`<button class="theme-opt ${theme===t?'active':''}" data-action="set-theme" data-theme="${t}">${t}</button>`).join('')}
        </div>
        <div style="font-size:12px;color:var(--slate);margin-top:8px;">Default theme is White + Blue + Mint.</div>
      </div>
      <div class="card" style="padding:22px;margin-bottom:22px;">
        <div class="settings-title">Data Structure Migration</div>
        <div style="font-size:12.5px;color:var(--slate);margin-bottom:14px;line-height:1.6;">
          One-time upgrade for accounts created before multi-class enrollment support. Converts each student's old single class into an enrollment record (so they keep their class, but can now be added to more), and copies existing attendance history into the new scalable storage. Safe to run more than once — it never deletes your original data.
        </div>
        <button class="btn btn-outline" id="run-migration">${ic('zap')} Run Migration</button>
        <div id="migration-status" style="font-size:12.5px;color:var(--slate);margin-top:10px;"></div>
      </div>
      <button class="btn btn-primary" id="save-settings">${ic('save')} Save Settings</button>
    </div>
  `;
  document.getElementById('late-range').oninput = (e)=>{ document.getElementById('late-label').textContent = `Late Threshold (${e.target.value} min after start)`; };
  document.getElementById('min-range').oninput = (e)=>{ document.getElementById('min-label').textContent = `Minimum Attendance % (${e.target.value}%)`; };
  document.querySelectorAll('[data-action="set-theme"]').forEach(b=>b.onclick=()=>{ setTheme(b.getAttribute('data-theme')); renderSettings(root); });
  document.getElementById('add-dept').onclick = async ()=>{
    const name = document.getElementById('new-dept-name').value.trim();
    const code = document.getElementById('new-dept-code').value.trim();
    if(!name){ showToast('Enter a department name'); return; }
    if(!data.departments) data.departments = [];
    const id = `DEPT${Date.now().toString(36)}${Math.floor(Math.random()*900+100)}`;
    data.departments.push({ id, name, code });
    await persist(data); showToast('Department added'); renderSettings(root);
  };
  document.querySelectorAll('[data-action="delete-dept"]').forEach(b=>b.onclick=async ()=>{
    if(!confirm('Delete this department? Students and classes assigned to it will keep their other data but lose this department link.')) return;
    const did = b.getAttribute('data-did');
    data.departments = data.departments.filter(d=>d.id!==did);
    (data.students||[]).forEach(s=>{ if(s.departmentId===did) s.departmentId = null; });
    (data.classes||[]).forEach(c=>{ if(c.departmentId===did) c.departmentId = null; });
    await persist(data); showToast('Department deleted'); renderSettings(root);
  });
  document.getElementById('run-migration').onclick = ()=> runStructureMigration();
  document.getElementById('save-settings').onclick = async ()=>{
    data.org.name = document.getElementById('set-org-name').value;
    data.org.type = document.getElementById('set-org-type').value;
    data.org.lateThresholdMin = Number(document.getElementById('late-range').value);
    data.org.minAttendancePct = Number(document.getElementById('min-range').value);
    await persist(data); showToast('Settings saved');
  };
}

/* ============================================================================
   LANDING/AUTH SHARED HANDLERS + KICKOFF
============================================================================ */
document.addEventListener('click', (e)=>{
  const go = e.target.closest('[data-action="go-signup"]'); if(go){ pushNav(); state.authMode='signup'; state.stage='auth'; render(); return; }
  const goL = e.target.closest('[data-action="go-login"]'); if(goL){ pushNav(); state.authMode='login'; state.stage='auth'; render(); return; }
  const backB = e.target.closest('[data-action="go-back"]'); if(backB){ goBack(); return; }
  const faq = e.target.closest('[data-action="toggle-faq"]'); if(faq){ const idx=Number(faq.getAttribute('data-idx')); state.faqOpen = state.faqOpen===idx? -1: idx; render(); return; }
  const wrap = document.getElementById('global-search-wrap');
  const results = document.getElementById('global-search-results');
  if(wrap && results && !wrap.contains(e.target)){ results.classList.remove('open'); results.innerHTML=''; }
});
